<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Arcade Library</title>

<link rel="stylesheet" href="library.css">

</head>

</head>


<body>

<div class="container">


<!-- =====================================
     HEADER
====================================== -->

<div class="header">

    <h1>Vocabulary Arcade</h1>

    <p>
        Choose a vocabulary set and pick your game.
    </p>

</div>


<!-- =====================================
     SEARCH / FILTERS
====================================== -->

<div class="controls">

    <div class="searchControls">

        <input
            id="search"
            type="text"
            placeholder="Search vocabulary lists..."
        >

        <a
            class="createKitsButton"
            href="https://github.com/alexjeffersonmarsh/VocabularyArcade/blob/main/setup.html"
        >
            ➕ Create Kits
        </a>

    </div>

    <select id="languageFilter">

        <option value="all">
            All Languages
        </option>

    </select>

    <select id="recentSelect">

        <option value="all">
            Most Recent Additions
        </option>

    </select>

</div>

<!-- =====================================
     RESULTS COUNT
====================================== -->

<div
    class="stats"
    id="stats"
>

    Connecting to vocabulary library...

</div>


<!-- =====================================
     RESULTS
====================================== -->

<div id="results">

    <div class="loading">

        Loading vocabulary library...

    </div>

</div>

</div>


<!-- =========================================
     GAME CHOICE MODAL
========================================= -->

<div
    id="gameModal"
    class="modalOverlay"
>

    <div class="gameModal">

        <h2 id="modalTitle">
            Choose Your Game
        </h2>

        <p>
            How would you like to practice this vocabulary?
        </p>


        <div class="modalGames">


            <!-- GEMWORDS -->

            <button
                id="modalGemButton"
                class="modalGameButton modalGem"
            >

                💎<br>

                GemWords

            </button>


            <!-- BUBBLEWORD -->

            <button
                id="modalBubbleButton"
                class="modalGameButton modalBubble"
            >

                🫧<br>

                BubbleWord

            </button>


            <!-- MATCHWORD -->

            <button
                id="modalMatchButton"
                class="modalGameButton modalMatch"
            >

                🎯<br>

                MatchWord

            </button>


            <!-- FLASHWORD -->

            <button
                id="modalFlashButton"
                class="modalGameButton modalFlash"
            >

                🃏<br>

                FlashWord

            </button>


        </div>


        <button
            id="closeModal"
            class="closeModal"
        >

            Cancel

        </button>

    </div>

</div>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {

    getFirestore,

    collection,

    getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

let db;

try {

    const app =
        initializeApp(
            firebaseConfig
        );

    db =
        getFirestore(app);

    console.log(
        "Firebase initialized successfully."
    );

}

catch (error) {

    console.error(
        "Firebase initialization failed:",
        error
    );

    document.getElementById(
        "stats"
    ).textContent =
        "Firebase connection failed.";

    document.getElementById(
        "results"
    ).innerHTML = `

        <div class="errorBox">

            <strong>
                Firebase could not be initialized.
            </strong>

            <br><br>

            ${escapeHtml(error.message)}

        </div>

    `;

}


/* =========================================
   GAME URLS
========================================= */

const GEMWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/gemword.html";

const BUBBLEWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/bubbleword.html";

const MATCHWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/matchword.html";

const FLASHWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/flashcard.html";


/* =========================================
   DATA
========================================= */

let allLists = [];

let selectedList = null;


/* =========================================
   LOAD LIBRARY
========================================= */

async function loadLibrary() {

    if (!db) {
        return;
    }

    try {

        console.log(
            "Connecting to vocabSets..."
        );


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "vocabSets"
                )
            );


        console.log(
            "Firebase documents found:",
            snapshot.size
        );


        allLists = [];


        snapshot.forEach(doc => {

            const data =
                doc.data();


            console.log(
                "Vocabulary set:",
                doc.id,
                data
            );


            allLists.push({

                id: doc.id,

                ...data

            });

        });


        /*
         * Newest first.
         */

        allLists.sort(
            (a, b) =>
                getTimestamp(b.createdAt)
                -
                getTimestamp(a.createdAt)
        );


        populateLanguageFilter();

        populateRecentDropdown();

        renderLists();

    }

    catch(error) {

        console.error(
            "Firestore error:",
            error
        );


        document.getElementById(
            "stats"
        ).textContent =
            "Unable to access vocabulary library.";


        document.getElementById(
            "results"
        ).innerHTML = `

            <div class="errorBox">

                <strong>
                    Could not load the vocabulary library.
                </strong>

                <br><br>

                <strong>Firebase error:</strong><br>

                ${escapeHtml(error.message)}

                <br><br>

                Open the browser developer console
                (F12 → Console) for additional details.

            </div>

        `;

    }

}


/* =========================================
   TIMESTAMP
========================================= */

function getTimestamp(timestamp) {

    if (!timestamp) {
        return 0;
    }


    /*
     * Firebase Timestamp
     */

    if (
        typeof timestamp === "object"
        &&
        typeof timestamp.seconds === "number"
    ) {

        return timestamp.seconds;

    }


    /*
     * JavaScript Date
     */

    if (timestamp instanceof Date) {

        return timestamp.getTime();

    }


    /*
     * String / numeric date
     */

    const parsed =
        new Date(timestamp).getTime();


    return isNaN(parsed)
        ? 0
        : parsed;

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(timestamp) {

    const value =
        getTimestamp(timestamp);


    if (!value) {
        return "";
    }


    const milliseconds =
        value < 10000000000
            ? value * 1000
            : value;


    return new Date(
        milliseconds
    ).toLocaleDateString();

}


/* =========================================
   NEW LIST CHECK
========================================= */

function isNewList(timestamp) {

    const created =
        getTimestamp(timestamp);


    if (!created) {
        return false;
    }


    const milliseconds =
        created < 10000000000
            ? created * 1000
            : created;


    const sevenDays =
        7 * 24 * 60 * 60 * 1000;


    return (
        Date.now() - milliseconds
        <= sevenDays
    );

}


/* =========================================
   LANGUAGE FILTER
========================================= */

function populateLanguageFilter() {

    const filter =
        document.getElementById(
            "languageFilter"
        );


    filter.innerHTML = `

        <option value="all">
            All Languages
        </option>

    `;


    const languages = [

        ...new Set(

            allLists

                .map(
                    list =>
                        list.language
                )

                .filter(Boolean)

        )

    ].sort();


    languages.forEach(language => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            language;

        option.textContent =
            language;


        filter.appendChild(
            option
        );

    });

}


/* =========================================
   RECENT DROPDOWN
========================================= */

function populateRecentDropdown() {

    const dropdown =
        document.getElementById(
            "recentSelect"
        );


    dropdown.innerHTML = `

        <option value="all">
            Most Recent Additions
        </option>

    `;


    /*
     * Show ten newest lists.
     */

    allLists
        .slice(0, 10)
        .forEach(list => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                list.id;


            option.textContent =
                list.title ||
                "Untitled List";


            dropdown.appendChild(
                option
            );

        });

}


/* =========================================
   RENDER LISTS
========================================= */

function renderLists() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const selectedLanguage =
        document
            .getElementById(
                "languageFilter"
            )
            .value;


    const selectedRecent =
        document
            .getElementById(
                "recentSelect"
            )
            .value;


    const filtered =
        allLists.filter(list => {


            const searchableText = `

                ${list.title || ""}

                ${list.language || ""}

                ${list.description || ""}

            `.toLowerCase();


            const searchMatch =
                searchableText.includes(
                    search
                );


            const languageMatch =
                selectedLanguage === "all"
                ||
                list.language ===
                    selectedLanguage;


            const recentMatch =
                selectedRecent === "all"
                ||
                list.id === selectedRecent;


            return (
                searchMatch
                &&
                languageMatch
                &&
                recentMatch
            );

        });


    document.getElementById(
        "stats"
    ).textContent =

        `${filtered.length} vocabulary list(s) found`;


    const container =
        document.getElementById(
            "results"
        );


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="noResults">

                No vocabulary lists found.

            </div>

        `;

        return;

    }


    filtered.forEach(list => {

        const createdDate =
            formatDate(
                list.createdAt
            );


        const isNew =
            isNewList(
                list.createdAt
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        /*
         * Make the entire card clickable.
         */

        card.addEventListener(
            "click",
            () => {

                openGameChooser(list);

            }
        );


        const title =
            escapeHtml(
                list.title ||
                "Untitled List"
            );


        const language =
            escapeHtml(
                list.language ||
                "Unknown Language"
            );


        card.innerHTML = `

            <div class="cardInfo">

                <div class="title">

                    ${title}

                    ${
                        isNew
                            ? `
                                <span class="newBadge">
                                    New
                                </span>
                              `
                            : ""
                    }

                </div>


                <div class="language">

                    ${language}

                </div>


                <div class="meta">

                    ${list.itemCount || 0}
                    words

                    ${
                        createdDate
                            ? " • Added " +
                              createdDate
                            : ""
                    }

                </div>

            </div>


            <div class="gameButtons">


                <a
                    class="playButton gemButton"
                    href="${GEMWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    💎 GemWords
                </a>


                <a
                    class="playButton bubbleButton"
                    href="${BUBBLEWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    🫧 BubbleWord
                </a>


                <a
                    class="playButton matchButton"
                    href="${MATCHWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    🎯 MatchWord
                </a>


                <a
                    class="playButton flashButton"
                    href="${FLASHWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    🃏 FlashWord
                </a>


            </div>

        `;


        /*
         * Prevent game buttons from
         * opening the game chooser.
         */

        card
            .querySelectorAll(".playButton")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                    }
                );

            });


        container.appendChild(
            card
        );

    });

}


/* =========================================
   GAME CHOOSER
========================================= */

function openGameChooser(list) {

    selectedList = list;


    document.getElementById(
        "modalTitle"
    ).textContent =

        list.title ||
        "Choose Your Game";


    document.getElementById(
        "gameModal"
    ).classList.add(
        "show"
    );

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeGameChooser() {

    selectedList = null;

    document.getElementById(
        "gameModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================
   GEMWORDS BUTTON
========================================= */

document
    .getElementById(
        "modalGemButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${GEMWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


/* =========================================
   BUBBLEWORD BUTTON
========================================= */

document
    .getElementById(
        "modalBubbleButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${BUBBLEWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


/* =========================================
   MATCHWORD BUTTON
========================================= */

document
    .getElementById(
        "modalMatchButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${MATCHWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


/* =========================================
   FLASHWORD BUTTON
========================================= */

document
    .getElementById(
        "modalFlashButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${FLASHWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


/* =========================================
   CLOSE BUTTON
========================================= */

document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeGameChooser
    );


/* =========================================
   CLOSE MODAL OUTSIDE
========================================= */

document
    .getElementById(
        "gameModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "gameModal"
            ) {

                closeGameChooser();

            }

        }
    );


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   SEARCH / FILTER EVENTS
========================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderLists
    );


document
    .getElementById("languageFilter")
    .addEventListener(
        "change",
        renderLists
    );


document
    .getElementById("recentSelect")
    .addEventListener(
        "change",
        renderLists
    );


/* =========================================
   START LIBRARY
========================================= */

loadLibrary();

</script>

</body>

</html>
