<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Vocabulary Arcade Library</title>

<style>

/* =========================================
   GLOBAL
========================================= */

body {

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #f5f7fa 0%,
            #e9edf2 100%
        );

    margin: 0;
    padding: 30px;

    color: #222;
}

.container {

    max-width: 1100px;

    margin: auto;
}


/* =========================================
   HEADER
========================================= */

.header {

    text-align: center;

    margin-bottom: 30px;
}

.header h1 {

    margin: 0;

    font-size: 36px;

    color: #222;
}

    margin-top: 8px;

    color: #666;

    font-size: 17px;
}

    grid-template-columns:
        1fr
        240px
        260px;

    gap: 12px;

    box-shadow:
        0 0 0 2px rgba(0,120,212,.15);
}


/* =========================================
   STATS
========================================= */

.stats {

    margin-bottom: 15px;

    align-items: center;

}

   RECENT LABEL
========================================= */

.recentLabel {

    font-size: 14px;

/* =========================================
   MOBILE

    body {

        padding: 15px;

    .controls {

        grid-template-columns: 1fr;

    .card {

        flex-direction: column;

</head>


<body>

<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1>Vocabulary Arcade</h1>

        <p>
            Search the vocabulary library and choose how you want to play.
        </p>

    </div>


    <!-- =====================================
         SEARCH / FILTERS
    ====================================== -->

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search vocabulary lists..."
        >

        <select id="languageFilter">

            <option value="all">
                All Languages
            </option>

        </select>


        <select id="recentSelect">

            <option value="all">
                Most Recent Additions
            </option>

        </select>

    </div>


    <!-- =====================================
         RESULTS COUNT
    ====================================== -->

    <div class="stats" id="stats">

        Loading...

    </div>


    <!-- =====================================
         RESULTS
    ====================================== -->

    <div id="results">

        <div class="loading">

            Loading vocabulary library...

        </div>

    </div>


</div>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================
   GAME URLS
========================================= */

const GEMWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/gemword.html";

const BUBBLEWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/bubbleword.html";


/* =========================================
   DATA
========================================= */

let allLists = [];


/* =========================================
   LOAD LIBRARY
========================================= */

async function loadLibrary() {

    try {

        const q =
            query(
                collection(db, "vocabSets")
            );

        const snapshot =
            await getDocs(q);


        allLists = [];


        snapshot.forEach(doc => {

            const data =
                doc.data();


            allLists.push({

                id: doc.id,

                ...data

            });

        });


        /*
         * Sort newest first.
         */

        allLists.sort(
            (a, b) =>
                getTimestamp(b.createdAt)
                -
                getTimestamp(a.createdAt)
        );


        populateLanguageFilter();

        populateRecentDropdown();

        renderLists();

    }

    catch(error) {

        console.error(
            "Error loading vocabulary library:",
            error
        );


        document.getElementById("results").innerHTML = `

            <div class="noResults">

                <strong>
                    Unable to load the vocabulary library.
                </strong>

                <br><br>

                Please try refreshing the page.

            </div>

        `;

        document.getElementById("stats").textContent =
            "Library unavailable.";

    }

}


/* =========================================
   TIMESTAMP HELPER
========================================= */

function getTimestamp(timestamp) {

    if (!timestamp) {

        return 0;

    }


    /*
     * Firebase Timestamp
     */

    if (timestamp.seconds) {

        return timestamp.seconds;

    }


    /*
     * JavaScript Date
     */

    if (timestamp instanceof Date) {

        return timestamp.getTime();

    }


    /*
     * String date
     */

    const parsed =
        new Date(timestamp).getTime();


    return isNaN(parsed)
        ? 0
        : parsed;

}


/* =========================================
   DATE DISPLAY
========================================= */

function formatDate(timestamp) {

    const value =
        getTimestamp(timestamp);


    if (!value) {

        return "";

    }


    return new Date(
        value < 10000000000
            ? value * 1000
            : value
    ).toLocaleDateString();

}


/* =========================================
   LANGUAGE FILTER
========================================= */

function populateLanguageFilter() {

    const filter =
        document.getElementById(
            "languageFilter"
        );


    /*
     * Clear existing language options
     * except "All Languages".
     */

    filter.innerHTML = `

        <option value="all">
            All Languages
        </option>

    `;


    const languages = [

        ...new Set(

            allLists

                .map(
                    list =>
                        list.language
                )

                .filter(Boolean)

        )

    ].sort();


    languages.forEach(language => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            language;

        option.textContent =
            language;


        filter.appendChild(option);

    });

}


/* =========================================
   RECENT ADDITIONS DROPDOWN
========================================= */

function populateRecentDropdown() {

    const dropdown =
        document.getElementById(
            "recentSelect"
        );


    dropdown.innerHTML = `

        <option value="all">
            Most Recent Additions
        </option>

    `;


    /*
     * Take the ten newest lists.
     */

    const recentLists =
        allLists.slice(0, 10);


    recentLists.forEach(list => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            list.id;


        option.textContent =
            list.title ||
            "Untitled List";


        dropdown.appendChild(
            option
        );

    });

}


/* =========================================
   RENDER LISTS
========================================= */

function renderLists() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const selectedLanguage =
        document
            .getElementById(
                "languageFilter"
            )
            .value;


    const selectedRecent =
        document
            .getElementById(
                "recentSelect"
            )
            .value;


    const filtered =
        allLists.filter(list => {


            /*
             * Search title, language,
             * and description.
             */

            const searchableText = `

                ${list.title || ""}

                ${list.language || ""}

                ${list.description || ""}

            `.toLowerCase();


            const searchMatch =
                searchableText.includes(
                    search
                );


            const languageMatch =
                selectedLanguage === "all"
                ||
                list.language ===
                    selectedLanguage;


            const recentMatch =
                selectedRecent === "all"
                ||
                list.id === selectedRecent;


            return (

                searchMatch
                &&
                languageMatch
                &&
                recentMatch

            );

        });


    document.getElementById(
        "stats"
    ).textContent =

        `${filtered.length} vocabulary list(s) found`;


    const container =
        document.getElementById(
            "results"
        );


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="noResults">

                No vocabulary lists found.

            </div>

        `;

        return;

    }


    filtered.forEach(list => {


        const createdDate =
            formatDate(
                list.createdAt
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        /*
         * Build game URLs with
         * the Firebase vocabulary ID.
         */

        const gemWordUrl =
            `${GEMWORD_URL}?id=${encodeURIComponent(list.id)}`;


        const bubbleWordUrl =
            `${BUBBLEWORD_URL}?id=${encodeURIComponent(list.id)}`;


        card.innerHTML = `

            <div class="cardInfo">

                <div class="title">

                    ${escapeHtml(
                        list.title ||
                        "Untitled List"
                    )}

                </div>


                <div class="language">

                    ${escapeHtml(
                        list.language ||
                        "Unknown Language"
                    )}

                </div>


                <div class="meta">

                    ${list.itemCount || 0}
                    words

                    ${
                        createdDate
                            ? " • Added " +
                              createdDate
                            : ""
                    }

                </div>

            </div>


            <div class="gameButtons">

                <a
                    class="playButton gemButton"
                    href="${gemWordUrl}"
                >
                    💎 GemWords
                </a>


                <a
                    class="playButton bubbleButton"
                    href="${bubbleWordUrl}"
                >
                    🫧 BubbleWord
                </a>

            </div>

        `;


        container.appendChild(
            card
        );

    });

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   EVENT LISTENERS
========================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderLists
    );


document
    .getElementById("languageFilter")
    .addEventListener(
        "change",
        renderLists
    );


document
    .getElementById("recentSelect")
    .addEventListener(
        "change",
        renderLists
    );


/* =========================================
   START
========================================= */

loadLibrary();

</script>

</body>

</html>
