<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Library</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

input,
select{
    padding:10px;
    font-size:16px;
}

#search{
    flex:1;
    min-width:250px;
}

.stats{
    margin-bottom:15px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:8px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.1);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cardInfo{
    flex:1;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.language{
    color:#0078d4;
    margin-top:5px;
}

.meta{
    color:#666;
    font-size:14px;
    margin-top:5px;
}

.playButton{
    background:#0078d4;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:5px;
}

.playButton:hover{
    background:#005ea8;
}

.loading{
    text-align:center;
    color:#666;
}

</style>
</head>

<body>

<div class="container">

    <h1>Vocabulary Library</h1>

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search vocabulary lists..."
        >

        <select id="languageFilter">
            <option value="all">All Languages</option>
        </select>

    </div>

    <div class="stats" id="stats">
        Loading...
    </div>

    <div id="results">
        <div class="loading">
            Loading vocabulary library...
        </div>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    query
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
  authDomain: "bubbleword-30367.firebaseapp.com",
  projectId: "bubbleword-30367",
  storageBucket: "bubbleword-30367.firebasestorage.app",
  messagingSenderId: "1058393039019",
  appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allLists = [];

async function loadLibrary() {

    try {

        const q =
            query(collection(db, "vocabSets"));

        const snapshot =
            await getDocs(q);

        allLists = [];

        snapshot.forEach(doc => {

            const data = doc.data();

            allLists.push({
                id: doc.id,
                ...data
            });

        });

        allLists.sort((a,b) =>
            (a.title || "")
            .localeCompare(b.title || "")
        );

        populateLanguageFilter();
        renderLists();

    }
    catch(error){

        console.error(error);

        document.getElementById("results").innerHTML =
            `<p>Error loading vocabulary library.</p>`;
    }
}

function populateLanguageFilter(){

    const filter =
        document.getElementById("languageFilter");

    const languages =
        [...new Set(
            allLists.map(list => list.language)
        )].sort();

    languages.forEach(language => {

        const option =
            document.createElement("option");

        option.value = language;
        option.textContent = language;

        filter.appendChild(option);

    });

}

function renderLists(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const selectedLanguage =
        document
        .getElementById("languageFilter")
        .value;

    const filtered =
        allLists.filter(list => {

            const titleMatch =
                (list.title || "")
                .toLowerCase()
                .includes(search);

            const languageMatch =
                selectedLanguage === "all"
                ||
                list.language === selectedLanguage;

            return (
                titleMatch &&
                languageMatch
            );
        });

    document.getElementById("stats").textContent =
        `${filtered.length} list(s) found`;

    const container =
        document.getElementById("results");

    container.innerHTML = "";

    if(filtered.length === 0){

        container.innerHTML =
            "<p>No vocabulary lists found.</p>";

        return;
    }

    filtered.forEach(list => {

        let createdDate = "";

        if(list.createdAt?.seconds){

            createdDate =
                new Date(
                    list.createdAt.seconds * 1000
                ).toLocaleDateString();

        }

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="cardInfo">

                <div class="title">
                    ${list.title || "Untitled List"}
                </div>

                <div class="language">
                    ${list.language || "Unknown"}
                </div>

                <div class="meta">
                    ${list.itemCount || 0} words
                    ${createdDate ? " • Created " + createdDate : ""}
                </div>

            </div>

            play.html?id=${list.id}
                Play
            </a>

        `;

        container.appendChild(card);

    });

}

document
.getElementById("search")
.addEventListener("input", renderLists);

document
.getElementById("languageFilter")
.addEventListener("change", renderLists);

loadLibrary
