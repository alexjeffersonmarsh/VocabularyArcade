<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Arcade Library</title>

<style>

/* =========================================
   GLOBAL
========================================= */

body {
    font-family: Arial, sans-serif;
    background:
        linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
    margin: 0;
    padding: 30px;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}


/* =========================================
   HEADER
========================================= */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 36px;
    color: #222;
}

.header p {
    margin-top: 8px;
    color: #666;
    font-size: 17px;
}


/* =========================================
   CONTROLS
========================================= */

.controls {
    display: grid;
    grid-template-columns: 1fr 220px 260px;
    gap: 12px;
    margin-bottom: 20px;
}

input,
select {
    padding: 13px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    box-sizing: border-box;
    width: 100%;
}

input:focus,
select:focus {
    outline: none;
    border-color: #0078d4;
    box-shadow: 0 0 0 2px rgba(0,120,212,.15);
}


/* =========================================
   STATS
========================================= */

.stats {
    margin-bottom: 15px;
    font-weight: bold;
    color: #555;
    font-size: 15px;
}


/* =========================================
   VOCABULARY CARD
========================================= */

.card {
    position: relative;

    background: white;

    border-radius: 12px;

    padding: 20px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.10);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    cursor: pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.card:hover {
    transform: translateY(-2px);

    box-shadow:
        0 6px 16px rgba(0,0,0,.15);
}

.cardInfo {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 20px;
    font-weight: bold;
    color: #222;
    margin-bottom: 6px;
}

.language {
    color: #0078d4;
    font-weight: bold;
    margin-bottom: 5px;
}

.meta {
    color: #666;
    font-size: 14px;
}


/* =========================================
   NEW BADGE
========================================= */

.newBadge {

    display: inline-block;

    margin-left: 8px;

    padding: 3px 7px;

    background: #e63946;

    color: white;

    font-size: 11px;

    font-weight: bold;

    border-radius: 10px;

    vertical-align: middle;

    text-transform: uppercase;

    letter-spacing: .5px;
}


/* =========================================
   GAME BUTTONS
========================================= */

.gameButtons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.playButton {
    color: white;
    text-decoration: none;

    padding: 11px 15px;

    border-radius: 6px;

    font-weight: bold;

    text-align: center;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.playButton:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

.gemButton {
    background: #7b2cbf;
}

.bubbleButton {
    background: #0078d4;
}


/* =========================================
   LOADING / ERROR
========================================= */

.loading {
    text-align: center;
    color: #666;
    padding: 30px;
}

.noResults {
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
    color: #666;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);
}

.errorBox {
    background: #fff0f0;

    border: 1px solid #e0a0a0;

    color: #8a1c1c;

    padding: 20px;

    border-radius: 10px;

    line-height: 1.5;
}


/* =========================================
   GAME CHOICE MODAL
========================================= */

.modalOverlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.65);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 5000;

    padding: 20px;
}

.modalOverlay.show {
    display: flex;
}

.gameModal {

    background: white;

    width: 100%;

    max-width: 500px;

    border-radius: 16px;

    padding: 30px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0,0,0,.3);
}

.gameModal h2 {

    margin-top: 0;

    margin-bottom: 8px;
}

.gameModal p {

    color: #666;

    margin-bottom: 25px;
}

.modalGames {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.modalGameButton {

    border: none;

    border-radius: 10px;

    padding: 20px 10px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.modalGameButton:hover {

    transform: translateY(-2px);

    filter: brightness(1.1);
}

.modalGem {

    background: #7b2cbf;
}

.modalBubble {

    background: #0078d4;
}

.closeModal {

    margin-top: 20px;

    background: #ddd;

    border: none;

    border-radius: 7px;

    padding: 10px 20px;

    cursor: pointer;

    font-size: 15px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    body {
        padding: 15px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

    .card {
        flex-direction: column;
        align-items: stretch;
    }

    .gameButtons {
        width: 100%;
    }

    .playButton {
        flex: 1;
    }

    .modalGames {
        grid-template-columns: 1fr;
    }
}

</style>

</head>


<body>

<div class="container">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">

        <h1>Vocabulary Arcade</h1>

        <p>
            Choose a vocabulary set and pick your game.
        </p>

    </div>


    <!-- =====================================
         SEARCH / FILTERS
    ====================================== -->

    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search vocabulary lists..."
        >

        <select id="languageFilter">

            <option value="all">
                All Languages
            </option>

        </select>

        <select id="recentSelect">

            <option value="all">
                Most Recent Additions
            </option>

        </select>

    </div>


    <!-- =====================================
         RESULTS COUNT
    ====================================== -->

    <div class="stats" id="stats">
        Connecting to vocabulary library...
    </div>


    <!-- =====================================
         RESULTS
    ====================================== -->

    <div id="results">

        <div class="loading">
            Loading vocabulary library...
        </div>

    </div>

</div>


<!-- =========================================
     GAME CHOICE MODAL
========================================= -->

<div
    id="gameModal"
    class="modalOverlay"
>

    <div class="gameModal">

        <h2 id="modalTitle">
            Choose Your Game
        </h2>

        <p>
            How would you like to practice this vocabulary?
        </p>

        <div class="modalGames">

            <button
                id="modalGemButton"
                class="modalGameButton modalGem"
            >
                💎<br>
                GemWords
            </button>

            <button
                id="modalBubbleButton"
                class="modalGameButton modalBubble"
            >
                🫧<br>
                BubbleWord
            </button>

        </div>

        <button
            id="closeModal"
            class="closeModal"
        >
            Cancel
        </button>

    </div>

</div>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

let db;

try {

    const app =
        initializeApp(firebaseConfig);

    db =
        getFirestore(app);

    console.log(
        "Firebase initialized successfully."
    );

}
catch (error) {

    console.error(
        "Firebase initialization failed:",
        error
    );

    document.getElementById(
        "stats"
    ).textContent =
        "Firebase connection failed.";

    document.getElementById(
        "results"
    ).innerHTML = `

        <div class="errorBox">

            <strong>
                Firebase could not be initialized.
            </strong>

            <br><br>

            ${escapeHtml(error.message)}

        </div>

    `;

}


/* =========================================
   GAME URLS
========================================= */

const GEMWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/gemword.html";

const BUBBLEWORD_URL =
    "https://alexjeffersonmarsh.github.io/VocabularyArcade/bubbleword.html";


/* =========================================
   DATA
========================================= */

let allLists = [];

let selectedList = null;


/* =========================================
   LOAD LIBRARY
========================================= */

async function loadLibrary() {

    if (!db) {
        return;
    }

    try {

        console.log(
            "Connecting to vocabSets..."
        );


        const snapshot =
            await getDocs(
                collection(
                    db,
                    "vocabSets"
                )
            );


        console.log(
            "Firebase documents found:",
            snapshot.size
        );


        allLists = [];


        snapshot.forEach(doc => {

            const data =
                doc.data();


            console.log(
                "Vocabulary set:",
                doc.id,
                data
            );


            allLists.push({

                id: doc.id,

                ...data

            });

        });


        /*
         * Newest first.
         */

        allLists.sort(
            (a, b) =>
                getTimestamp(b.createdAt)
                -
                getTimestamp(a.createdAt)
        );


        populateLanguageFilter();

        populateRecentDropdown();

        renderLists();


    }
    catch(error) {

        console.error(
            "Firestore error:",
            error
        );


        document.getElementById(
            "stats"
        ).textContent =
            "Unable to access vocabulary library.";


        document.getElementById(
            "results"
        ).innerHTML = `

            <div class="errorBox">

                <strong>
                    Could not load the vocabulary library.
                </strong>

                <br><br>

                <strong>Firebase error:</strong><br>

                ${escapeHtml(error.message)}

                <br><br>

                Open the browser developer console
                (F12 → Console) for additional details.

            </div>

        `;

    }

}


/* =========================================
   TIMESTAMP
========================================= */

function getTimestamp(timestamp) {

    if (!timestamp) {
        return 0;
    }


    /*
     * Firebase Timestamp
     */

    if (
        typeof timestamp === "object"
        &&
        typeof timestamp.seconds === "number"
    ) {

        return timestamp.seconds;

    }


    /*
     * JavaScript Date
     */

    if (timestamp instanceof Date) {

        return timestamp.getTime();

    }


    /*
     * String / numeric date
     */

    const parsed =
        new Date(timestamp).getTime();


    return isNaN(parsed)
        ? 0
        : parsed;

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(timestamp) {

    const value =
        getTimestamp(timestamp);


    if (!value) {
        return "";
    }


    const milliseconds =
        value < 10000000000
            ? value * 1000
            : value;


    return new Date(
        milliseconds
    ).toLocaleDateString();

}


/* =========================================
   NEW LIST CHECK
========================================= */

function isNewList(timestamp) {

    const created =
        getTimestamp(timestamp);


    if (!created) {
        return false;
    }


    const milliseconds =
        created < 10000000000
            ? created * 1000
            : created;


    const sevenDays =
        7 * 24 * 60 * 60 * 1000;


    return (
        Date.now() - milliseconds
        <= sevenDays
    );

}


/* =========================================
   LANGUAGE FILTER
========================================= */

function populateLanguageFilter() {

    const filter =
        document.getElementById(
            "languageFilter"
        );


    filter.innerHTML = `

        <option value="all">
            All Languages
        </option>

    `;


    const languages = [

        ...new Set(

            allLists

                .map(
                    list =>
                        list.language
                )

                .filter(Boolean)

        )

    ].sort();


    languages.forEach(language => {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            language;

        option.textContent =
            language;


        filter.appendChild(
            option
        );

    });

}


/* =========================================
   RECENT DROPDOWN
========================================= */

function populateRecentDropdown() {

    const dropdown =
        document.getElementById(
            "recentSelect"
        );


    dropdown.innerHTML = `

        <option value="all">
            Most Recent Additions
        </option>

    `;


    /*
     * Show ten newest lists.
     */

    allLists
        .slice(0, 10)
        .forEach(list => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                list.id;


            option.textContent =
                list.title ||
                "Untitled List";


            dropdown.appendChild(
                option
            );

        });

}


/* =========================================
   RENDER LISTS
========================================= */

function renderLists() {

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const selectedLanguage =
        document
            .getElementById(
                "languageFilter"
            )
            .value;


    const selectedRecent =
        document
            .getElementById(
                "recentSelect"
            )
            .value;


    const filtered =
        allLists.filter(list => {


            const searchableText = `

                ${list.title || ""}

                ${list.language || ""}

                ${list.description || ""}

            `.toLowerCase();


            const searchMatch =
                searchableText.includes(
                    search
                );


            const languageMatch =
                selectedLanguage === "all"
                ||
                list.language ===
                    selectedLanguage;


            const recentMatch =
                selectedRecent === "all"
                ||
                list.id === selectedRecent;


            return (
                searchMatch
                &&
                languageMatch
                &&
                recentMatch
            );

        });


    document.getElementById(
        "stats"
    ).textContent =

        `${filtered.length} vocabulary list(s) found`;


    const container =
        document.getElementById(
            "results"
        );


    container.innerHTML = "";


    if (filtered.length === 0) {

        container.innerHTML = `

            <div class="noResults">

                No vocabulary lists found.

            </div>

        `;

        return;

    }


    filtered.forEach(list => {

        const createdDate =
            formatDate(
                list.createdAt
            );


        const isNew =
            isNewList(
                list.createdAt
            );


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "card";


        /*
         * Make the entire card clickable.
         */

        card.addEventListener(
            "click",
            () => {

                openGameChooser(list);

            }
        );


        const title =
            escapeHtml(
                list.title ||
                "Untitled List"
            );


        const language =
            escapeHtml(
                list.language ||
                "Unknown Language"
            );


        card.innerHTML = `

            <div class="cardInfo">

                <div class="title">

                    ${title}

                    ${
                        isNew
                            ? `<span class="newBadge">
                                  New
                               </span>`
                            : ""
                    }

                </div>


                <div class="language">

                    ${language}

                </div>


                <div class="meta">

                    ${list.itemCount || 0}
                    words

                    ${
                        createdDate
                            ? " • Added " +
                              createdDate
                            : ""
                    }

                </div>

            </div>


            <div class="gameButtons">

                <a
                    class="playButton gemButton"
                    href="${GEMWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    💎 GemWords
                </a>


                <a
                    class="playButton bubbleButton"
                    href="${BUBBLEWORD_URL}?id=${encodeURIComponent(list.id)}"
                >
                    🫧 BubbleWord
                </a>

            </div>

        `;


        /*
         * Prevent the game buttons from
         * opening the game chooser.
         */

        card
            .querySelectorAll(".playButton")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                    }
                );

            });


        container.appendChild(
            card
        );

    });

}


/* =========================================
   GAME CHOOSER
========================================= */

function openGameChooser(list) {

    selectedList = list;


    document.getElementById(
        "modalTitle"
    ).textContent =

        list.title ||
        "Choose Your Game";


    document.getElementById(
        "gameModal"
    ).classList.add(
        "show"
    );

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeGameChooser() {

    selectedList = null;

    document.getElementById(
        "gameModal"
    ).classList.remove(
        "show"
    );

}


/* =========================================
   GAME BUTTONS IN MODAL
========================================= */

document
    .getElementById(
        "modalGemButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${GEMWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


document
    .getElementById(
        "modalBubbleButton"
    )
    .addEventListener(
        "click",
        () => {

            if (!selectedList) {
                return;
            }


            window.location.href =
                `${BUBBLEWORD_URL}?id=${encodeURIComponent(selectedList.id)}`;

        }
    );


/* =========================================
   CLOSE BUTTON
========================================= */

document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeGameChooser
    );


/* =========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================= */

document
    .getElementById(
        "gameModal"
    )
    .addEventListener(
        "click",
        event => {

            if (
                event.target.id ===
                "gameModal"
            ) {

                closeGameChooser();

            }

        }
    );


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   SEARCH / FILTER EVENTS
========================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderLists
    );


document
    .getElementById("languageFilter")
    .addEventListener(
        "change",
        renderLists
    );


document
    .getElementById("recentSelect")
    .addEventListener(
        "change",
        renderLists
    );


/* =========================================
   START LIBRARY
========================================= */

loadLibrary();

</script>

</body>

</html>
