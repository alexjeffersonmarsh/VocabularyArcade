<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomCheck | Find Your Room</title>
<style>
:root{--navy:#0b1f3a;--red:#b3202a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#eef1f6;font:16px Arial,sans-serif;color:#172235}.card{width:min(620px,100%);background:white;border-radius:16px;overflow:hidden;box-shadow:0 15px 45px #0b1f3a22}.head{background:var(--navy);color:white;padding:28px;border-bottom:7px solid var(--red)}.brand{font-size:12px;letter-spacing:.2em;font-weight:bold}.head h1{margin:12px 0 8px;font-size:38px}.head p{margin:0;color:#dce5f2;line-height:1.5}main{padding:28px}label{display:block;font-weight:bold;margin-bottom:9px}.row{display:flex;gap:10px}input{min-width:0;flex:1;padding:14px;border:1px solid #aab6c6;border-radius:9px;font-size:17px}button{border:0;border-radius:9px;background:var(--red);color:white;font-weight:bold;padding:14px 18px;cursor:pointer}button:disabled{opacity:.6}.hint{font-size:13px;color:#647184;line-height:1.5}.result{display:none;margin-top:20px;padding:18px;border-radius:10px;background:#f3f5f8}.result.show{display:block}.result.ok{background:#edf8f1}.result.bad{background:#fff0f0}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#647184;font-weight:bold}.room{font-size:54px;font-weight:900;color:var(--navy);margin:8px 0}.foot{padding:16px;background:#f5f6f8;text-align:center;color:#647184;font-size:12px}@media(max-width:520px){.row{flex-direction:column}.head h1{font-size:32px}main,.head{padding:22px}}
</style></head><body><div class="card"><header class="head"><div class="brand">ROOMCHECK</div><h1>Find Your Room</h1><p>Enter your student ID to look up your assigned room.</p></header><main><form id="form"><label for="sid">Student ID</label><div class="row"><input id="sid" required autocomplete="off" inputmode="numeric" placeholder="Enter your student ID"><button id="btn">Find My Room</button></div><p class="hint">Enter your ID exactly as provided by your school. Contact school staff if you need help.</p></form><div id="result" class="result" role="status" aria-live="polite"></div></main><footer class="foot">RoomCheck · Student Room Assignment Lookup</footer></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCnkQSGxYxO0K_LQvWHvLiuYyzTs8jZJME",authDomain:"checkroom-62dc0.firebaseapp.com",projectId:"checkroom-62dc0",storageBucket:"checkroom-62dc0.firebasestorage.app",messagingSenderId:"920735906422",appId:"1:920735906422:web:bffc929591133ad51ebd57",measurementId:"G-4V88V4ZTV5"};
const db=getFirestore(initializeApp(firebaseConfig)),form=document.querySelector("#form"),input=document.querySelector("#sid"),btn=document.querySelector("#btn"),result=document.querySelector("#result");
function show(kind,html){result.className="result show "+kind;result.innerHTML=html}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
form.addEventListener("submit",async e=>{e.preventDefault();let id=input.value.trim();if(!id)return;btn.disabled=true;btn.textContent="Searching…";show("","Looking up your assignment…");try{let snap=await getDoc(doc(db,"roomAssignments",id));if(!snap.exists())show("bad","<p><strong>No room assignment found.</strong></p><p>Check your ID and try again, or contact school staff.</p>");else{let room=snap.data().room;if(room===undefined||room===null)show("bad","Room information is incomplete. Contact school staff.");else show("ok",'<div class="eyebrow">Your assigned room</div><div class="room">'+esc(room)+'</div><p>Follow your school’s directions.</p>')}}catch(err){console.error(err);show("bad","<strong>We couldn't retrieve your assignment.</strong><p>Please try again later or contact school staff.</p>")}finally{btn.disabled=false;btn.textContent="Find My Room"}});
</script></body></html>
