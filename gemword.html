<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Jewel Game</title>

style.css

</head>

<body>

<!-- =========================================
     TEACHER PANEL
========================================= -->

<div id="teacher-panel">

    <h2>GemWords</h2>

    <p>Select a vocabulary set from your library.</p>

    <select id="setSelector">

        <option value="">
            Select Vocabulary Set
        </option>

    </select>

    <button id="load-set-btn">
        Start Game
    </button>

</div>

<!-- ===== HUD ===== -->

<div class="stats-hud">

    <div class="stat-item">
        SCORE:
        <span id="score">0</span>
    </div>

    <div class="stat-item">
        TIME:
        <span id="timer">180</span>
    </div>

</div>

<!-- ===== GAME AREA ===== -->

<div id="game-container">

    <div class="board-column">

        <h3>Words</h3>

        <div id="gemGrid"></div>

    </div>

    <div class="board-column">

        <h3>Definitions</h3>

        <div id="cardGrid"></div>

    </div>

</div>

<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
    authDomain: "bubbleword-30367.firebaseapp.com",
    projectId: "bubbleword-30367",
    storageBucket: "bubbleword-30367.firebasestorage.app",
    messagingSenderId: "1058393039019",
    appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

/* =========================================
   POPULATE DROPDOWN
========================================= */

async function loadVocabularySets() {

    const selector =
        document.getElementById(
            "setSelector"
        );

    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "vocabSets"
                )
            );

        snapshot.forEach(docSnap => {

            const data =
                docSnap.data();

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                docSnap.id;

            option.textContent =
                data.title ||
                docSnap.id;

            selector.appendChild(
                option
            );

        });

        console.log(
            "Vocabulary sets loaded."
        );

    } catch(error) {

        console.error(
            "Error loading sets:",
            error
        );

    }

}

/* =========================================
   LOAD VOCAB SET
========================================= */

async function loadSet(setId) {

    const ref =
        doc(
            db,
            "vocabSets",
            setId
        );

    const snapshot =
        await getDoc(ref);

    if (!snapshot.exists()) {

        throw new Error(
            "Vocabulary set not found."
        );

    }

    const data =
        snapshot.data();

    /* New format */

    if (
        Array.isArray(
            data.items
        )
    ) {

        return data.items;

    }

    /* Legacy format */

    let terms =
        data.terms;

    if (
        typeof terms ===
        "string"
    ) {

        try {

            terms =
                JSON.parse(
                    terms
                );

        } catch(error) {

            console.error(
                "Parse error:",
                error
            );

            terms = [];

        }

    }

    return terms || [];

}

/* =========================================
   START GAME
========================================= */

async function startGameWithSet(
    setId
) {

    try {

        const vocab =
            await loadSet(
                setId
            );

        window.preloadedVocab =
            vocab.map(item => ({

                word:
                    item.word,

                definition:
                    item.definition ||
                    item.meaning ||
                    ""

            }));

        console.log(
            "GemWords vocab loaded:",
            window.preloadedVocab
        );

        const panel =
            document.getElementById(
                "teacher-panel"
            );

        if (panel) {

            panel.style.display =
                "none";

        }

        if (
            window.startLoadedGame
        ) {

            window.startLoadedGame();

        }

    } catch(error) {

        console.error(
            error
        );

        alert(
            "Could not load vocabulary set."
        );

    }

}

/* =========================================
   LOAD DROPDOWN ON PAGE OPEN
========================================= */

loadVocabularySets();

/* =========================================
   URL PARAM SUPPORT
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const setId =
    params.get("id") ||
    params.get("set");

if (setId) {

    startGameWithSet(
        setId
    );

}

/* =========================================
   BUTTON CLICK
========================================= */

document
.getElementById(
    "load-set-btn"
)
.addEventListener(
    "click",
    () => {

        const selectedSet =
            document
            .getElementById(
                "setSelector"
            )
            .value;

        if (
            !selectedSet
        ) {

            alert(
                "Please select a vocabulary set."
            );

            return;

        }

        startGameWithSet(
            selectedSet
        );

    }
);

</script>

<!-- =========================================
     MAIN GAME SCRIPT
========================================= -->

 (1).js"></script>

</body>
</html>
