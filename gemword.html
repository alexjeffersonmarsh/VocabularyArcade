<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#17131f"
>

<title>GemWords | Vocabulary Arcade</title>

<link
    rel="stylesheet"
    href="style.css"
>


<style>

/* =========================================
   GAME COMPLETE SCREEN
========================================= */

.game-complete-screen {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.90);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;

    padding: 20px;

}


.game-complete-screen.show {

    display: flex;

}


.game-complete-panel {

    width: min(
        540px,
        94vw
    );

    padding:
        clamp(
            22px,
            5vw,
            40px
        );

    background:
        #1b1b20;

    border:
        3px solid #777;

    border-radius:
        18px;

    box-shadow:
        0 0 35px rgba(
            0,
            0,
            0,
            0.85
        );

    text-align:
        center;

    font-family:
        "Times New Roman",
        serif;

    color:
        #ffffff;

}


.game-complete-panel h1 {

    margin:
        0 0 28px;

    font-size:
        clamp(
            28px,
            6vw,
            38px
        );

    color:
        #ffffff;

}


/* =========================================
   RESULTS
========================================= */

.results-list-name,
.results-stat {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        16px;

    padding:
        14px 16px;

    margin:
        10px 0;

    background:
        #29292f;

    border-radius:
        10px;

    font-size:
        20px;

    text-align:
        left;

}


.results-label {

    color:
        #aaa;

    font-size:
        16px;

}


#resultsListName,
#resultsScore,
#resultsAccuracy {

    color:
        #ffffff;

    font-weight:
        bold;

    overflow-wrap:
        anywhere;

    text-align:
        right;

}


#resultsAccuracy {

    font-size:
        27px;

}


/* =========================================
   RESULT BUTTONS
========================================= */

.results-buttons {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        12px;

    justify-content:
        center;

    margin-top:
        28px;

}


.results-buttons button {

    min-height:
        44px;

    padding:
        12px 18px;

    border:
        none;

    border-radius:
        8px;

    cursor:
        pointer;

    font-family:
        "Times New Roman",
        serif;

    font-size:
        17px;

    font-weight:
        bold;

}


#playAgainButton {

    background:
        #7b2cbf;

    color:
        white;

}


#leaderboardButton {

    background:
        #246c54;

    color:
        white;

}


#libraryButton {

    background:
        #444;

    color:
        white;

}


.results-buttons button:hover {

    filter:
        brightness(
            1.12
        );

}


/* =========================================
   MOBILE
========================================= */

@media (
    max-width: 520px
) {

    .results-list-name,
    .results-stat {

        align-items:
            flex-start;

        flex-direction:
            column;

        gap:
            6px;

    }


    #resultsListName,
    #resultsScore,
    #resultsAccuracy {

        text-align:
            left;

    }


    .results-buttons button {

        flex:
            1 1 100%;

    }

}

</style>

</head>


<body>


<!-- =========================================
     TEACHER / STANDALONE PANEL
========================================= -->

<div id="teacher-panel">

    <h2>
        GemWords
    </h2>

    <p>
        Select a vocabulary set from your library.
    </p>

    <select id="setSelector">

        <option value="">
            Select Vocabulary Set
        </option>

    </select>

    <button
        id="load-set-btn"
        type="button"
    >
        Start Game
    </button>

</div>



<!-- =========================================
     HUD
========================================= -->

<div class="stats-hud">

    <div class="stat-item">

        SCORE:
        <span id="score">
            0
        </span>

    </div>


    <div class="stat-item">

        TIME:
        <span id="timer">
            180
        </span>

    </div>

</div>



<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <div class="board-column">

        <h3>
            Words
        </h3>

        <div id="gemGrid"></div>

    </div>


    <div class="board-column">

        <h3>
            Definitions
        </h3>

        <div id="cardGrid"></div>

    </div>

</div>



<!-- =========================================
     GAME COMPLETE SCREEN
========================================= -->

<div
    id="gameCompleteScreen"
    class="game-complete-screen"
>

    <div class="game-complete-panel">


        <h1 id="gameCompleteHeading">

            GemWords Complete!

        </h1>



        <div class="results-list-name">

            <span class="results-label">

                Vocabulary List

            </span>


            <span id="resultsListName">

                Vocabulary List

            </span>

        </div>



        <div class="results-stat">

            <span class="results-label">

                Score

            </span>


            <span id="resultsScore">

                0

            </span>

        </div>



        <div class="results-stat">

            <span class="results-label">

                Accuracy

            </span>


            <span id="resultsAccuracy">

                0%

            </span>

        </div>



        <div class="results-buttons">


            <button
                id="playAgainButton"
                type="button"
            >

                Play Again

            </button>



            <!--
                This button is hidden during
                standalone play and only appears
                during a classroom session.
            -->

            <button
                id="leaderboardButton"
                type="button"
                style="display:none;"
            >

                View Leaderboard

            </button>



            <button
                id="libraryButton"
                type="button"
            >

                Back to Library

            </button>


        </div>


    </div>

</div>



<!-- =========================================
     MAIN GAME SCRIPT
========================================= -->

<script src="script (1).js"></script>



<!-- =========================================
     FIREBASE + SESSION SYSTEM
========================================= -->

<script type="module">


/* =========================================
   FIREBASE IMPORTS
========================================= */

import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

    getAuth,
    onAuthStateChanged,
    signInAnonymously

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



import {

    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs,
    updateDoc,
    serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* =========================================
   FIREBASE CONFIGURATION
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};



/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(
        app
    );


const db =
    getFirestore(
        app
    );



/* =========================================
   DOM ELEMENTS
========================================= */

const teacherPanel =
    document.getElementById(
        "teacher-panel"
    );


const setSelector =
    document.getElementById(
        "setSelector"
    );


const loadSetButton =
    document.getElementById(
        "load-set-btn"
    );



/* =========================================
   SESSION STATE
========================================= */

let sessionParticipantRef =
    null;



/* =========================================
   ERROR HANDLER
========================================= */

function showLoadError(
    message,
    error
) {

    console.error(
        message,
        error || ""
    );


    alert(
        message +
        (
            error &&
            error.message
                ? "\n\n" +
                  error.message
                : ""
        )
    );

}



/* =========================================
   NORMALIZE SESSION CODE
========================================= */

function normalizeCode(
    value
) {

    return String(
        value || ""
    )
        .toUpperCase()
        .replace(
            /\s+/g,
            ""
        )
        .replace(
            /[^A-HJ-NP-Z2-9]/g,
            ""
        )
        .slice(
            0,
            6
        );

}



/* =========================================
   WAIT FOR AUTH
========================================= */

function waitForAuthState() {

    return new Promise(
        (
            resolve,
            reject
        ) => {

            let unsubscribe =
                () => {};


            unsubscribe =
                onAuthStateChanged(

                    auth,

                    user => {

                        unsubscribe();

                        resolve(
                            user
                        );

                    },

                    error => {

                        unsubscribe();

                        reject(
                            error
                        );

                    }

                );

        }
    );

}



/* =========================================
   ENSURE ANONYMOUS SIGN-IN
========================================= */

async function ensureSignedIn() {

    let user =
        auth.currentUser;


    if (!user) {

        user =
            await waitForAuthState();

    }


    if (!user) {

        const credential =
            await signInAnonymously(
                auth
            );


        user =
            credential.user;

    }


    return user;

}



/* =========================================
   LOAD VOCABULARY SET
========================================= */

async function loadSet(
    setId
) {

    const snapshot =
        await getDoc(
            doc(
                db,
                "vocabSets",
                setId
            )
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();



    /* SAVE LIST TITLE */

    window.preloadedVocabTitle =
        data.title ||
        setId;



    /* =====================================
       CURRENT FORMAT
    ===================================== */

    if (
        Array.isArray(
            data.items
        )
    ) {

        return data.items;

    }



    /* =====================================
       LEGACY FORMAT
    ===================================== */

    let terms =
        data.terms;


    if (
        typeof terms ===
        "string"
    ) {

        try {

            terms =
                JSON.parse(
                    terms
                );

        } catch(error) {

            console.error(
                "Could not parse legacy terms:",
                error
            );


            terms =
                [];

        }

    }


    return Array.isArray(
        terms
    )
        ? terms
        : [];

}



/* =========================================
   LOAD STANDALONE VOCABULARY SETS
========================================= */

async function loadVocabularySets() {

    setSelector.innerHTML =
        `
        <option value="">
            Select Vocabulary Set
        </option>
        `;


    const snapshot =
        await getDocs(
            collection(
                db,
                "vocabSets"
            )
        );


    snapshot.forEach(
        docSnap => {

            const data =
                docSnap.data();


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                docSnap.id;


            option.textContent =
                data.title ||
                docSnap.id;


            setSelector.appendChild(
                option
            );

        }
    );


    console.log(
        "Vocabulary sets loaded."
    );

}



/* =========================================
   START STANDALONE GAME
========================================= */

async function startGameWithSet(
    setId
) {

    try {

        console.log(
            "GEMWORDS: Loading standalone set:",
            setId
        );


        const vocab =
            await loadSet(
                setId
            );


        window.preloadedVocab =
            vocab.map(
                item => ({

                    word:
                        item.word,

                    definition:
                        item.definition ||
                        item.meaning ||
                        ""

                })
            );


        console.log(
            "GEMWORDS: Standalone vocabulary loaded.",
            window.preloadedVocab
        );


        if (teacherPanel) {

            teacherPanel.style.display =
                "none";

        }


        if (
            typeof window.startLoadedGame !==
            "function"
        ) {

            throw new Error(
                "startLoadedGame() is not available."
            );

        }


        await window.startLoadedGame();


    } catch(error) {

        showLoadError(
            "Could not load the vocabulary set.",
            error
        );

    }

}



/* =========================================
   START CLASSROOM SESSION GAME
========================================= */

async function startGameWithSession(
    rawCode,
    participantParam
) {

    try {

        const code =
            normalizeCode(
                rawCode
            );


        if (
            !/^[A-HJ-NP-Z2-9]{6}$/.test(
                code
            )
        ) {

            throw new Error(
                "The game code in this link is invalid."
            );

        }



        /* =================================
           ANONYMOUS AUTH
        ================================= */

        const user =
            await ensureSignedIn();



        /* =================================
           VERIFY PARTICIPANT
        ================================= */

        if (
            !participantParam ||
            participantParam !==
                user.uid
        ) {

            throw new Error(
                "This game link does not match this participant. Return to join.html and join the session again."
            );

        }



        /* =================================
           LOOK UP GAME CODE
        ================================= */

        const codeSnapshot =
            await getDoc(
                doc(
                    db,
                    "sessionCodes",
                    code
                )
            );


        if (
            !codeSnapshot.exists()
        ) {

            throw new Error(
                "That game code was not found."
            );

        }


        const codeData =
            codeSnapshot.data();


        if (
            !codeData.sessionId
        ) {

            throw new Error(
                "This game code is not linked to a session."
            );

        }



        /* =================================
           LOAD SESSION
        ================================= */

        const sessionRef =
            doc(
                db,
                "gameSessions",
                codeData.sessionId
            );


        const sessionSnapshot =
            await getDoc(
                sessionRef
            );


        if (
            !sessionSnapshot.exists()
        ) {

            throw new Error(
                "The game session could not be found."
            );

        }


        const session =
            sessionSnapshot.data();



        /* =================================
           CHECK SESSION STATUS
        ================================= */

        if (
            session.status !==
            "active"
        ) {

            throw new Error(
                "This game session is not currently active. Check with your teacher."
            );

        }



        /* =================================
           VERIFY GAME TYPE
        ================================= */

        if (
            session.gameType !==
            "gemword"
        ) {

            throw new Error(
                "This session is for " +
                (
                    session.gameTitle ||
                    session.gameType
                ) +
                ", not GemWords."
            );

        }



        /* =================================
           VERIFY VOCABULARY SET
        ================================= */

        if (
            !session.vocabSetId
        ) {

            throw new Error(
                "The session does not have a vocabulary set assigned."
            );

        }



        /* =================================
           FIND PARTICIPANT RECORD
        ================================= */

        const participantRef =
            doc(
                db,
                "gameSessions",
                codeData.sessionId,
                "participants",
                user.uid
            );


        const participantSnapshot =
            await getDoc(
                participantRef
            );


        if (
            !participantSnapshot.exists()
        ) {

            throw new Error(
                "Your participant record was not found. Return to join.html and join the session again."
            );

        }


        sessionParticipantRef =
            participantRef;



        /* =================================
           LOAD TEACHER'S VOCABULARY SET
        ================================= */

        const vocabulary =
            await loadSet(
                session.vocabSetId
            );


        window.preloadedVocab =
            vocabulary.map(
                item => ({

                    word:
                        item.word,

                    definition:
                        item.definition ||
                        item.meaning ||
                        ""

                })
            );


        window.preloadedVocabTitle =
            session.vocabTitle ||
            window.preloadedVocabTitle ||
            "Vocabulary List";



        /* =================================
           CREATE SESSION CONTEXT
        ================================= */

        window.gameSessionContext = {

            joinCode:
                code,

            sessionId:
                codeData.sessionId,

            participantId:
                user.uid,

            vocabSetId:
                session.vocabSetId

        };



        /* =================================
           RESULT SUBMISSION
        ================================= */

        window.submitGemWordsSessionResult =
            async function(result) {

                if (
                    !sessionParticipantRef
                ) {

                    throw new Error(
                        "No GemWords participant record is connected."
                    );

                }


                await updateDoc(
                    sessionParticipantRef,
                    {

                        score:
                            Number(
                                result.score
                            ) || 0,


                        correctAnswers:
                            Number(
                                result.correctAnswers
                            ) || 0,


                        totalAttempts:
                            Number(
                                result.totalAttempts
                            ) || 0,


                        accuracy:
                            Math.max(
                                0,
                                Math.min(
                                    100,
                                    Number(
                                        result.accuracy
                                    ) || 0
                                )
                            ),


                        completed:
                            result.completed ===
                            true,


                        gameWon:
                            result.gameWon ===
                            true,


                        completionReason:
                            String(
                                result.completionReason ||
                                ""
                            ),


                        participantStatus:
                            result.completed ===
                            true
                                ? "finished"
                                : "playing",


                        lastUpdatedAt:
                            serverTimestamp()

                    }
                );

            };



        /* =================================
           RESET SESSION RESULT
        ================================= */

        window.resetGemWordsSessionResult =
            async function() {

                if (
                    !sessionParticipantRef
                ) {

                    return;

                }


                await updateDoc(
                    sessionParticipantRef,
                    {

                        score:
                            0,

                        correctAnswers:
                            0,

                        totalAttempts:
                            0,

                        accuracy:
                            0,

                        completed:
                            false,

                        gameWon:
                            false,

                        completionReason:
                            "",

                        participantStatus:
                            "playing",

                        gameStartedAt:
                            serverTimestamp(),

                        lastUpdatedAt:
                            serverTimestamp()

                    }
                );

            };



        /* =================================
           HIDE STANDALONE PANEL
        ================================= */

        if (teacherPanel) {

            teacherPanel.style.display =
                "none";

        }



        /* =================================
           START GEMWORDS
        ================================= */

        if (
            typeof window.startLoadedGame !==
            "function"
        ) {

            throw new Error(
                "startLoadedGame() is not available."
            );

        }


        console.log(
            "GEMWORDS: Starting classroom session:",
            code
        );


        await window.startLoadedGame();


    } catch(error) {

        showLoadError(
            "Could not start this GemWords session.",
            error
        );

    }

}



/* =========================================
   STANDALONE START BUTTON
========================================= */

loadSetButton.addEventListener(
    "click",
    () => {

        const setId =
            setSelector.value;


        if (!setId) {

            alert(
                "Please select a vocabulary set."
            );


            return;

        }


        startGameWithSet(
            setId
        );

    }
);



/* =========================================
   DETERMINE HOW GEMWORDS WAS OPENED
========================================= */

async function initializePage() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const sessionCode =
        params.get(
            "session"
        );


    const participantId =
        params.get(
            "participant"
        );



    /* =================================
       CLASSROOM MODE
    ================================= */

    if (
        sessionCode
    ) {

        await startGameWithSession(
            sessionCode,
            participantId
        );


        return;

    }



    /* =================================
       STANDALONE MODE
    ================================= */

    try {

        await loadVocabularySets();


    } catch(error) {

        showLoadError(
            "Could not load vocabulary sets from Firebase.",
            error
        );


        return;

    }



    /* =================================
       LIBRARY / URL MODE
    ================================= */

    const setId =
        params.get(
            "id"
        ) ||
        params.get(
            "set"
        );


    if (
        setId
    ) {

        await startGameWithSet(
            setId
        );

    }

}



/* =========================================
   INITIALIZE
========================================= */

initializePage();


</script>


</body>

</html>
