<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Vocabulary Jewel Game</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* =========================================
   GAME COMPLETE SCREEN
========================================= */

.game-complete-screen {

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.90);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 9999;
}


.game-complete-screen.show {

    display: flex;

}


.game-complete-panel {

    width: min(
        520px,
        90vw
    );

    padding: 40px;

    background:
        #1b1b20;

    border:
        3px solid #777;

    border-radius:
        18px;

    box-shadow:
        0 0 35px rgba(
            0,
            0,
            0,
            0.85
        );

    text-align:
        center;

    font-family:
        "Times New Roman",
        serif;

}


.game-complete-panel h1 {

    margin-top:
        0;

    margin-bottom:
        30px;

    font-size:
        38px;

    color:
        #ffffff;

}


.results-list-name,
.results-stat {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        20px;

    padding:
        14px 18px;

    margin:
        10px 0;

    background:
        #29292f;

    border-radius:
        10px;

    font-size:
        22px;

}


.results-label {

    color:
        #aaa;

    font-size:
        17px;

}


#resultsListName,
#resultsScore,
#resultsAccuracy {

    color:
        #ffffff;

    font-weight:
        bold;

}


#resultsAccuracy {

    font-size:
        28px;

}


.results-buttons {

    display:
        flex;

    gap:
        15px;

    justify-content:
        center;

    margin-top:
        30px;

}


.results-buttons button {

    padding:
        12px 22px;

    border:
        none;

    border-radius:
        8px;

    cursor:
        pointer;

    font-family:
        "Times New Roman",
        serif;

    font-size:
        18px;

    font-weight:
        bold;

}


#playAgainButton {

    background:
        #7b2cbf;

    color:
        white;

}


#libraryButton {

    background:
        #444;

    color:
        white;

}


#playAgainButton:hover,
#libraryButton:hover {

    opacity:
        0.85;

}

</style>

</head>


<body>


<!-- =========================================
     TEACHER PANEL
========================================= -->

<div id="teacher-panel">

    <h2>GemWords</h2>

    <p>
        Select a vocabulary set from your library.
    </p>

    <select id="setSelector">

        <option value="">
            Select Vocabulary Set
        </option>

    </select>

    <button id="load-set-btn">
        Start Game
    </button>

</div>


<!-- =========================================
     HUD
========================================= -->

<div class="stats-hud">

    <div class="stat-item">

        SCORE:
        <span id="score">
            0
        </span>

    </div>


    <div class="stat-item">

        TIME:
        <span id="timer">
            180
        </span>

    </div>

</div>


<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <div class="board-column">

        <h3>
            Words
        </h3>

        <div id="gemGrid"></div>

    </div>


    <div class="board-column">

        <h3>
            Definitions
        </h3>

        <div id="cardGrid"></div>

    </div>

</div>


<!-- =========================================
     GAME COMPLETE SCREEN
========================================= -->

<div
    id="gameCompleteScreen"
    class="game-complete-screen"
>

    <div class="game-complete-panel">

        <h1>
            GemWords Complete!
        </h1>


        <div class="results-list-name">

            <span class="results-label">
                Vocabulary List
            </span>

            <span id="resultsListName">
                Vocabulary List
            </span>

        </div>


        <div class="results-stat">

            <span class="results-label">
                Score
            </span>

            <span id="resultsScore">
                0
            </span>

        </div>


        <div class="results-stat">

            <span class="results-label">
                Accuracy
            </span>

            <span id="resultsAccuracy">
                0%
            </span>

        </div>


        <div class="results-buttons">

            <button
                id="playAgainButton"
                type="button"
            >
                Play Again
            </button>


            <button
                id="libraryButton"
                type="button"
            >
                Back to Library
            </button>

        </div>

    </div>

</div>


<!-- =========================================
     MAIN GAME SCRIPT
========================================= -->

<script src="script (1).js"></script>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};



const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );



/* =========================================
   POPULATE DROPDOWN
========================================= */

async function loadVocabularySets() {

    const selector =
        document.getElementById(
            "setSelector"
        );


    try {

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "vocabSets"
                )
            );


        snapshot.forEach(
            docSnap => {

                const data =
                    docSnap.data();


                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    docSnap.id;


                option.textContent =
                    data.title ||
                    docSnap.id;


                selector.appendChild(
                    option
                );

            }
        );


        console.log(
            "Vocabulary sets loaded."
        );


    } catch(error) {

        console.error(
            "Error loading sets:",
            error
        );

    }

}



/* =========================================
   LOAD VOCAB SET
========================================= */

async function loadSet(setId) {

    const ref =
        doc(
            db,
            "vocabSets",
            setId
        );


    const snapshot =
        await getDoc(
            ref
        );


    if (!snapshot.exists()) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();


    /* =====================================
       SAVE LIST TITLE
    ===================================== */

    window.preloadedVocabTitle =
        data.title ||
        setId;



    /* =====================================
       NEW FORMAT
    ===================================== */

    if (
        Array.isArray(
            data.items
        )
    ) {

        return data.items;

    }



    /* =====================================
       LEGACY FORMAT
    ===================================== */

    let terms =
        data.terms;


    if (
        typeof terms ===
        "string"
    ) {

        try {

            terms =
                JSON.parse(
                    terms
                );


        } catch(error) {

            console.error(
                "Parse error:",
                error
            );


            terms =
                [];

        }

    }


    return terms || [];

}



/* =========================================
   START GAME
========================================= */

async function startGameWithSet(setId) {

    try {

        console.log(
            "GEMWORDS: Loading set:",
            setId
        );


        const vocab =
            await loadSet(
                setId
            );


        console.log(
            "GEMWORDS: Firebase set loaded:",
            vocab
        );


        console.log(
            "GEMWORDS: Number of vocabulary items:",
            vocab.length
        );


        window.preloadedVocab =
            vocab.map(
                item => ({

                    word:
                        item.word,

                    definition:
                        item.definition ||
                        item.meaning ||
                        ""

                })
            );


        console.log(
            "GEMWORDS: preloadedVocab:",
            window.preloadedVocab
        );


        console.log(
            "GEMWORDS: Vocabulary list title:",
            window.preloadedVocabTitle
        );



        /* =================================
           HIDE TEACHER PANEL
        ================================= */

        const panel =
            document.getElementById(
                "teacher-panel"
            );


        if (panel) {

            panel.style.display =
                "none";

        }



        /* =================================
           START GAME
        ================================= */

        if (
            typeof window.startLoadedGame ===
            "function"
        ) {

            console.log(
                "GEMWORDS: Starting game..."
            );


            window.startLoadedGame();


        } else {

            console.error(
                "GEMWORDS: startLoadedGame() does not exist."
            );

        }


    } catch(error) {

        console.error(
            "Could not load vocabulary:",
            error
        );


        alert(
            "Could not load vocabulary set."
        );

    }

}


window.startGameWithSet =
    startGameWithSet;



/* =========================================
   LOAD DROPDOWN ON PAGE OPEN
========================================= */

loadVocabularySets();



/* =========================================
   URL PARAM SUPPORT
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const setId =
    params.get("id") ||
    params.get("set");


if (setId) {

    startGameWithSet(
        setId
    );

}



/* =========================================
   BUTTON CLICK
========================================= */

document
    .getElementById(
        "load-set-btn"
    )
    .addEventListener(
        "click",
        () => {


            const selectedSet =
                document
                .getElementById(
                    "setSelector"
                )
                .value;


            if (!selectedSet) {

                alert(
                    "Please select a vocabulary set."
                );


                return;

            }


            startGameWithSet(
                selectedSet
            );

        }
    );

</script>


</body>

</html>
