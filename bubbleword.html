<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BubbleWord</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <!-- GAME CANVAS -->

    <canvas id="gameCanvas"></canvas>


    <!-- MUTE BUTTON -->

    <button id="mute-btn">
        🔊
    </button>


    <!-- =====================================
         HIDDEN TEACHER PANEL

         Kept because script.js references it.
    ====================================== -->

    <div
        id="teacher-panel"
        style="display:none;"
    ></div>

</div>


<!-- =========================================
     MAIN GAME SCRIPT
     
     IMPORTANT:
     Load this BEFORE the Firebase module
     so startLoadedGame exists when Firebase
     finishes loading.
========================================= -->

<script src="script.js"></script>


<!-- =========================================
     FIREBASE LOADER
========================================= -->

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


console.log(
    "BUBBLEWORD: Firebase initialized."
);


/* =========================================
   LOAD VOCABULARY SET
========================================= */

async function loadSet(setId) {

    console.log(
        "BUBBLEWORD: Loading set:",
        setId
    );


    const ref =
        doc(
            db,
            "vocabSets",
            setId
        );


    const snapshot =
        await getDoc(ref);


    if (!snapshot.exists()) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();


    console.log(
        "BUBBLEWORD: Firebase data:",
        data
    );


    /* =====================================
       NEW FORMAT
    ===================================== */

    if (
        Array.isArray(data.items)
    ) {

        return data.items;

    }


    /* =====================================
       LEGACY FORMAT
    ===================================== */

    let terms =
        data.terms;


    if (
        typeof terms === "string"
    ) {

        try {

            terms =
                JSON.parse(terms);

        }
        catch(error) {

            console.error(
                "BUBBLEWORD: Parse error:",
                error
            );

            terms = [];

        }

    }


    return terms || [];

}


/* =========================================
   START GAME WITH FIREBASE VOCABULARY
========================================= */

async function startGameWithSet(setId) {

    try {

        const vocab =
            await loadSet(setId);


        /* =================================
           CONVERT FIREBASE VOCABULARY
        ================================= */

        window.preloadedVocab =
            vocab.map(item => ({

                word:
                    item.word,

                definition:
                    item.definition ||
                    item.meaning ||
                    ""

            }));


        console.log(
            "BUBBLEWORD: Vocabulary loaded:",
            window.preloadedVocab
        );


        /* =================================
           MAKE SURE THERE IS VOCABULARY
        ================================= */

        if (
            !window.preloadedVocab ||
            window.preloadedVocab.length === 0
        ) {

            throw new Error(
                "This vocabulary set contains no words."
            );

        }


        /* =================================
           START THE GAME
           
           script.js has already loaded
           above, so startLoadedGame()
           should now exist.
        ================================= */

        if (
            typeof window.startLoadedGame ===
            "function"
        ) {

            console.log(
                "BUBBLEWORD: Starting game..."
            );

            window.startLoadedGame();

        }
        else {

            console.error(
                "BUBBLEWORD: startLoadedGame() was not found."
            );

            throw new Error(
                "BubbleWord game script could not be loaded."
            );

        }

    }
    catch(error) {

        console.error(
            "BUBBLEWORD: Could not load vocabulary:",
            error
        );


        alert(
            "Could not load this vocabulary set.\n\n" +
            error.message
        );

    }

}


/* =========================================
   GET SET ID FROM URL
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const setId =
    params.get("id") ||
    params.get("set");


/* =========================================
   START AUTOMATICALLY
========================================= */

if (setId) {

    console.log(
        "BUBBLEWORD: URL set ID:",
        setId
    );

    startGameWithSet(setId);

}
else {

    console.error(
        "BUBBLEWORD: No vocabulary set ID found in URL."
    );

    alert(
        "No vocabulary set was specified."
    );

}

</script>


</body>

</html>
