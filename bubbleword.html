<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BubbleWord</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

    <style>

        /* =====================================
           HUD
        ===================================== */

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;

            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.7);
            color: white;

            padding: 8px 14px;

            border-radius: 8px;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
        }

        #target-word {
            display: none;
        }

        #game-container {
            position: relative;
        }

    </style>

</head>

<body>


<!-- =========================================
     GAME AREA
========================================= -->

<div id="game-container">

    <!-- =====================================
         HUD
    ====================================== -->

<div id="hud">

    <div class="hud-item">
        Score: <span id="score">0</span>
    </div>

    <div class="hud-item">
        Level: <span id="level">1</span>
    </div>

    <div class="hud-item">
        Time: <span id="timer">60</span>
    </div>

    <div class="hud-item">
        Shots: <span id="attempts">20</span>
    </div>

</div>

<div id="target-word"></div>


    <!-- GAME CANVAS -->

    <canvas id="gameCanvas"></canvas>


    <!-- =====================================
         SOUND BUTTON
    ====================================== -->

    <button
        id="mute-btn"
        type="button"
        aria-label="Mute game sounds"
        title="Mute game sounds"
    >
        🔊
    </button>


    <!-- =====================================
         HIDDEN TEACHER PANEL
    ====================================== -->

    <div
        id="teacher-panel"
        style="display:none;"
    ></div>

</div>


<!-- =========================================
     VOCABULARY ARCADE SOUND SYSTEM

     IMPORTANT:
     sound.js must load BEFORE script.js.
========================================= -->

sounds/sound.jsscript>


<!-- =========================================
     MAIN GAME SCRIPT
========================================= -->

<script src="script.js"></script>


<!-- =========================================
     FIREBASE LOADER
========================================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// =========================================
// FIREBASE CONFIG
// =========================================

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


// =========================================
// LOAD VOCABULARY SET
// =========================================

async function loadSet(setId) {

    console.log(
        "BUBBLEWORD: Loading set:",
        setId
    );

    const ref =
        doc(
            db,
            "vocabSets",
            setId
        );

    const snapshot =
        await getDoc(ref);

    if (!snapshot.exists()) {

        throw new Error(
            "Vocabulary set not found."
        );
    }

    const data =
        snapshot.data();

    console.log(
        "BUBBLEWORD: Firebase data:",
        data
    );

    if (
        Array.isArray(data.items)
    ) {

        return data.items;
    }

    let terms =
        data.terms;

    if (
        typeof terms === "string"
    ) {

        try {

            terms =
                JSON.parse(terms);

        }
        catch(error) {

            console.error(
                "BUBBLEWORD: Parse error:",
                error
            );

            terms = [];
        }
    }

    return terms || [];
}


// =========================================
// START GAME WITH FIREBASE VOCAB
// =========================================

async function startGameWithSet(setId) {

    try {

        const vocab =
            await loadSet(setId);

        window.preloadedVocab =
            vocab
                .map(item => ({

                    word:
                        String(
                            item.word || ""
                        ).trim(),

                    definition:
                        String(
                            item.definition ||
                            item.meaning ||
                            ""
                        ).trim()

                }))
                .filter(item =>
                    item.word &&
                    item.definition
                );

        console.log(
            "BUBBLEWORD: Vocabulary loaded:",
            window.preloadedVocab
        );

        if (
            typeof window.startLoadedGame ===
            "function"
        ) {

            console.log(
                "BUBBLEWORD: Starting game..."
            );

            window.startLoadedGame();

        }
        else {

            console.log(
                "BUBBLEWORD: Game script has not loaded yet. Waiting..."
            );

            window.addEventListener(

                "bubbleword-ready",

                () => {

                    window.startLoadedGame();

                },

                { once: true }

            );
        }

    }
    catch(error) {

        console.error(
            "BUBBLEWORD: Could not load vocabulary:",
            error
        );

        alert(
            "Could not load this vocabulary set."
        );
    }
}


// =========================================
// GET SET ID FROM URL
// =========================================

const params =
    new URLSearchParams(
        window.location.search
    );

const setId =
    params.get("id") ||
    params.get("set");


// =========================================
// START AUTOMATICALLY
// =========================================

if (setId) {

    startGameWithSet(setId);

}
else {

    console.error(
        "BUBBLEWORD: No vocabulary set ID found in URL."
    );
}

</script>

</body>
</html>
