<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Vocabulary Match Game</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    margin-bottom: 20px;
}

/* =========================================
   STATUS
========================================= */

.status {
    margin-bottom: 15px;
    color: #666;
    font-size: 16px;
}

/* =========================================
   STATS
========================================= */

.stats {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 20px;
    font-weight: bold;
}

/* =========================================
   BUTTON
========================================= */

button {
    background: #0078d4;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    margin-bottom: 20px;
}

button:hover {
    background: #005ea8;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

/* =========================================
   GAME GRID
========================================= */

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

/* =========================================
   TILES
========================================= */

.tile {
    min-height: 100px;
    padding: 10px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    cursor: pointer;
    user-select: none;

    transition: .25s;

    font-size: 16px;
    font-weight: bold;

    box-shadow:
        0 2px 6px rgba(0,0,0,.15);
}

.tile:hover {
    transform: scale(1.03);
}

/* =========================================
   HIDDEN TILE
========================================= */

.tile.hidden {
    background: #455a64;
    color: transparent;
}

/* =========================================
   WORD TILE
========================================= */

.tile.word.revealed {
    background: #1e88e5;
    color: white;
    border: 2px solid #1565c0;
}

/* =========================================
   DEFINITION TILE
========================================= */

.tile.definition.revealed {
    background: #8e24aa;
    color: white;
    border: 2px solid #6a1b9a;
}

/* =========================================
   MATCHED
========================================= */

.tile.matched {
    background: #2e7d32;
    color: white;
    cursor: default;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    .grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .tile {
        min-height: 80px;
        font-size: 14px;
    }

}

</style>

</head>


<body>


<div class="container">

    <h1>Vocabulary Match Game</h1>

    <div id="status" class="status">
        Loading vocabulary...
    </div>


    <div class="stats">

        <div>
            Matches:
            <span id="score">0</span>/10
        </div>

        <div>
            Moves:
            <span id="moves">0</span>
        </div>

        <div>
            Time:
            <span id="timer">0</span>s
        </div>

    </div>


    <button id="playAgainBtn" disabled>
        🔄 Play Again
    </button>


    <div id="gameBoard" class="grid"></div>

</div>


<!-- =========================================
     FIREBASE
========================================= -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";


import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",

    authDomain:
        "bubbleword-30367.firebaseapp.com",

    projectId:
        "bubbleword-30367",

    storageBucket:
        "bubbleword-30367.firebasestorage.app",

    messagingSenderId:
        "1058393039019",

    appId:
        "1:1058393039019:web:72ffaf6dab677b9a3657ee"

};


/* =========================================
   INITIALIZE FIREBASE
========================================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================================
   DOM ELEMENTS
========================================= */

const board =
    document.getElementById("gameBoard");

const scoreDisplay =
    document.getElementById("score");

const moveDisplay =
    document.getElementById("moves");

const timerDisplay =
    document.getElementById("timer");

const playAgainBtn =
    document.getElementById("playAgainBtn");

const statusDisplay =
    document.getElementById("status");


/* =========================================
   GAME STATE
========================================= */

let selectedTiles = [];

let lockBoard = false;

let score = 0;

let moves = 0;

let timer = 0;

let timerInterval = null;

let currentItems = [];


/* =========================================
   GET VOCABULARY SET ID
========================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const setId =
    params.get("id") ||
    params.get("set");


/* =========================================
   LOAD ONE VOCABULARY SET
========================================= */

async function loadVocabularySet(setId) {

    console.log(
        "MATCHING GAME: Loading set:",
        setId
    );


    if (!setId) {

        throw new Error(
            "No vocabulary set ID was provided."
        );

    }


    const ref =
        doc(
            db,
            "vocabSets",
            setId
        );


    const snapshot =
        await getDoc(ref);


    if (!snapshot.exists()) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();


    console.log(
        "MATCHING GAME: Firebase data:",
        data
    );


    /*
     * Current Firebase format:
     *
     * items: [
     *   {
     *      word: "...",
     *      definition: "..."
     *   }
     * ]
     */

    if (
        Array.isArray(data.items)
    ) {

        return data.items;

    }


    /*
     * Legacy support
     */

    if (
        Array.isArray(data.terms)
    ) {

        return data.terms;

    }


    throw new Error(
        "This vocabulary set contains no items."
    );

}


/* =========================================
   START GAME
========================================= */

async function loadGame() {

    try {

        statusDisplay.textContent =
            "Loading vocabulary...";


        const items =
            await loadVocabularySet(setId);


        /*
         * Keep only entries that have
         * both a word and definition.
         */

        currentItems =
            items
                .map(item => ({

                    word:
                        item.word || "",

                    definition:
                        item.definition ||
                        item.meaning ||
                        ""

                }))
                .filter(item =>
                    item.word &&
                    item.definition
                );


        console.log(
            "MATCHING GAME: Vocabulary loaded:",
            currentItems
        );


        if (
            currentItems.length < 10
        ) {

            throw new Error(
                "This vocabulary set needs at least 10 valid vocabulary items."
            );

        }


        statusDisplay.textContent =
            "Vocabulary loaded!";


        startGame(
            currentItems
        );


    }
    catch(error) {

        console.error(
            "MATCHING GAME: Could not load vocabulary:",
            error
        );


        statusDisplay.textContent =
            "Unable to load vocabulary.";


        board.innerHTML =
            `<div style="
                grid-column: 1 / -1;
                padding: 40px;
                color: #b00020;
                font-size: 20px;
                font-weight: bold;
            ">
                ${error.message}
            </div>`;

    }

}


/* =========================================
   TIMER
========================================= */

function startTimer() {

    clearInterval(timerInterval);


    timer = 0;


    timerDisplay.textContent =
        "0";


    timerInterval =
        setInterval(() => {

            timer++;


            timerDisplay.textContent =
                timer;

        }, 1000);

}


function stopTimer() {

    clearInterval(
        timerInterval
    );

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }


    return array;

}


/* =========================================
   START GAME
========================================= */

function startGame(items) {

    board.innerHTML =
        "";


    playAgainBtn.disabled =
        false;


    score = 0;

    moves = 0;


    scoreDisplay.textContent =
        "0";

    moveDisplay.textContent =
        "0";


    selectedTiles = [];

    lockBoard = false;


    startTimer();


    /*
     * Choose 10 vocabulary pairs.
     */

    const chosenItems =
        shuffle(
            [...items]
        ).slice(0, 10);


    const cards = [];


    /*
     * Create word + definition
     * for each vocabulary item.
     */

    chosenItems.forEach(
        (item, index) => {

            cards.push({

                pair:
                    index,

                text:
                    item.word,

                type:
                    "word"

            });


            cards.push({

                pair:
                    index,

                text:
                    item.definition,

                type:
                    "definition"

            });

        }
    );


    /*
     * Shuffle all 20 tiles.
     */

    shuffle(cards);


    /*
     * Create tiles.
     */

    cards.forEach(card => {

        const tile =
            document.createElement(
                "div"
            );


        tile.className =
            "tile hidden";


        tile.dataset.pair =
            card.pair;


        tile.dataset.type =
            card.type;


        tile.textContent =
            card.text;


        tile.classList.add(
            card.type
        );


        tile.addEventListener(
            "click",
            () => handleTile(tile)
        );


        board.appendChild(
            tile
        );

    });

}


/* =========================================
   HANDLE TILE CLICK
========================================= */

function handleTile(tile) {

    if (lockBoard)
        return;


    if (
        tile.classList.contains(
            "matched"
        )
    )
        return;


    if (
        tile.classList.contains(
            "revealed"
        )
    )
        return;


    tile.classList.remove(
        "hidden"
    );


    tile.classList.add(
        "revealed"
    );


    selectedTiles.push(
        tile
    );


    if (
        selectedTiles.length < 2
    )
        return;


    moves++;


    moveDisplay.textContent =
        moves;


    lockBoard = true;


    const first =
        selectedTiles[0];


    const second =
        selectedTiles[1];


    const match =
        first.dataset.pair ===
        second.dataset.pair;


    /* =====================================
       CORRECT MATCH
    ===================================== */

    if (match) {

        first.classList.remove(
            "revealed"
        );


        second.classList.remove(
            "revealed"
        );


        first.classList.add(
            "matched"
        );


        second.classList.add(
            "matched"
        );


        score++;


        scoreDisplay.textContent =
            score;


        selectedTiles = [];


        lockBoard = false;


        /*
         * Game complete
         */

        if (score === 10) {

            stopTimer();


            setTimeout(() => {

                const efficiency =
                    Math.round(
                        (1000 / moves) *
                        (100 / Math.max(
                            timer,
                            1
                        ))
                    );


                alert(
`🎉 Congratulations!

Time: ${timer} seconds

Moves: ${moves}

Efficiency Score:
${efficiency}`
                );


            }, 300);

        }

    }


    /* =====================================
       INCORRECT MATCH
    ===================================== */

    else {

        setTimeout(() => {

            first.classList.remove(
                "revealed"
            );


            second.classList.remove(
                "revealed"
            );


            first.classList.add(
                "hidden"
            );


            second.classList.add(
                "hidden"
            );


            selectedTiles = [];


            lockBoard = false;

        }, 1000);

    }

}


/* =========================================
   PLAY AGAIN
========================================= */

playAgainBtn.addEventListener(
    "click",
    () => {

        if (
            currentItems.length
        ) {

            startGame(
                currentItems
            );

        }

    }
);


/* =========================================
   START AUTOMATICALLY
========================================= */

if (setId) {

    loadGame();

}
else {

    statusDisplay.textContent =
        "No vocabulary set was specified.";

    board.innerHTML =
        `<div style="
            grid-column: 1 / -1;
            padding: 40px;
            color: #b00020;
            font-size: 20px;
            font-weight: bold;
        ">
            No vocabulary set was specified.
        </div>`;

}

</script>

</body>
</html>
