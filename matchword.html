<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Match Game</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

select{
    width:100%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}

.stats{
    margin-bottom:20px;
    font-size:20px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.tile{
    min-height:100px;
    padding:10px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.25s;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.tile:hover{
    transform:scale(1.03);
}

.tile.hidden{
    background:#455a64;
    color:transparent;
}

/* Word tiles */

.tile.word.revealed{
    background:#1e88e5;
    color:white;
    border:2px solid #1565c0;
}

/* Definition tiles */

.tile.definition.revealed{
    background:#8e24aa;
    color:white;
    border:2px solid #6a1b9a;
}

/* Matched */

.tile.matched{
    background:#2e7d32;
    color:white;
    border:none;
    cursor:default;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:repeat(4,1fr);
    }

    .tile{
        min-height:80px;
        font-size:14px;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>Vocabulary Match Game</h1>

<select id="setSelector">
    <option value="">Select Vocabulary Set</option>
</select>

<div class="stats">
    Matches:
    <span id="score">0</span> / 10
</div>

<div id="gameBoard" class="grid"></div>

</div>

}

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const selector =
    document.getElementById("setSelector");

const board =
    document.getElementById("gameBoard");

const scoreDisplay =
    document.getElementById("score");

let selectedTiles = [];
let lockBoard = false;
let score = 0;

async function loadSets(){

    const snapshot =
        await getDocs(
            collection(db,"vocabSets")
        );

    snapshot.forEach(doc=>{

        const data = doc.data();

        const option =
            document.createElement("option");

        option.value = doc.id;
        option.textContent = data.title;

        option.dataset.items =
            JSON.stringify(data.items);

        selector.appendChild(option);

    });

}

selector.addEventListener("change", ()=>{

    const selected =
        selector.options[
            selector.selectedIndex
        ];

    if(!selected.dataset.items) return;

    const items =
        JSON.parse(selected.dataset.items);

    startGame(items);

});
