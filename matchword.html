<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Match Game</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

select{
    width:100%;
    max-width:500px;
    padding:12px;
    font-size:16px;
    margin-bottom:20px;
}

.stats{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-bottom:20px;
    font-size:20px;
    font-weight:bold;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-bottom:20px;
}

button:hover{
    background:#005ea8;
}

.grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.tile{
    min-height:100px;
    padding:10px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.25s;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.tile:hover{
    transform:scale(1.03);
}

.tile.hidden{
    background:#455a64;
    color:transparent;
}

.tile.word.revealed{
    background:#1e88e5;
    color:white;
    border:2px solid #1565c0;
}

.tile.definition.revealed{
    background:#8e24aa;
    color:white;
    border:2px solid #6a1b9a;
}

.tile.matched{
    background:#2e7d32;
    color:white;
    cursor:default;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:repeat(4,1fr);
    }

    .tile{
        min-height:80px;
        font-size:14px;
    }

}

</style>
</head>
<body>

<div class="container">

<h1>Vocabulary Match Game</h1>

<select id="setSelector">
    <option value="">Select Vocabulary Set</option>
</select>

<div class="stats">
    <div>Matches: <span id="score">0</span>/10</div>
    <div>Moves: <span id="moves">0</span></div>
    <div>Time: <span id="timer">0</span>s</div>
</div>

<button id="playAgainBtn" disabled>
🔄 Play Again
</button>

<div id="gameBoard" class="grid"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const selector =
    document.getElementById("setSelector");

const board =
    document.getElementById("gameBoard");

const scoreDisplay =
    document.getElementById("score");

const moveDisplay =
    document.getElementById("moves");

const timerDisplay =
    document.getElementById("timer");

const playAgainBtn =
    document.getElementById("playAgainBtn");

let selectedTiles = [];
let lockBoard = false;

let score = 0;
let moves = 0;

let timer = 0;
let timerInterval = null;

let currentItems = [];

async function loadSets(){

    const snapshot =
        await getDocs(
            collection(db,"vocabSets")
        );

    snapshot.forEach(doc=>{

        const data = doc.data();

        const option =
            document.createElement("option");

        option.value = doc.id;
        option.textContent = data.title;

        option.dataset.items =
            JSON.stringify(data.items);

        selector.appendChild(option);

    });

}

selector.addEventListener("change", ()=>{

    const selected =
        selector.options[
            selector.selectedIndex
        ];

    if(!selected.dataset.items) return;

    currentItems =
        JSON.parse(selected.dataset.items);

    startGame(currentItems);

});

playAgainBtn.addEventListener("click", ()=>{

    if(currentItems.length){
        startGame(currentItems);
    }

});

function startTimer(){

    clearInterval(timerInterval);

    timer = 0;

    timerDisplay.textContent = "0";

    timerInterval =
        setInterval(()=>{

            timer++;

            timerDisplay.textContent =
                timer;

        },1000);

}

function stopTimer(){

    clearInterval(timerInterval);

}

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [array[i],array[j]] =
        [array[j],array[i]];

    }

    return array;

}

function startGame(items){

    board.innerHTML = "";

    playAgainBtn.disabled = false;

    score = 0;
    moves = 0;

    scoreDisplay.textContent = "0";
    moveDisplay.textContent = "0";

    selectedTiles = [];
    lockBoard = false;

    startTimer();

    const chosenItems =
        shuffle([...items])
            .slice(0,10);

    const cards = [];

    chosenItems.forEach((item,index)=>{

        cards.push({
            pair:index,
            text:item.word,
            type:"word"
        });

        cards.push({
            pair:index,
            text:item.definition,
            type:"definition"
        });

    });

    shuffle(cards);

    cards.forEach(card=>{

        const tile =
            document.createElement("div");

        tile.className =
            "tile hidden";

        tile.dataset.pair =
            card.pair;

        tile.dataset.type =
            card.type;

        tile.textContent =
            card.text;

        tile.classList.add(
            card.type
        );

        tile.addEventListener(
            "click",
            ()=>handleTile(tile)
        );

        board.appendChild(tile);

    });

}

function handleTile(tile){

    if(lockBoard) return;

    if(tile.classList.contains("matched")) return;

    if(tile.classList.contains("revealed")) return;

    tile.classList.remove("hidden");
    tile.classList.add("revealed");

    selectedTiles.push(tile);

    if(selectedTiles.length < 2) return;

    moves++;

    moveDisplay.textContent =
        moves;

    lockBoard = true;

    const first =
        selectedTiles[0];

    const second =
        selectedTiles[1];

    const match =
        first.dataset.pair ===
        second.dataset.pair;

    if(match){

        first.classList.remove("revealed");
        second.classList.remove("revealed");

        first.classList.add("matched");
        second.classList.add("matched");

        score++;

        scoreDisplay.textContent =
            score;

        selectedTiles = [];
        lockBoard = false;

        if(score === 10){

            stopTimer();

            setTimeout(()=>{

                alert(
`🎉 Congratulations!

Time: ${timer} seconds

Moves: ${moves}

Efficiency Score:
${Math.round((1000 / moves) * (100 / Math.max(timer,1)))}`
                );

            },300);

        }

    } else {

        setTimeout(()=>{

            first.classList.remove("revealed");
            second.classList.remove("revealed");

            first.classList.add("hidden");
            second.classList.add("hidden");

            selectedTiles = [];

            lockBoard = false;

        },1000);

    }

}

loadSets();

</script>

</body>
</html>
