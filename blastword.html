<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlastWord - Galaga Vocabulary Learning</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 1300px; /* 130% wider canvas layout */
            height: 800px;
            background: radial-gradient(circle at center, #101030 0%, #050510 100%);
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Target Word Footer Bar */
        #target-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: rgba(10, 15, 30, 0.95);
            border-top: 2px solid #00ffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 10;
        }

        .prompt-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .prompt-label {
            font-size: 18px;
            color: #8888aa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .target-word {
            font-size: 36px;
            font-weight: 800;
            color: #00ffff;
            text-shadow: 0 0 14px rgba(0, 255, 255, 0.8);
        }

        .stats-container {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .ammo-board {
            font-size: 22px;
            color: #00ffcc;
            font-weight: bold;
        }

        .score-board {
            font-size: 24px;
            color: #ff00ff;
            font-weight: bold;
        }

        /* Loading Screen Overlay */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            color: #00ffff;
            z-index: 30;
            gap: 15px;
        }

        #loading-screen.hidden {
            display: none;
        }

        /* Game Over Screen Overlay */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #game-over-screen.hidden {
            display: none;
        }

        #game-over-screen h1 {
            font-size: 56px;
            color: #ff3366;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.8);
        }

        #game-over-screen p {
            font-size: 26px;
            margin-bottom: 25px;
        }

        #restart-btn {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #00ffff;
            color: #050510;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            transition: transform 0.1s, background 0.2s;
        }

        #restart-btn:hover {
            background: #33ffff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="loading-screen">
        <div id="loading-text">Loading Vocabulary Set...</div>
    </div>

    <canvas id="gameCanvas" width="1300" height="800"></canvas>
    
    <div id="target-bar">
        <div class="prompt-container">
            <span class="prompt-label">Target Word: </span>
            <span id="target-word-display" class="target-word">---</span>
        </div>
        <div class="stats-container">
            <div class="ammo-board">
                Shots Left: <span id="ammo-display">40</span>
            </div>
            <div class="score-board">
                Score: <span id="score-display">0</span>
            </div>
        </div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn">Play Again</button>
    </div>
</div>

<script type="module">
    /* =========================================
       FIREBASE IMPORTS & CONFIG
    ========================================= */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
        authDomain: "bubbleword-30367.firebaseapp.com",
        projectId: "bubbleword-30367",
        storageBucket: "bubbleword-30367.firebasestorage.app",
        messagingSenderId: "1058393039019",
        appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    /* =========================================
       VOCABULARY LOADER INTEGRATION
    ========================================= */
    async function loadSet(setId) {
        const ref = doc(db, "vocabSets", setId);
        const snapshot = await getDoc(ref);

        if (!snapshot.exists()) {
            throw new Error("Vocabulary set not found.");
        }

        let terms = snapshot.data().terms;

        if (typeof terms === "string") {
            try {
                terms = JSON.parse(terms);
            } catch (error) {
                console.error("Vocabulary JSON parse failed:", error);
                terms = [];
            }
        }

        if (!Array.isArray(terms)) {
            throw new Error("Vocabulary data is not an array.");
        }

        return terms;
    }

    /* =========================================
       GAME STATE & CONFIGURATION
    ========================================= */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const targetWordDisplay = document.getElementById('target-word-display');
    const scoreDisplay = document.getElementById('score-display');
    const ammoDisplay = document.getElementById('ammo-display');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreDisplay = document.getElementById('final-score');
    const loadingScreen = document.getElementById('loading-screen');
    const restartBtn = document.getElementById('restart-btn');

    let vocabList = [];

    const SHIP_COLORS = ['#1E90FF', '#32CD32', '#9370DB', '#FF69B4', '#FF8C00'];
    const GRID_ROWS = 4;
    const GRID_COLS = 5;
    const MAX_AMMO = 40;
    
    let score = 0;
    let ammo = MAX_AMMO;

    let isGameOver = false;
    let currentTarget = null;
    
    let baseSpeed = 0.08;
    let speedMultiplier = 1;
    let horizontalDirection = 1;
    let horizontalSpeed = 1.4;

    const keys = {};

    const player = {
        x: canvas.width / 2 - 30,
        y: canvas.height - 120,
        width: 60,
        height: 40,
        speed: 9,
        color: '#00ffff'
    };

    let bullets = [];
    let ships = [];

    /* =========================================
       INITIALIZE GAME & VOCAB DATA
    ========================================= */
    async function initVocab() {
        const params = new URLSearchParams(window.location.search);
        const setId = params.get("id") || params.get("set");

        if (setId) {
            try {
                const terms = await loadSet(setId);
                vocabList = terms.map((v, index) => ({
                    id: index + 1,
                    word: v.word,
                    def: v.meaning || v.definition || v.def
                }));
                console.log("Firebase vocabulary loaded:", vocabList);
            } catch (error) {
                console.error("Firebase vocabulary error:", error);
                alert("Could not load Firebase vocabulary set. Using fallback list.");
            }
        } else {
            console.warn("No Firebase vocabulary set ID was provided in URL query params.");
        }

        // Default Fallback
        if (!vocabList || vocabList.length === 0) {
            vocabList = [
                { word: "amāre", def: "to love" },
                { word: "monēre", def: "to warn" },
                { word: "mittere", def: "to send" },
                { word: "audīre", def: "to hear" },
                { word: "capere", def: "to take" },
                { word: "vocāre", def: "to call" },
                { word: "dīcere", def: "to say" },
                { word: "vidēre", def: "to see" },
                { word: "habēre", def: "to have" },
                { word: "facere", def: "to do / make" }
            ];
        }

        loadingScreen.classList.add('hidden');
        startGame();
    }

    window.startLoadedGame = function() {
        loadingScreen.classList.add('hidden');
        startGame();
    };

    /* =========================================
       CONTROLS & GAMEPLAY
    ========================================= */
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Space' && !isGameOver) {
            e.preventDefault();
            fireBullet();
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    restartBtn.addEventListener('click', () => {
        resetGame();
    });

    function fireBullet() {
        if (ammo > 0) {
            ammo--;
            ammoDisplay.textContent = ammo;

            bullets.push({
                x: player.x + player.width / 2 - 4,
                y: player.y,
                width: 8,
                height: 20,
                speed: 13,
                color: '#ff00ff'
            });
        }
    }

    function getLowestShips() {
        const lowestMap = {};
        ships.forEach(ship => {
            if (!lowestMap[ship.gridCol] || ship.y > lowestMap[ship.gridCol].y) {
                lowestMap[ship.gridCol] = ship;
            }
        });
        return Object.values(lowestMap);
    }

    function pickNewTarget() {
        const lowestShips = getLowestShips();
        if (lowestShips.length === 0) return;

        const targetShip = lowestShips[Math.floor(Math.random() * lowestShips.length)];
        const matchedVocab = vocabList.find(v => v.def === targetShip.def);
        
        if (matchedVocab) {
            currentTarget = matchedVocab;
        } else {
            currentTarget = vocabList[Math.floor(Math.random() * vocabList.length)];
            targetShip.def = currentTarget.def;
        }

        targetWordDisplay.textContent = currentTarget.word;
    }

    function initShips() {
        ships = [];
        const paddingX = 30;
        const paddingY = 25;
        const shipWidth = 215; // Scaled for wider layout
        const shipHeight = 65;
        const startX = 40;
        const startY = 50;

        let availableDefs = vocabList.map(v => v.def);

        for (let row = 0; row < GRID_ROWS; row++) {
            for (let col = 0; col < GRID_COLS; col++) {
                const randomDefIndex = Math.floor(Math.random() * availableDefs.length);
                const assignedDef = availableDefs[randomDefIndex] || vocabList[0].def;

                ships.push({
                    x: startX + col * (shipWidth + paddingX),
                    y: startY + row * (shipHeight + paddingY),
                    width: shipWidth,
                    height: shipHeight,
                    def: assignedDef,
                    color: SHIP_COLORS[(row * GRID_COLS + col) % SHIP_COLORS.length],
                    gridCol: col,
                    gridRow: row
                });
            }
        }
        pickNewTarget();
    }

    function respawnShip(ship) {
        let minY = ship.y;
        ships.forEach(s => {
            if (s !== ship && s.gridCol === ship.gridCol) {
                if (s.y < minY) minY = s.y;
            }
        });

        ship.y = minY - (ship.height + 25);
        const otherDefs = vocabList.filter(v => v.def !== currentTarget.def).map(v => v.def);
        ship.def = otherDefs[Math.floor(Math.random() * otherDefs.length)];
    }

    function update() {
        if (isGameOver) return;

        if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 0) {
            player.x -= player.speed;
        }
        if ((keys['ArrowRight'] || keys['KeyD']) && player.x + player.width < canvas.width) {
            player.x += player.speed;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y -= bullets[i].speed;
            if (bullets[i].y < 0) {
                bullets.splice(i, 1);
            }
        }

        if (ammo === 0 && bullets.length === 0) {
            triggerGameOver();
            return;
        }

        let minX = Infinity;
        let maxX = -Infinity;
        ships.forEach(ship => {
            if (ship.x < minX) minX = ship.x;
            if (ship.x + ship.width > maxX) maxX = ship.x + ship.width;
        });

        if (maxX >= canvas.width - 25 && horizontalDirection > 0) {
            horizontalDirection = -1;
        } else if (minX <= 25 && horizontalDirection < 0) {
            horizontalDirection = 1;
        }

        speedMultiplier += 0.00005;
        const currentSpeed = baseSpeed * speedMultiplier;

        ships.forEach(ship => {
            ship.y += currentSpeed;
            ship.x += horizontalDirection * horizontalSpeed;

            if (ship.y + ship.height >= player.y) {
                triggerGameOver();
            }
        });

        for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
            const b = bullets[bIndex];
            
            for (let sIndex = 0; sIndex < ships.length; sIndex++) {
                const s = ships[sIndex];

                if (
                    b.x < s.x + s.width &&
                    b.x + b.width > s.x &&
                    b.y < s.y + s.height &&
                    b.y + b.height > s.y
                ) {
                    bullets.splice(bIndex, 1);

                    if (s.def === currentTarget.def) {
                        ships.splice(sIndex, 1);
                        score += 100;
                        scoreDisplay.textContent = score;

                        if (ships.length === 0) {
                            initShips();
                        } else {
                            pickNewTarget();
                        }
                    } else {
                        score = Math.max(0, score - 50);
                        scoreDisplay.textContent = score;
                        respawnShip(s);

                        const lowest = getLowestShips();
                        if (!lowest.some(ship => ship.def === currentTarget.def)) {
                            pickNewTarget();
                        }
                    }
                    break;
                }
            }
        }
    }

    function drawPlayer() {
        ctx.fillStyle = player.color;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.lineTo(player.x + player.width * 0.75, player.y + player.height - 8);
        ctx.lineTo(player.x + player.width / 2, player.y + player.height + 4);
        ctx.lineTo(player.x + player.width * 0.25, player.y + player.height - 8);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
    }

    /* Render retro spaceship graphics */
    function drawShips() {
        ships.forEach(ship => {
            const w = ship.width;
            const h = ship.height;
            const x = ship.x;
            const y = ship.y;

            ctx.save();
            ctx.translate(x, y);

            // Alien Spaceship Hull Outline
            ctx.fillStyle = ship.color;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(w * 0.2, 0);                 // Upper Left Nose
            ctx.lineTo(w * 0.8, 0);                 // Upper Right Nose
            ctx.lineTo(w, h * 0.3);                 // Outer Right Wing
            ctx.lineTo(w * 0.92, h * 0.75);         // Lower Right Wing
            ctx.lineTo(w * 0.82, h);                // Right Engine Mount
            ctx.lineTo(w * 0.18, h);                // Left Engine Mount
            ctx.lineTo(w * 0.08, h * 0.75);         // Lower Left Wing
            ctx.lineTo(0, h * 0.3);                 // Outer Left Wing
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Cockpit Window Area
            ctx.fillStyle = 'rgba(5, 5, 16, 0.75)';
            ctx.fillRect(w * 0.08, h * 0.15, w * 0.84, h * 0.7);
            ctx.strokeStyle = ship.color;
            ctx.strokeRect(w * 0.08, h * 0.15, w * 0.84, h * 0.7);

            // Centered Definition Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(ship.def, w / 2, h / 2, w * 0.8);

            ctx.restore();
        });
    }

    function drawBullets() {
        ctx.shadowColor = '#ff00ff';
        ctx.shadowBlur = 8;
        bullets.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, b.y, b.width, b.height);
        });
        ctx.shadowBlur = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawPlayer();
        drawShips();
        drawBullets();
    }

    function gameLoop() {
        update();
        draw();
        if (!isGameOver) {
            requestAnimationFrame(gameLoop);
        }
    }

    function triggerGameOver() {
        isGameOver = true;
        finalScoreDisplay.textContent = score;
        gameOverScreen.classList.remove('hidden');
    }

    function resetGame() {
        score = 0;
        ammo = MAX_AMMO;
        speedMultiplier = 1;
        isGameOver = false;
        scoreDisplay.textContent = score;
        ammoDisplay.textContent = ammo;
        gameOverScreen.classList.add('hidden');
        bullets = [];
        player.x = canvas.width / 2 - 30;
        initShips();
        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        initShips();
        requestAnimationFrame(gameLoop);
    }

    // Initialize Vocabulary Engine
    initVocab();
</script>

</body>
</html>
