<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlastWord - Vocabulary Arcade</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            background: #050510;
            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           GAME CONTAINER
        ===================================================== */

        #game-container {

            position: relative;

            width: min(
                1300px,
                100vw
            );

            height: min(
                800px,
                100vh
            );

            background:
                radial-gradient(
                    circle at center,
                    #101030 0%,
                    #050510 100%
                );

            border:
                3px solid #00ffff;

            box-shadow:
                0 0 30px
                rgba(
                    0,
                    255,
                    255,
                    0.4
                );

            overflow: hidden;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        #gameCanvas {

            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;
        }


        /* =====================================================
           LIST NAME
        ===================================================== */

        #list-name-display {

            position: absolute;

            top: 12px;
            left: 50%;

            transform:
                translateX(-50%);

            max-width: 60%;

            padding:
                7px 16px;

            border-radius:
                999px;

            background:
                rgba(
                    5,
                    5,
                    16,
                    0.72
                );

            border:
                1px solid
                rgba(
                    0,
                    255,
                    255,
                    0.25
                );

            color:
                #c7d2fe;

            font-size:
                14px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            z-index:
                8;

            pointer-events:
                none;
        }


        /* =====================================================
           SOUND BUTTON
        ===================================================== */

        #sound-button {

            position: absolute;

            top: 12px;
            right: 14px;

            width: 42px;
            height: 42px;

            border: 1px solid
                rgba(
                    0,
                    255,
                    255,
                    0.35
                );

            border-radius: 8px;

            background:
                rgba(
                    5,
                    5,
                    16,
                    0.82
                );

            color: white;

            font-size: 20px;

            cursor: pointer;

            z-index: 40;

            transition:
                transform .12s ease,
                background .12s ease;
        }


        #sound-button:hover {

            transform:
                scale(1.06);

            background:
                rgba(
                    0,
                    255,
                    255,
                    0.16
                );
        }


        /* =====================================================
           TARGET / HUD BAR
        ===================================================== */

        #target-bar {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 88px;

            background:
                rgba(
                    10,
                    15,
                    30,
                    0.97
                );

            border-top:
                2px solid #00ffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                8px 25px;

            z-index:
                10;

            pointer-events:
                none;
        }


        #target-area {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            min-width:
                0;
        }


        .prompt-label {

            font-size:
                14px;

            color:
                #8888aa;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            white-space:
                nowrap;
        }


        .target-word {

            font-size:
                clamp(
                    23px,
                    3vw,
                    36px
                );

            font-weight:
                900;

            color:
                #00ffff;

            text-shadow:
                0 0 14px
                rgba(
                    0,
                    255,
                    255,
                    0.8
                );

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats-container {

            display:
                flex;

            align-items:
                center;

            justify-content:
                flex-end;

            gap:
                10px;

            flex-wrap:
                wrap;
        }


        .stat {

            min-width:
                72px;

            text-align:
                center;
        }


        .stat-label {

            display:
                block;

            font-size:
                9px;

            color:
                #777799;

            text-transform:
                uppercase;

            letter-spacing:
                .7px;
        }


        .stat-value {

            display:
                block;

            margin-top:
                2px;

            font-size:
                19px;

            font-weight:
                900;
        }


        #score-display {
            color:
                #ff00ff;
        }


        #ammo-display {
            color:
                #00ffcc;
        }


        #shields-display {
            color:
                #ff6688;
        }


        #wave-display {
            color:
                #ffd166;
        }


        #accuracy-display {
            color:
                #8be9fd;
        }


        #words-display {
            color:
                #a7f3d0;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message-display {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                )

            padding:
                13px 28px;

            border-radius:
                999px;

            background:
                rgba(
                    0,
                    255,
                    255,
                    .92
                );

            color:
                #050510;

            font-size:
                25px;

            font-weight:
                900;

            opacity:
                0;

            pointer-events:
                none;

            z-index:
                30;

            transition:
                opacity .18s ease,
                transform .18s ease;
        }


        #message-display.show {

            opacity:
                1;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(1);
        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        #loading-screen {

            position:
                absolute;

            inset:
                0;

            background:
                rgba(
                    5,
                    5,
                    16,
                    .97
                );

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            text-align:
                center;

            padding:
                30px;

            gap:
                15px;

            z-index:
                100;
        }


        #loading-screen.hidden {
            display:
                none;
        }


        #loading-title {

            font-size:
                36px;

            font-weight:
                900;

            color:
                #00ffff;
        }


        #loading-text {

            font-size:
                18px;

            color:

            line-height:

        }


        #loading-details {

            font-size:

            color:

            line-height:

                    5,

                center;

            align-items:

            text-align:

        }

                18px;

            margin-bottom:

        ===================================================== */

        #results-grid {

            display:

                    1fr

            margin-bottom:

                    255,
                    255,

                height:
                    36px;

                font-size:
                    17px;
            }

        }

    </style>

</head>

/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i =
            copy.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];
    }


    return copy;
}


/* =========================================================
   LOAD FIREBASE SET
========================================================= */

async function loadVocabularySet(
    id
) {

    if (!id) {

        throw new Error(
            "No vocabulary set ID was provided. Open BlastWord from the Vocabulary Arcade Library."
        );
    }


    const reference =
        doc(
            db,
            "vocabSets",
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found in Firebase."
        );
    }


    const data =
        snapshot.data();


    let items =
        [];


    /*
     * CURRENT FORMAT
     */

    if (
        Array.isArray(
            data.items
        )
    ) {

        items =
            data.items;
    }


    /*
     * LEGACY ARRAY
     */

    else if (
        Array.isArray(
            data.terms
        )
    ) {

        items =
            data.terms;
    }


    /*
     * LEGACY JSON STRING
     */

    else if (
        typeof data.terms ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    data.terms
                );

        }
        catch {

            throw new Error(
                "The legacy vocabulary data could not be parsed."
            );
        }
    }


    /*
     * Normalize vocabulary.
     */

    const vocabulary =
        items

            .filter(
                item =>
                    item &&
                    item.word &&
                    (
                        item.definition ||
                        item.meaning
                    )
            )

            .map(
                item => ({

                    word:
                        String(
                            item.word
                        ).trim(),

                    definition:
                        String(
                            item.definition ||
                            item.meaning ||
                            ""
                        ).trim()

                })
            )

            .filter(
                item =>
                    item.word &&
                    item.definition
            );


    return {

        title:
            data.title ||
            "Vocabulary Set",

        language:
            data.language ||
            "",

        items:
            vocabulary
    };
}


/* =========================================================
   VALIDATE VOCABULARY
========================================================= */

function validateVocabulary(
    items
) {

    if (
        !Array.isArray(items)
    ) {

        throw new Error(
            "The vocabulary data is not an array."
        );
    }


    if (
        items.length <
        SHIPS_PER_LEVEL
    ) {

        throw new Error(
            `BlastWord requires at least ${SHIPS_PER_LEVEL} vocabulary items. This list contains ${items.length}.`
        );
    }


    /*
     * Duplicate words.
     */

    const wordMap =
        new Map();


    const duplicateWords =
        [];


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.word
                );


            if (
                wordMap.has(key)
            ) {

                duplicateWords.push(
                    item.word
                );

            } else {

                wordMap.set(
                    key,
                    true
                );
            }
        }
    );


    if (
        duplicateWords.length
        > 0
    ) {

        const unique =
            [
                ...new Set(
                    duplicateWords
                )
            ];


        throw new Error(
            "Duplicate vocabulary words found: " +
            unique.join(
                ", "
            )
        );
    }


    /*
     * Duplicate definitions are
     * prohibited because each definition
     * must identify one vocabulary word.
     */

    const definitionMap =
        new Map();


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.definition
                );


            if (
                !definitionMap.has(
                    key
                )
            ) {

                definitionMap.set(
                    key,
                    []
                );
            }


            definitionMap
                .get(key)
                .push(
                    item.word
                );
        }
    );


    const duplicateDefinitions =
        [
            ...definitionMap.entries()
        ]
            .filter(
                ([key, words]) =>
                    words.length > 1
            );


    if (
        duplicateDefinitions.length
        > 0
    ) {

        const details =
            duplicateDefinitions
                .map(
                    (
                        [definition, words]
                    ) =>
                        `"${definition}" → ${words.join(", ")}`
                )
                .join(
                    " | "
                );


        throw new Error(
            "Duplicate answers were found. Each definition must belong to only one vocabulary word. " +
            details
        );
    }


    if (
        definitionMap.size <
        5
    ) {

        throw new Error(
            "BlastWord requires at least five different answers."
        );
    }


    return true;
}

/* =========================================================
   SAFE SOUND SYSTEM

   Sound must never be allowed to stop the game.
   If sound.js is unavailable, BlastWord continues silently.
========================================================= */

function playSound(name, ...args) {

    try {

        const soundSystem =
            window.SoundFX;

        if (
            soundSystem &&
            typeof soundSystem[name] ===
                "function"
        ) {

            soundSystem[name](...args);
        }

    }
    catch (error) {

        console.warn(
            "BlastWord sound error:",
            error
        );
    }
}

   SOUND BUTTON
========================================================= */

function updateSoundButton() {

    if (!soundButton) {
        return;
    }


    const soundSystem =
        window.SoundFX;


    if (
        !soundSystem ||
        typeof soundSystem.isMuted !==
            "function"
    ) {

        soundButton.setAttribute(
            "aria-label",
            "Sound system unavailable"

        soundButton.setAttribute(

        );

        return;
    }

    soundButton.textContent =
        muted
            ? "🔇"
            : "🔊";


    soundButton.setAttribute(
        "aria-label",
        muted
            ? "Turn game sounds on"
            : "Mute game sounds"
    );


    soundButton.setAttribute(
        "title",
        muted
            ? "Turn game sounds on"
            : "Mute game sounds"
    );
}

/* =========================================================
   SET LEVEL DIFFICULTY
========================================================= */

function applyLevelSettings() {

    horizontalSpeed =
        BASE_HORIZONTAL_SPEED +
        (
            wave - 1
        ) *
        0.45;


    downwardSpeed =
        BASE_DOWNWARD_SPEED +
        (
            wave - 1
        ) *
        0.018;
}


/* =========================================================
   GET CURRENT DIVE CHANCE
========================================================= */

function getDiveChance() {

    return Math.min(
        0.012,
        BASE_DIVE_CHANCE +
        (
            wave - 1
        ) *
        DIVE_CHANCE_INCREMENT
    );
}


/* =========================================================
   GET CURRENT DIVE COOLDOWN
========================================================= */

function getDiveCooldown() {

    return Math.max(
        MIN_DIVE_COOLDOWN,
        BASE_DIVE_COOLDOWN -
        (
            wave - 1
        ) *
        350
    );
}


/* =========================================================
   GET LOWEST NORMAL SHIP
   IN EACH COLUMN
========================================================= */

function getLowestShipInEachColumn() {

    const lowestByColumn =
        [];


    /*
     * Examine every column independently.
     *
     * A diving ship is deliberately ignored.
     */

    for (
        let column = 0;
        column < GRID_COLS;
        column++
    ) {

        const columnShips =
            ships.filter(
                ship =>
                    !ship.diving &&
                    ship.gridCol ===
                        column
            );


        if (
            columnShips.length === 0
        ) {

            continue;
        }


        const lowest =
            columnShips.reduce(
                (
                    currentLowest,
                    ship
                ) => {

                    if (
                        !currentLowest
                    ) {

                        return ship;
                    }


                    return
                        (
                            ship.y +
                            ship.height
                        )
                        >
                        (
                            currentLowest.y +
                            currentLowest.height
                        )
                            ? ship
                            : currentLowest;

                },
                null
            );


        if (lowest) {

            lowestByColumn.push(
                lowest
            );
        }
    }


    return lowestByColumn;
}


/* =========================================================
   CHECK WHETHER CURRENT TARGET
   IS STILL ACCESSIBLE
========================================================= */

function isCurrentTargetReachable() {

    if (
        !currentTarget ||
        !currentTargetShip
    ) {

        return false;
    }


    if (
        currentTargetShip.diving
    ) {

        return false;
    }


    if (
        !ships.includes(
            currentTargetShip
        )
    ) {

        return false;
    }


    const lowestShips =
        getLowestShipInEachColumn();


    return lowestShips.includes(
        currentTargetShip
    );
}


/* =========================================================
   SELECT A NEW REACHABLE TARGET
========================================================= */

function setNewReachableTarget() {

    const lowestShips =
        getLowestShipInEachColumn();


    if (
        lowestShips.length === 0
    ) {

        currentTarget =
            null;

        currentTargetShip =
            null;

        targetWordDisplay.textContent =
            "---";

        return;
    }


    /*
     * Keep the current target as long as
     * its ship is still the lowest ship
     * in its column.
     */

    if (
        isCurrentTargetReachable()
    ) {

        return;
    }


    /*
     * Select only from the ships that are
     * actually exposed at the bottom of
     * their columns.
     */

    const selectedShip =
        lowestShips[
            Math.floor(
                Math.random() *
                lowestShips.length
            )
        ];


    /*
     * Each ship carries its own vocabulary
     * word and definition. Using ship.word
     * here avoids a second lookup that can
     * accidentally produce an unreachable
     * target.
     */

    let targetWord =
        selectedShip.word ||
        "";


    if (!targetWord) {

        const matchingVocabulary =
            vocabList.find(
                item =>
                    normalizeText(
                        item.definition
                    ) ===
                    normalizeText(
                        selectedShip.def
                    )
            );


        if (matchingVocabulary) {

            targetWord =
                matchingVocabulary.word;
        }
    }


    if (!targetWord) {

        console.error(
            "BLASTWORD: Ship has no matching vocabulary word.",
            selectedShip
        );

        currentTarget =
            null;

        currentTargetShip =
            null;

        targetWordDisplay.textContent =
            "---";

        return;
    }


    currentTarget = {
        word: targetWord,
        definition: selectedShip.def
    };


    currentTargetShip =
        selectedShip;


    targetWordDisplay.textContent =
        targetWord;


    updateHUD();
}


/* =========================================================
   FIND A DEFINITION NOT CURRENTLY USED
   ========================================================== */

function getUnusedDefinitionForBoard() {

    const used =
        new Set(
            ships.map(
                ship =>
                    normalizeText(
                        ship.def
                    )
            )
        );


    const available =
        vocabList.filter(
            item =>
                !used.has(
                    normalizeText(
                        item.definition
                    )
                )
        );


    /*
     * If every definition is currently
     * used, any vocabulary entry is valid.
     */

    const source =
        available.length > 0
            ? available
            : vocabList;


    return source[
        Math.floor(
            Math.random() *
            source.length
        )
    ];
}


/* =========================================================
   CREATE NEW LEVEL / BOARD
========================================================= */

function createBoard() {

    ships =
        [];


    bullets =
        [];


    horizontalDirection =
        1;


    applyLevelSettings();


    /*
     * Take 20 vocabulary items for this board.
     *
     * They are shuffled so every new level
     * has a fresh arrangement.
     */

    const selectedVocabulary =
        shuffle(
            vocabList
        ).slice(
            0,
            SHIPS_PER_LEVEL
        );


    const shipWidth =
        220;


    const shipHeight =
        68;


    const horizontalGap =
        18;


    const verticalGap =
        22;


    const totalWidth =
        (
            GRID_COLS *
            shipWidth
        )
        +
        (
            (
                GRID_COLS -
                1
            ) *
            horizontalGap
        );


    const startX =
        (
            CANVAS_WIDTH -
            totalWidth
        )
        /
        2;


    const startY =
        65;


    for (
        let row = 0;
        row < GRID_ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < GRID_COLS;
            col++
        ) {

            const item =
                selectedVocabulary[
                    row *
                    GRID_COLS +
                    col
                ];


            ships.push({

                x:
                    startX +
                    col *
                    (
                        shipWidth +
                        horizontalGap
                    ),

                y:
                    startY +
                    row *
                    (
                        shipHeight +
                        verticalGap
                    ),

                width:
                    shipWidth,

                height:
                    shipHeight,

                def:
                    item.definition,

                word:
                    item.word,

                color:
                    SHIP_COLORS[
                        (
                            row *
                            GRID_COLS +
                            col
                        )
                        %
                        SHIP_COLORS.length
                    ],

                gridCol:
                    col,

                gridRow:
                    row,

                diving:
                    false,

                diveTargetX:
                    null,

                diveTargetY:
                    null
            });
        }
    }


    currentTarget =
        null;


    currentTargetShip =
        null;


    /*
     * CRITICAL:
     * The first target is guaranteed to
     * come from the lowest ship in one
     * of the five columns.
     */

    setNewReachableTarget();


    updateHUD();
}

/* =========================================================
   FIRE
========================================================= */

function fireBullet() {

    if (
        isGameOver ||
        ammo <= 0
    ) {

        if (
            ammo <= 0
        ) {

            playSound("incorrect");
        }


        return;
    }


    ammo--;


    totalShots++;


    /*
     * Every shot gets the shared
     * BlastWord laser sound.
     */

    playSound("laser");


    bullets.push({

        x:
            player.x -
            4,

        y:
            player.y -
            5,

        width:
            8,

        height:
            21,

        speed:
            14,

        color:
            "#ff00ff"
    });


    updateHUD();


    checkAmmoGameOver();
}


/* =========================================================
   AMMO CHECK
========================================================= */

function checkAmmoGameOver() {

    if (
        ammo <= 0 &&
        bullets.length === 0 &&
        !isGameOver
    ) {

        triggerGameOver(
            "You ran out of ammunition!"
        );
    }
}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer() {

    if (
        keys["ArrowLeft"] ||
        keys["KeyA"]
    ) {

        player.x -=
            player.speed;
    }


    if (
        keys["ArrowRight"] ||
        keys["KeyD"]
    ) {

        player.x +=
            player.speed;
    }


    const half =
        player.width /
        2;


    player.x =
        Math.max(
            half,

            Math.min(
                CANVAS_WIDTH -
                half,

                player.x
            )
        );
}


/* =========================================================
   UPDATE BULLETS
========================================================= */

function updateBullets() {

    for (
        let i =
            bullets.length - 1;

        i >= 0;

        i--
    ) {

        bullets[i].y -=
            bullets[i].speed;


        if (
            bullets[i].y +
            bullets[i].height <
            0
        ) {

            bullets.splice(
                i,
                1
            );
        }
    }


    checkAmmoGameOver();
}


/* =========================================================
   START DIVING SHIP
========================================================= */

function tryStartDive() {

    const now =
        Date.now();


    if (
        now -
        lastDiveTime <
        getDiveCooldown()
    ) {

        return;
    }


    if (
        Math.random() >
        getDiveChance()
    ) {

        return;
    }


    /*
     * Only top-row ships may attack.
     */

    const topRowShips =
        ships.filter(
            ship =>
                !ship.diving &&
                ship.gridRow === 0
        );


    if (
        topRowShips.length === 0
    ) {

        return;
    }


    const ship =
        topRowShips[
            Math.floor(
                Math.random() *
                topRowShips.length
            )
        ];


    /*
     * If this ship happens to be
     * the current target, immediately
     * choose another accessible target.
     */

    if (
        ship === currentTargetShip
    ) {

        /*
         * Temporarily mark it as diving
         * so the target logic cannot keep it.
         */

        ship.diving =
            true;


        setNewReachableTarget();


        ship.diving =
            false;
    }


    ship.diving =
        true;


    ship.diveTargetX =
        player.x;


    ship.diveTargetY =
        player.y;


    lastDiveTime =
        now;


    showMessage(
        "INCOMING!",
        false
    );
}


/* =========================================================
   UPDATE SHIPS
========================================================= */

function updateShips() {

    if (
        !levelTransitioning
    ) {

        tryStartDive();
    }


    /*
     * Find horizontal boundaries of
     * normal formation ships only.
     */

    let left =
        Infinity;


    let right =
        -Infinity;


    ships
        .filter(
            ship =>
                !ship.diving
        )
        .forEach(
            ship => {

                left =
                    Math.min(
                        left,
                        ship.x
                    );


                right =
                    Math.max(
                        right,
                        ship.x +
                        ship.width
                    );
            }
        );


    /*
     * Reverse formation direction.
     */

    if (
        right >=
        CANVAS_WIDTH -
        15
        &&
        horizontalDirection >
        0
    ) {

        horizontalDirection =
            -1;

    }
    else if (
        left <= 15
        &&
        horizontalDirection <
        0
    ) {

        horizontalDirection =
            1;
    }


    /*
     * Move each ship.
     */

    ships.forEach(
        ship => {

            /*
             * DIVING SHIP
             */

            if (
                ship.diving
            ) {

                updateDivingShip(
                    ship
                );

                return;
            }


            /*
             * NORMAL FORMATION
             */

            ship.x +=
                horizontalDirection *
                horizontalSpeed;


            ship.y +=
                downwardSpeed;


            const dangerLine =
                player.y -
                10;


            if (
                ship.y +
                ship.height >=
                dangerLine
            ) {

                triggerGameOver(
                    "The alien fleet reached your ship!"
                );
            }
        }
    );
}


/* =========================================================
   UPDATE DIVING SHIP
========================================================= */

function updateDivingShip(
    ship
) {

    const centerX =
        ship.x +
        ship.width /
        2;


    const centerY =
        ship.y +
        ship.height /
        2;


    const dx =
        player.x -
        centerX;


    const dy =
        player.y -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > 0
    ) {

        /*
         * Continue steering toward
         * the player's current position.
         */

        const directionX =
            dx /
            distance;


        const directionY =
            dy /
            distance;


        ship.x +=
            directionX *
            DIVE_SPEED;


        ship.y +=
            directionY *
            DIVE_SPEED;
    }


    /*
     * Player collision box.
     */

    const playerBox = {

        x:
            player.x -
            player.width /
            2,

        y:
            player.y -
            player.height,

        width:
            player.width,

        height:
            player.height
    };


    if (
        rectanglesOverlap(
            ship,
            playerBox
        )
    ) {

        /*
         * A diving ship hitting the
         * player DOES cost a shield.
         */

        shields--;


        playSound("damage");

        playSound("shield");


        ship.diving =
            false;


        respawnShipAtTop(
            ship
        );


        showMessage(
            "SHIELD HIT!",
            false
        );


        updateHUD();


        if (
            shields <= 0
        ) {

            triggerGameOver(
                "Your shields were depleted!"
            );
        }


        /*
         * Check the bottom-five target
         * logic after the ship's state changes.
         */

        setNewReachableTarget();
    }


    /*
     * A diving ship that leaves the
     * visible area returns to the top.
     */

    if (
        ship.y >
        CANVAS_HEIGHT + 50
    ) {

        respawnShipAtTop(
            ship
        );


        setNewReachableTarget();
    }
}


/* =========================================================
   RECTANGLE COLLISION
========================================================= */

function rectanglesOverlap(
    a,
    b
) {

    return (

        a.x <
            b.x +
            b.width

        &&

        a.x +
            a.width >
            b.x

        &&

        a.y <
            b.y +
            b.height

        &&

        a.y +
            a.height >
            b.y
    );
}


/* =========================================================
   BULLET / SHIP COLLISIONS
========================================================= */

function handleCollisions() {

    for (
        let bIndex =
            bullets.length - 1;

        bIndex >= 0;

        bIndex--
    ) {

        const bullet =
            bullets[bIndex];


        for (
            let sIndex =
                ships.length - 1;

            sIndex >= 0;

            sIndex--
        ) {

            const ship =
                ships[sIndex];


            if (
                rectanglesOverlap(
                    bullet,
                    ship
                )
            ) {

                bullets.splice(
                    bIndex,
                    1
                );


                /*
                 * Diving ships are handled
                 * separately and NEVER cost
                 * a shield when shot.
                 */

                if (
                    ship.diving
                ) {

                    handleDivingShipHit(
                        ship
                    );

                }

                else {

                    handleNormalShipHit(
                        ship
                    );
                }


                break;
            }
        }
    }
}


/* =========================================================
   DIVING SHIP HIT
========================================================= */

function handleDivingShipHit(
    ship
) {

    const index =
        ships.indexOf(
            ship
        );


    if (
        index >= 0
    ) {

        ships.splice(
            index,
            1
        );
    }


    /*
     * IMPORTANT:
     *
     * Destroying a diving ship NEVER
     * removes a shield.
     *
     * If its definition happens to
     * equal the current target, it
     * counts as a correct hit.
     */

    const isCorrect =
        currentTarget &&
        normalizeText(
            ship.def
        ) ===
        normalizeText(
            currentTarget.definition
        );


    playSound("explosion");


    if (
        isCorrect
    ) {

        correctAnswers++;


        streak++;


        bestStreak =
            Math.max(
                bestStreak,
                streak
            );


        const points =
            getCorrectPoints(
                true
            );


        score +=
            points;


        ammo =
            Math.min(
                MAX_AMMO,
                ammo +
                CORRECT_AMMO_BONUS
            );


        playSound("correct");


        playSound("coin");


        if (
            streak >= 3
        ) {

            playSound("streak");
        }


        showMessage(
            `✓ DIVE HIT! +${points}`,
            true
        );

    }
    else {

        streak =
            0;


        score =
            Math.max(
                0,
                score -
                25
            );


        playSound("incorrect");


        showMessage(
            "DIVE SHIP DESTROYED!",
            true
        );
    }


    updateHUD();


    /*
     * Every destroyed ship triggers a
     * target-accessibility check.
     */

    setNewReachableTarget();


    /*
     * If there are somehow no normal
     * ships remaining, move forward.
     */

    checkForLevelClear();
}


/* =========================================================
   NORMAL SHIP HIT
========================================================= */

function handleNormalShipHit(
    ship
) {

    const correct =
        currentTarget &&
        normalizeText(
            ship.def
        ) ===
        normalizeText(
            currentTarget.definition
        );


    if (
        correct
    ) {

        handleCorrectNormalHit(
            ship
        );

    }
    else {

        handleWrongNormalHit(
            ship
        );
    }
}


/* =========================================================
   CORRECT NORMAL HIT
========================================================= */

function handleCorrectNormalHit(
    ship
) {

    correctAnswers++;


    streak++;


    bestStreak =
        Math.max(
            bestStreak,
            streak
        );


    const points =
        getCorrectPoints(
            false
        );


    score +=
        points;


    ammo =
        Math.min(
            MAX_AMMO,
            ammo +
            CORRECT_AMMO_BONUS
        );


    /*
     * Correct normal ship is destroyed.
     * It does NOT respawn.
     *
     * This is what finally allows the
     * formation to clear and the next
     * level to begin.
     */

    const index =
        ships.indexOf(
            ship
        );


    if (
        index >= 0
    ) {

        ships.splice(
            index,
            1
        );
    }


    playSound("explosion");


    playSound("correct");


    playSound("coin");


    if (
        streak >= 3
    ) {

        playSound("streak");
    }


    showMessage(
        `✓ HIT! +${points}`,
        true
    );


    updateHUD();


    /*
     * CRITICAL TARGET CHECK:
     *
     * The ship has just disappeared.
     * Recalculate the lowest ship in
     * every column before choosing the
     * next target.
     */

    setNewReachableTarget();


    /*
     * Check for formation clear.
     */

    checkForLevelClear();
}


/* =========================================================
   WRONG NORMAL HIT
========================================================= */

function handleWrongNormalHit(
    ship
) {

    /*
     * Wrong normal shots cost one shield.
     */

    shields--;


    streak =
        0;


    score =
        Math.max(
            0,
            score -
            50
        );


    playSound("incorrect");


    playSound("shield");


    /*
     * The wrong ship is sent back to
     * the top of its original column.
     */

    respawnShipAtTop(
        ship
    );


    showMessage(
        "✗ WRONG! -50",
        false
    );


    updateHUD();


    /*
     * CRITICAL:
     *
     * The wrong ship now has a new
     * definition and possibly a new
     * vertical position.
     *
     * Recalculate the bottom-five
     * target candidates immediately.
     */

    setNewReachableTarget();


    if (
        shields <= 0
    ) {

        triggerGameOver(
            "Your shields were depleted!"
        );
    }
}


/* =========================================================
   POINTS
========================================================= */

function getCorrectPoints(
    diving
) {

    /*
     * Points increase every level.
     *
     * Normal hit:
     * 100 on Level 1
     *
     * Dive hit:
     * 150 on Level 1
     *
     * Each level adds 50 points.
     */

    const levelBonus =
        (
            wave - 1
        ) *
        50;


    const base =
        diving
            ? 150
            : 100;


    const streakBonus =
        (
            streak - 1
        ) *
        25;


    return (
        base +
        levelBonus +
        streakBonus
    );
}


/* =========================================================
   RESPAWN SHIP AT TOP
========================================================= */

function respawnShipAtTop(
    ship
) {

    const highestInColumn =
        ships
            .filter(
                other =>
                    other !== ship &&
                    !other.diving &&
                    other.gridCol ===
                        ship.gridCol
            )
            .reduce(
                (
                    highest,
                    other
                ) =>
                    Math.min(
                        highest,
                        other.y
                    ),
                65
            );


    /*
     * Keep the ship in its original
     * column rather than moving it to
     * a random column.
     */

    const columnWidth =
        220 +
        18;


    const totalFormationWidth =
        (
            GRID_COLS *
            220
        )
        +
        (
            (
                GRID_COLS -
                1
            ) *
            18
        );


    const formationStartX =
        (
            CANVAS_WIDTH -
            totalFormationWidth
        )
        /
        2;


    ship.x =
        formationStartX +
        ship.gridCol *
        columnWidth;


    ship.y =
        highestInColumn -
        95;


    ship.diving =
        false;


    ship.gridRow =
        0;


    const replacement =
        vocabList[
            Math.floor(
                Math.random() *
                vocabList.length
            )
        ];


    ship.def =
        replacement.definition;


    ship.word =
        replacement.word;


    ship.color =
        SHIP_COLORS[
            Math.floor(
                Math.random() *
                SHIP_COLORS.length
            )
        ];
}


/* =========================================================
   RANDOM DEFINITION
========================================================= */

function getRandomDefinition() {

    if (
        vocabList.length === 0
    ) {

        return "";
    }


    return vocabList[
        Math.floor(
            Math.random() *
            vocabList.length
        )
    ].definition;
}


/* =========================================================
   CHECK LEVEL CLEAR
========================================================= */

function checkForLevelClear() {

    if (
        levelTransitioning ||
        isGameOver
    ) {

        return;
    }


    /*
     * Only normal ships count toward
     * clearing the formation.
     */

    const normalShipsRemaining =
        ships.filter(
            ship =>
                !ship.diving
        );


    if (
        normalShipsRemaining.length >
        0
    ) {

        return;
    }


    /*
     * Wait until active diving ships
     * are also gone.
     *
     * This creates a complete clear
     * before the next board appears.
     */

    if (
        ships.some(
            ship =>
                ship.diving
        )
    ) {

        return;
    }


    beginNextLevel();
}


/* =========================================================
   NEXT LEVEL
========================================================= */

function beginNextLevel() {

    if (
        levelTransitioning ||
        isGameOver
    ) {

        return;
    }


    levelTransitioning =
        true;


    /*
     * Level-clear reward.
     */

    const levelBonus =
        250 *
        wave;


    score +=
        levelBonus;


    /*
     * Give the player additional ammo
     * for progressing.
     */

    ammo =
        Math.min(
            MAX_AMMO,
            ammo +
            5
        );


    playSound("coin");


    playSound("levelUp");


    showMessage(
        `LEVEL ${wave + 1}! +${levelBonus}`,
        true
    );


    wave++;


    updateHUD();


    /*
     * Give the transition a brief visual
     * pause so the player can register
     * the level change.
     */

    setTimeout(
        () => {

            if (
                isGameOver
            ) {

                return;
            }


            bullets =
                [];


            ships =
                [];


            currentTarget =
                null;


            currentTargetShip =
                null;


            horizontalDirection =
                1;


            lastDiveTime =
                0;


            createBoard();


            levelTransitioning =
                false;


            updateHUD();

        },
        900
    );
}


/* =========================================================
   UPDATE HUD
========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        score;


    ammoDisplay.textContent =
        ammo;


    waveDisplay.textContent =
        wave;


    wordsDisplay.textContent =
        correctAnswers;


    const accuracy =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                )
                *
                100
            )

            : 100;


    accuracyDisplay.textContent =
        `${accuracy}%`;


    /*
     * FOUR-SHIELD DISPLAY
     */

    let hearts =
        "";


    for (
        let i = 0;
        i < MAX_SHIELDS;
        i++
    ) {

        hearts +=
            i < shields
                ? "♥ "
                : "♡ ";
    }


    shieldsDisplay.textContent =
        hearts.trim();
}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    message,
    success
) {

    messageDisplay.textContent =
        message;


    messageDisplay.style.background =
        success
            ? "rgba(34,197,94,.95)"
            : "rgba(239,68,68,.95)";


    messageDisplay.style.color =
        "#ffffff";


    messageDisplay.classList.remove(
        "show"
    );


    void messageDisplay.offsetWidth;


    messageDisplay.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                messageDisplay.classList.remove(
                    "show"
                );


                messageDisplay.style.background =
                    "rgba(0,255,255,.92)";


                messageDisplay.style.color =
                    "#050510";

            },
            650
        );
}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer() {

    const x =
        player.x;


    const y =
        player.y;


    const w =
        player.width;


    const h =
        player.height;


    ctx.save();


    ctx.shadowColor =
        "#00ffff";


    ctx.shadowBlur =
        12;


    ctx.fillStyle =
        player.color;


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x +
        w / 2,
        y -
        h
    );


    ctx.lineTo(
        x +
        w,
        y
    );


    ctx.lineTo(
        x +
        w * .75,
        y -
        7
    );


    ctx.lineTo(
        x +
        w / 2,
        y +
        8
    );


    ctx.lineTo(
        x +
        w * .25,
        y -
        7
    );


    ctx.closePath();


    ctx.fill();


    /*
     * Cockpit.
     */

    ctx.fillStyle =
        "#050510";


    ctx.beginPath();


    ctx.ellipse(
        x +
        w / 2,
        y -
        h * .45,
        w * .14,
        h * .20,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();
}


/* =========================================================
   DRAW SHIPS
========================================================= */

function drawShips() {

    ships.forEach(
        ship => {

            drawShip(
                ship
            );
        }
    );
}


/* =========================================================
   DRAW ONE SHIP
========================================================= */

function drawShip(
    ship
) {

    const w =
        ship.width;


    const h =
        ship.height;


    ctx.save();


    ctx.translate(
        ship.x,
        ship.y
    );


    /*
     * Diving ships get a bright white glow.
     */

    if (
        ship.diving
    ) {

        ctx.shadowColor =
            "#ffffff";


        ctx.shadowBlur =
            20;

    }
    else {

        ctx.shadowColor =
            ship.color;


        ctx.shadowBlur =
            9;
    }


    ctx.fillStyle =
        ship.color;


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth =
        2;


    /*
     * Alien hull.
     */

    ctx.beginPath();


    ctx.moveTo(
        w * .18,
        0
    );


    ctx.lineTo(
        w * .82,
        0
    );


    ctx.lineTo(
        w,
        h * .30
    );


    ctx.lineTo(
        w * .92,
        h * .76
    );


    ctx.lineTo(
        w * .80,
        h
    );


    ctx.lineTo(
        w * .20,
        h
    );


    ctx.lineTo(
        w * .08,
        h * .76
    );


    ctx.lineTo(
        0,
        h * .30
    );


    ctx.closePath();


    ctx.fill();


    ctx.stroke();


    /*
     * Cockpit.
     */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "rgba(5,5,16,.84)";


    ctx.fillRect(
        w * .07,
        h * .15,
        w * .86,
        h * .70
    );


    ctx.strokeStyle =
        ship.color;


    ctx.strokeRect(
        w * .07,
        h * .15,
        w * .86,
        h * .70
    );


    /*
     * Definition.
     */

    drawWrappedText(
        ship.def,
        w / 2,
        h / 2,
        w * .74,
        17,
        21
    );


    /*
     * Diving ships get an INCOMING
     * marker in the cockpit.
     */

    if (
        ship.diving
    ) {

        ctx.fillStyle =
            "#ffffff";


        ctx.font =
            '900 12px "Segoe UI", Arial, sans-serif';


        ctx.textAlign =
            "center";


        ctx.textBaseline =
            "top";


        ctx.fillText(
            "INCOMING",
            w / 2,
            3
        );
    }


    ctx.restore();
}


/* =========================================================
   WRAP SHIP DEFINITION
========================================================= */

function drawWrappedText(
    text,
    x,
    y,
    maxWidth,
    fontSize,
    lineHeight
) {

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        `700 ${fontSize}px "Segoe UI", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    const words =
        String(
            text
        )
        .split(
            " "
        );


    const lines =
        [];


    let currentLine =
        "";


    words.forEach(
        word => {

            const test =
                currentLine
                    ? `${currentLine} ${word}`
                    : word;


            if (
                ctx.measureText(
                    test
                ).width >
                maxWidth
                &&
                currentLine
            ) {

                lines.push(
                    currentLine
                );


                currentLine =
                    word;

            }
            else {

                currentLine =
                    test;
            }
        }
    );


    if (
        currentLine
    ) {

        lines.push(
            currentLine
        );
    }


    const visibleLines =
        lines.slice(
            0,
            3
        );


    const startY =
        y -
        (
            (
                visibleLines.length -
                1
            )
            *
            lineHeight
            /
            2
        );


    visibleLines.forEach(
        (
            line,
            index
        ) => {

            ctx.fillText(
                line,
                x,
                startY +
                index *
                lineHeight
            );
        }
    );
}


/* =========================================================
   DRAW BULLETS
========================================================= */

function drawBullets() {

    ctx.save();


    ctx.shadowColor =
        "#ff00ff";


    ctx.shadowBlur =
        10;


    bullets.forEach(
        bullet => {

            ctx.fillStyle =
                bullet.color;


            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.width,
                bullet.height
            );
        }
    );


    ctx.restore();
}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#050510";


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    const gradient =
        ctx.createRadialGradient(
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            40,
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            CANVAS_WIDTH * .7
        );


    gradient.addColorStop(
        0,
        "#101030"
    );


    gradient.addColorStop(
        1,
        "#050510"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );
}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw() {

    drawBackground();

    drawShips();

    drawBullets();

    drawPlayer();
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (
        isGameOver
    ) {

        draw();

        return;
    }


    updatePlayer();

    updateBullets();

    updateShips();

    handleCollisions();

    draw();


    requestAnimationFrame(
        gameLoop
    );
}


/* =========================================================
   COMPLETE / VICTORY
========================================================= */

function completeGame() {

    if (
        isGameOver
    ) {

        return;
    }


    playSound("victory");


    triggerGameOver(
        "Victory! Excellent vocabulary work."
    );
}


/* =========================================================
   GAME OVER
========================================================= */

function triggerGameOver(
    reason
) {

    if (
        isGameOver
    ) {

        return;
    }


    isGameOver =
        true;


    gameStarted =
        false;


    /*
     * If this is a true victory,
     * use the victory sound.
     */

    if (
        reason.startsWith(
            "Victory!"
        )
    ) {

        playSound("victory");

    }
    else {

        playSound("gameOver");
    }


    const accuracy =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                )
                *
                100
            )

            : 100;


    finalScore.textContent =
        score;


    finalAccuracy.textContent =
        `${accuracy}%`;


    finalCorrect.textContent =
        correctAnswers;


    finalCombo.textContent =
        bestStreak;


    gameOverList.textContent =
        `${listTitle} — Level ${wave}`;


    gameOverMessage.textContent =
        reason;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    score =
        0;


    ammo =
        MAX_AMMO;


    shields =
        MAX_SHIELDS;


    correctAnswers =
        0;


    totalShots =
        0;


    streak =
        0;


    bestStreak =
        0;


    wave =
        1;


    isGameOver =
        false;


    gameStarted =
        true;


    levelTransitioning =
        false;


    bullets =
        [];


    ships =
        [];


    currentTarget =
        null;


    currentTargetShip =
        null;


    horizontalDirection =
        1;


    horizontalSpeed =
        BASE_HORIZONTAL_SPEED;


    downwardSpeed =
        BASE_DOWNWARD_SPEED;


    lastDiveTime =
        0;


    player.x =
        CANVAS_WIDTH /
        2;


    gameOverScreen.classList.add(
        "hidden"
    );


    updateHUD();


    playSound("start");


    createBoard();
}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    resetGame();
}


/* =========================================================
   RESTART BUTTON
========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        playSound("click");

        startGame();
    }
);


/* =========================================================
   LIBRARY BUTTON
========================================================= */

libraryButton.addEventListener(
    "click",
    () => {

        playSound("click");


        window.location.href =
            "https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html";
    }
);


/* =========================================================
   INITIALIZE GAME
========================================================= */

async function initializeGame() {

    try {

        loadingText.textContent =
            "Loading vocabulary set from Firebase...";


        loadingDetails.textContent =
            "";


        const data =
            await loadVocabularySet(
                setId
            );


        /*
         * Validate the vocabulary before
         * allowing the game to start.
         */

        validateVocabulary(
            data.items
        );


        vocabList =
            data.items;


        listTitle =
            data.title;


        listLanguage =
            data.language;


        listNameDisplay.textContent =
            listLanguage
                ? `${listTitle} • ${listLanguage}`
                : listTitle;


        hideLoading();


        startGame();

    }

    catch (
        error
    ) {

        console.error(
            "BLASTWORD ERROR:",
            error
        );


        showLoadError(
            error.message ||
            "An unexpected error prevented BlastWord from starting."
        );
    }
}


/* =========================================================
   INITIALIZE
========================================================= */

initializeGame();

</script>
