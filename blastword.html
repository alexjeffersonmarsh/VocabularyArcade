/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i =
            copy.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   LOAD FIREBASE SET
   ========================================================= */

async function loadVocabularySet(
    id
) {

    if (!id) {

        throw new Error(
            "No vocabulary set ID was provided. Open BlastWord from the Vocabulary Arcade Library."
        );

    }


    const reference =
        doc(
            db,
            "vocabSets",
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found in Firebase."
        );

    }


    const data =
        snapshot.data();


    let items =
        [];


    /*
       CURRENT FORMAT
    */

    if (
        Array.isArray(
            data.items
        )
    ) {

        items =
            data.items;

    }


    /*
       LEGACY ARRAY
    */

    else if (
        Array.isArray(
            data.terms
        )
    ) {

        items =
            data.terms;

    }


    /*
       LEGACY JSON STRING
    */

    else if (
        typeof data.terms ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    data.terms
                );

        }

        catch {

            throw new Error(
                "The legacy vocabulary data could not be parsed."
            );

        }

    }


    /*
       Normalize vocabulary.
    */

    const vocabulary =
        items
            .filter(
                item =>
                    item &&
                    item.word &&
                    (
                        item.definition ||
                        item.meaning
                    )
            )
            .map(
                item => ({

                    word:
                        String(
                            item.word
                        ).trim(),

                    definition:
                        String(
                            item.definition ||
                            item.meaning ||
                            ""
                        ).trim()

                })
            )
            .filter(
                item =>
                    item.word &&
                    item.definition
            );


    return {

        title:
            data.title ||
            "Vocabulary Set",

        language:
            data.language ||
            "",

        items:
            vocabulary

    };

}


/* =========================================================
   VALIDATE VOCABULARY
   ========================================================= */

function validateVocabulary(
    items
) {

    if (
        !Array.isArray(
            items
        )
    ) {

        throw new Error(
            "The vocabulary data is not an array."
        );

    }


    if (
        items.length <
        MAX_WORDS
    ) {

        throw new Error(
            `BlastWord requires at least ${MAX_WORDS} vocabulary items. This list contains ${items.length}.`
        );

    }


    /*
       Duplicate words.
    */

    const wordMap =
        new Map();


    const duplicateWords =
        [];


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.word
                );


            if (
                wordMap.has(
                    key
                )
            ) {

                duplicateWords.push(
                    item.word
                );

            }

            else {

                wordMap.set(
                    key,
                    true
                );

            }

        }
    );


    if (
        duplicateWords.length > 0
    ) {

        const unique =
            [
                ...new Set(
                    duplicateWords
                )
            ];


        throw new Error(
            "Duplicate vocabulary words found: " +
            unique.join(
                ", "
            )
        );

    }


    /*
       Duplicate definitions.

       These are particularly important
       because the player shoots a ship
       based on its definition.
    */

    const definitionMap =
        new Map();


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.definition
                );


            if (
                !definitionMap.has(
                    key
                )
            ) {

                definitionMap.set(
                    key,
                    []
                );

            }


            definitionMap
                .get(key)
                .push(
                    item.word
                );

        }
    );


    const duplicateDefinitions =
        [
            ...definitionMap.entries()
        ]
        .filter(
            ([key, words]) =>
                words.length > 1
        );


    if (
        duplicateDefinitions.length > 0
    ) {

        const details =
            duplicateDefinitions
                .map(
                    ([definition, words]) =>
                        `"${definition}" → ${words.join(", ")}`
                )
                .join(
                    " | "
                );


        throw new Error(
            "Duplicate answers were found. Each definition must belong to only one vocabulary word. " +
            details
        );

    }


    if (
        definitionMap.size <
        5
    ) {

        throw new Error(
            "BlastWord requires at least five different answers."
        );

    }


    return true;

}

   SHOW LOAD ERROR

/* =========================================================
   CREATE FORMATION
   ========================================================= */

function createShips() {

    ships =
        [];


    const shipWidth =
        220;


    const shipHeight =
        68;


    const horizontalGap =
        18;


    const verticalGap =
        22;


    const totalWidth =
        (
            GRID_COLS *
            shipWidth
        )
        +
        (
            (
                GRID_COLS -
                1
            ) *
            horizontalGap
        );


    const startX =
        (
            CANVAS_WIDTH -
            totalWidth
        )
        /
        2;


    const startY =
        65;


    const definitions =
        shuffle(
            vocabList.map(
                item =>
                    item.definition
            )
        );


    for (
        let row = 0;
        row < GRID_ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < GRID_COLS;
            col++
        ) {

            const definition =
                definitions[
                    (
                        row *
                        GRID_COLS +
                        col
                    )
                    %
                    definitions.length
                ];


            ships.push({

                x:
                    startX +
                    col *
                    (
                        shipWidth +
                        horizontalGap
                    ),

                y:
                    startY +
                    row *
                    (
                        shipHeight +
                        verticalGap
                    ),

                width:
                    shipWidth,

                height:
                    shipHeight,

                def:
                    definition,

                color:
                    SHIP_COLORS[
                        (
                            row *
                            GRID_COLS +
                            col
                        )
                        %
                        SHIP_COLORS.length
                    ],

                gridCol:
                    col,

                gridRow:
                    row,

                diving:
                    false,

                diveTargetX:
                    null,

                diveTargetY:
                    null

            });

        }

    }


    /*
       The first target is always
       one of the five lowest ships.
    */

    setNewReachableTarget();

}


/* =========================================================
   GET FIVE LOWEST NORMAL SHIPS
   ========================================================= */

function getLowestFiveShips() {

    const normalShips =
        ships.filter(
            ship =>
                !ship.diving
        );


    return normalShips
        .sort(
            (
                a,
                b
            ) =>
                (
                    b.y +
                    b.height
                )
                -
                (
                    a.y +
                    a.height
                )
        )
        .slice(
            0,
            LOWEST_TARGET_COUNT
        );

}


/* =========================================================
   SELECT NEW REACHABLE TARGET
========================================================= */

function setNewReachableTarget() {

    if (
        correctAnswers >=
        MAX_WORDS
    ) {

        completeGame();

        return;

    }


    const lowestShips =
        getLowestFiveShips();


    if (
        lowestShips.length === 0
    ) {

        return;

    }


    /*
       Pick one of the five lowest
       ships as the target.
    */

    const selectedShip =
        lowestShips[
            Math.floor(
                Math.random() *
                lowestShips.length
            )
        ];


    const matchingVocabulary =
        vocabList.find(
            item =>
                normalizeText(
                    item.definition
                ) ===
                normalizeText(
                    selectedShip.def
                )
        );


    if (
        !matchingVocabulary
    ) {

        /*
           Safety fallback.
        */

        setTimeout(
            setNewReachableTarget,
            0
        );

        return;

    }


    currentTarget =
        matchingVocabulary;


    currentTargetShip =
        selectedShip;


    targetHistory.push(
        normalizeText(
            currentTarget.word
        )
    );


    targetWordDisplay.textContent =
        currentTarget.word;


    updateHUD();

}


/* =========================================================
   KEYBOARD CONTROLS
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.code
        ] =
            true;


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            if (
                gameStarted &&
                !isGameOver
            ) {

                fireBullet();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.code
        ] =
            false;

    }
);


/* =========================================================
   CANVAS SHOOTING
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            !gameStarted ||
            isGameOver
        ) {

            return;

        }


        fireBullet();

    }
);


/* =========================================================
   FIRE
   ========================================================= */

function fireBullet() {

    if (
        isGameOver ||
        ammo <= 0
    ) {

        return;

    }


    ammo--;

    totalShots++;


    bullets.push({

        x:
            player.x -
            4,

        y:
            player.y -
            5,

        width:
            8,

        height:
            21,

        speed:
            14,

        color:
            "#ff00ff"

    });


    updateHUD();


    /*
       If the player uses all ammunition,
       let existing bullets finish before
       ending the game.
    */

    checkAmmoGameOver();

}


/* =========================================================
   AMMO CHECK
   ========================================================= */

function checkAmmoGameOver() {

    if (
        ammo <= 0 &&
        bullets.length === 0 &&
        !isGameOver &&
        correctAnswers <
            MAX_WORDS
    ) {

        triggerGameOver(
            "You ran out of ammunition!"
        );

    }

}


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer() {

    if (
        keys["ArrowLeft"] ||
        keys["KeyA"]
    ) {

        player.x -=
            player.speed;

    }


    if (
        keys["ArrowRight"] ||
        keys["KeyD"]
    ) {

        player.x +=
            player.speed;

    }


    const half =
        player.width /
        2;


    player.x =
        Math.max(
            half,
            Math.min(
                CANVAS_WIDTH -
                half,
                player.x
            )
        );

}


/* =========================================================
   UPDATE BULLETS
   ========================================================= */

function updateBullets() {

    for (
        let i =
            bullets.length -
            1;

        i >= 0;

        i--
    ) {

        bullets[i].y -=
            bullets[i].speed;


        if (
            bullets[i].y +
            bullets[i].height <
            0
        ) {

            bullets.splice(
                i,
                1
            );

        }

    }


    checkAmmoGameOver();

}


/* =========================================================
   RANDOM DIVING SHIP
   ========================================================= */

function tryStartDive() {

    if (
        Date.now() -
        lastDiveTime <
        DIVE_COOLDOWN
    ) {

        return;

    }


    if (
        Math.random() >
        DIVE_CHANCE
    ) {

        return;

    }


    /*
       Only ships from the topmost
       current row may dive.
    */

    const topRow =
        ships.filter(
            ship =>
                !ship.diving &&
                ship.gridRow === 0
        );


    if (
        topRow.length === 0
    ) {

        return;

    }


    const ship =
        topRow[
            Math.floor(
                Math.random() *
                topRow.length
            )
        ];


    /*
       Don't repeatedly dive the
       same ship when the formation
       is already small.
    */

    ship.diving =
        true;


    ship.diveTargetX =
        player.x;


    ship.diveTargetY =
        player.y;


    lastDiveTime =
        Date.now();


    showMessage(
        "INCOMING!",
        false
    );

}


/* =========================================================
   UPDATE SHIPS
   ========================================================= */

function updateShips() {

    /*
       Occasionally send a top-row ship
       on a dive.
    */

    tryStartDive();


    let left =
        Infinity;


    let right =
        -Infinity;


    /*
       Find the horizontal boundaries
       of normal formation ships.
    */

    ships
        .filter(
            ship =>
                !ship.diving
        )
        .forEach(
            ship => {

                left =
                    Math.min(
                        left,
                        ship.x
                    );


                right =
                    Math.max(
                        right,
                        ship.x +
                        ship.width
                    );

            }
        );


    /*
       Reverse formation direction.
    */

    if (
        right >=
            CANVAS_WIDTH -
            15
        &&
        horizontalDirection > 0
    ) {

        horizontalDirection =
            -1;

    }


    else if (
        left <= 15
        &&
        horizontalDirection < 0
    ) {

        horizontalDirection =
            1;

    }


    ships.forEach(
        ship => {

            /*
               DIVING SHIP
            */

            if (
                ship.diving
            ) {

                updateDivingShip(
                    ship
                );

                return;

            }


            /*
               NORMAL FORMATION
            */

            ship.x +=
                horizontalDirection *
                horizontalSpeed;


            ship.y +=
                downwardSpeed;


            const dangerLine =
                player.y -
                10;


            if (
                ship.y +
                ship.height >=
                dangerLine
            ) {

                triggerGameOver(
                    "The alien fleet reached your ship!"
                );

            }

        }
    );

}


/* =========================================================
   UPDATE DIVING SHIP
   ========================================================= */

function updateDivingShip(
    ship
) {

    const centerX =
        ship.x +
        ship.width /
        2;


    const centerY =
        ship.y +
        ship.height /
        2;


    const dx =
        player.x -
        centerX;


    const dy =
        player.y -
        centerY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distance > 0
    ) {

        /*
           Move toward player's
           current position.
        */

        const directionX =
            dx /
            distance;


        const directionY =
            dy /
            distance;


        ship.x +=
            directionX *
            DIVE_SPEED;


        ship.y +=
            directionY *
            DIVE_SPEED;

    }


    /*
       Check whether the diving ship
       hits the player.
    */

    const playerBox = {

        x:
            player.x -
            player.width /
            2,

        y:
            player.y -
            player.height,

        width:
            player.width,

        height:
            player.height

    };


    if (
        rectanglesOverlap(
            ship,
            playerBox
        )
    ) {

        shields--;


        ship.diving =
            false;


        respawnShipAtTop(
            ship
        );


        showMessage(
            "SHIELD HIT!",
            false
        );


        updateHUD();


        if (
            shields <= 0
        ) {

            triggerGameOver(
                "Your shields were depleted!"
            );

        }

    }


    /*
       If a diving ship flies below
       the visible area, return it
       to the top.
    */

    if (
        ship.y >
        CANVAS_HEIGHT
    ) {

        respawnShipAtTop(
            ship
        );

    }

}


/* =========================================================
   RECTANGLE COLLISION
   ========================================================= */

function rectanglesOverlap(
    a,
    b
) {

    return (

        a.x <
        b.x +
        b.width

        &&

        a.x +
        a.width >
        b.x

        &&

        a.y <
        b.y +
        b.height

        &&

        a.y +
        a.height >
        b.y

    );

}


/* =========================================================
   COLLISIONS
   ========================================================= */

function handleCollisions() {

    for (
        let bIndex =
            bullets.length -
            1;

        bIndex >= 0;

        bIndex--
    ) {

        const bullet =
            bullets[bIndex];


        for (
            let sIndex =
                ships.length -
                1;

            sIndex >= 0;

            sIndex--
        ) {

            const ship =
                ships[sIndex];


            if (
                rectanglesOverlap(
                    bullet,
                    ship
                )
            ) {

                bullets.splice(
                    bIndex,
                    1
                );


                /*
                   DIVING SHIP

                   Never costs a shield.
                */

                if (
                    ship.diving
                ) {

                    handleDivingShipHit(
                        ship
                    );

                }


                /*
                   NORMAL SHIP
                */

                else {

                    handleNormalShipHit(
                        ship
                    );

                }


                break;

            }

        }

    }

}


/* =========================================================
   DIVING SHIP HIT
   ========================================================= */

function handleDivingShipHit(
    ship
) {

    /*
       Remove the diving ship.
    */

    const index =
        ships.indexOf(
            ship
        );


    if (
        index >= 0
    ) {

        ships.splice(
            index,
            1
        );

    }


    /*
       A diving ship is always
       safe to shoot.

       It can still be correct or
       incorrect, but it never costs
       a shield.
    */

    if (
        currentTarget &&
        normalizeText(
            ship.def
        ) ===
        normalizeText(
            currentTarget.definition
        )
    ) {

        correctAnswers++;

        streak++;

        bestStreak =
            Math.max(
                bestStreak,
                streak
            );


        const points =
            150 +
            (
                streak -
                1
            ) *
            25;


        score +=
            points;


        ammo =
            Math.min(
                MAX_AMMO,
                ammo +
                CORRECT_AMMO_BONUS
            );


        showMessage(
            `✓ DIVE HIT! +${points}`,
            true
        );

    }

    else {

        /*
           Wrong diving ship:
           no shield penalty.
        */

        streak = 0;


        score =
            Math.max(
                0,
                score -
                25
            );


        showMessage(
            "✓ DIVE SHIP DESTROYED!",
            true
        );

    }


    updateWave();

    updateHUD();


    if (
        correctAnswers >=
        MAX_WORDS
    ) {

        completeGame();

        return;

    }


    /*
       A diving hit may have changed
       the visible formation, so select
       a new reachable target.
    */

    setNewReachableTarget();

}


/* =========================================================
   NORMAL SHIP HIT
   ========================================================= */

function handleNormalShipHit(
    ship
) {

    const correct =
        currentTarget &&
        normalizeText(
            ship.def
        ) ===
        normalizeText(
            currentTarget.definition
        );


    if (
        correct
    ) {

        handleCorrectNormalHit(
            ship
        );

    }

    else {

        handleWrongNormalHit(
            ship
        );

    }

}


/* =========================================================
   CORRECT NORMAL HIT
   ========================================================= */

function handleCorrectNormalHit(
    ship
) {

    correctAnswers++;


    streak++;


    bestStreak =
        Math.max(
            bestStreak,
            streak
        );


    const points =
        100 +
        (
            streak -
            1
        )
        *
        25;


    score +=
        points;


    ammo =
        Math.min(
            MAX_AMMO,
            ammo +
            CORRECT_AMMO_BONUS
        );


    /*
       Remove the correct ship.
    */

    const index =
        ships.indexOf(
            ship
        );


    if (
        index >= 0
    ) {

        ships.splice(
            index,
            1
        );

    }


    showMessage(
        `✓ HIT! +${points}`,
        true
    );


    updateWave();


    updateHUD();


    if (
        correctAnswers >=
        MAX_WORDS
    ) {

        completeGame();

        return;

    }


    /*
       Replace the destroyed ship
       at the top.
    */

    addReplacementShip();


    /*
       CRITICAL:
       Choose the next target only
       after the new ship is inserted.

       It is guaranteed to be one
       of the five lowest ships.
    */

    setNewReachableTarget();

}


/* =========================================================
   WRONG NORMAL HIT
   ========================================================= */

function handleWrongNormalHit(
    ship
) {

    /*
       Wrong normal shot costs
       one shield.
    */

    shields--;


    streak =
        0;


    score =
        Math.max(
            0,
            score -
            50
        );


    /*
       Send the wrong ship back
       to the top.
    */

    respawnShipAtTop(
        ship
    );


    showMessage(
        "✗ WRONG! -50",
        false
    );


    updateHUD();


    /*
       Immediately choose a NEW target
       from the five lowest ships.
    */

    setNewReachableTarget();


    if (
        shields <= 0
    ) {

        triggerGameOver(
            "Your shields were depleted!"
        );

    }

}


/* =========================================================
   RESPAWN SHIP AT TOP
   ========================================================= */

function respawnShipAtTop(
    ship
) {

    const shipWidth =
        ship.width;


    /*
       Put ship safely above
       the current formation.
    */

    let highestY =
        55;


    ships.forEach(
        other => {

            if (
                other !== ship &&
                !other.diving
            ) {

                highestY =
                    Math.min(
                        highestY,
                        other.y
                    );

            }

        }
    );


    ship.x =
        40 +
        Math.random() *
        (
            CANVAS_WIDTH -
            shipWidth -
            80
        );


    ship.y =
        highestY -
        95;


    ship.diving =
        false;


    ship.gridRow =
        0;


    ship.def =
        getRandomDefinition();


    ship.color =
        SHIP_COLORS[
            Math.floor(
                Math.random() *
                SHIP_COLORS.length
            )
        ];

}


/* =========================================================
   ADD REPLACEMENT SHIP
   ========================================================= */

function addReplacementShip() {

    const shipWidth =
        220;


    const shipHeight =
        68;


    const highestNormal =
        Math.min(
            ...ships
                .filter(
                    ship =>
                        !ship.diving
                )
                .map(
                    ship =>
                        ship.y
                )
                .concat(
                    65
                )
        );


    ships.push({

        x:
            40 +
            Math.random() *
            (
                CANVAS_WIDTH -
                shipWidth -
                80
            ),

        y:
            highestNormal -
            95,

        width:
            shipWidth,

        height:
            shipHeight,

        def:
            getRandomDefinition(),

        color:
            SHIP_COLORS[
                Math.floor(
                    Math.random() *
                    SHIP_COLORS.length
                )
            ],

        gridCol:
            Math.floor(
                Math.random() *
                GRID_COLS
            ),

        gridRow:
            0,

        diving:
            false,

        diveTargetX:
            null,

        diveTargetY:
            null

    });

}


/* =========================================================
   RANDOM DEFINITION
   ========================================================= */

function getRandomDefinition() {

    if (
        vocabList.length === 0
    ) {

        return "";

    }


    return vocabList[
        Math.floor(
            Math.random() *
            vocabList.length
        )
    ].definition;

}


/* =========================================================
   UPDATE WAVE
   ========================================================= */

function updateWave() {

    const newWave =
        Math.floor(
            correctAnswers /
            5
        )
        +
        1;


    if (
        newWave !==
        wave
    ) {

        wave =
            newWave;


        horizontalSpeed =
            1.0 +
            (
                wave -
                1
            )
            *
            0.45;


        downwardSpeed =
            0.04 +
            (
                wave -
                1
            )
            *
            0.018;


        showMessage(
            `WAVE ${wave}`,
            false
        );

    }

}


/* =========================================================
   UPDATE HUD
   ========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        score;


    ammoDisplay.textContent =
        ammo;


    waveDisplay.textContent =
        wave;


    wordsDisplay.textContent =
        `${correctAnswers}/${MAX_WORDS}`;


    const accuracy =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                )
                *
                100
            )

            : 100;


    accuracyDisplay.textContent =
        `${accuracy}%`;


    let hearts =
        "";


    for (
        let i = 0;
        i < MAX_SHIELDS;
        i++
    ) {

        hearts +=
            i < shields
                ? "♥ "
                : "♡ ";

    }


    shieldsDisplay.textContent =
        hearts.trim();

}


/* =========================================================
   SHOW MESSAGE
   ========================================================= */

let messageTimer =
    null;


function showMessage(
    message,
    success
) {

    messageDisplay.textContent =
        message;


    messageDisplay.style.background =
        success
            ? "rgba(34,197,94,.95)"
            : "rgba(239,68,68,.95)";


    messageDisplay.style.color =
        "#ffffff";


    messageDisplay.classList.remove(
        "show"
    );


    void messageDisplay.offsetWidth;


    messageDisplay.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            () => {

                messageDisplay.classList.remove(
                    "show"
                );


                messageDisplay.style.background =
                    "rgba(0,255,255,.92)";


                messageDisplay.style.color =
                    "#050510";

            },
            650
        );

}


/* =========================================================
   DRAW PLAYER
   ========================================================= */

function drawPlayer() {

    const x =
        player.x;


    const y =
        player.y;


    const w =
        player.width;


    const h =
        player.height;


    ctx.save();


    ctx.shadowColor =
        "#00ffff";


    ctx.shadowBlur =
        12;


    ctx.fillStyle =
        player.color;


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x +
        w / 2,
        y -
        h
    );


    ctx.lineTo(
        x +
        w,
        y
    );


    ctx.lineTo(
        x +
        w * .75,
        y -
        7
    );


    ctx.lineTo(
        x +
        w / 2,
        y +
        8
    );


    ctx.lineTo(
        x +
        w * .25,
        y -
        7
    );


    ctx.closePath();


    ctx.fill();


    /*
       Cockpit.
    */

    ctx.fillStyle =
        "#050510";


    ctx.beginPath();


    ctx.ellipse(
        x +
        w / 2,
        y -
        h * .45,
        w * .14,
        h * .20,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   DRAW SHIPS
   ========================================================= */

function drawShips() {

    ships.forEach(
        ship => {

            drawShip(
                ship
            );

        }
    );

}


/* =========================================================
   DRAW ONE SHIP
   ========================================================= */

function drawShip(
    ship
) {

    const w =
        ship.width;


    const h =
        ship.height;


    ctx.save();


    ctx.translate(
        ship.x,
        ship.y
    );


    /*
       Diving ships glow differently.
    */

    if (
        ship.diving
    ) {

        ctx.shadowColor =
            "#ffffff";

        ctx.shadowBlur =
            20;

    }

    else {

        ctx.shadowColor =
            ship.color;

        ctx.shadowBlur =
            9;

    }


    ctx.fillStyle =
        ship.color;


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth =
        2;


    /*
       Alien hull.
    */

    ctx.beginPath();


    ctx.moveTo(
        w * .18,
        0
    );


    ctx.lineTo(
        w * .82,
        0
    );


    ctx.lineTo(
        w,
        h * .30
    );


    ctx.lineTo(
        w * .92,
        h * .76
    );


    ctx.lineTo(
        w * .80,
        h
    );


    ctx.lineTo(
        w * .20,
        h
    );


    ctx.lineTo(
        w * .08,
        h * .76
    );


    ctx.lineTo(
        0,
        h * .30
    );


    ctx.closePath();


    ctx.fill();


    ctx.stroke();


    /*
       Cockpit.
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "rgba(5,5,16,.84)";


    ctx.fillRect(
        w * .07,
        h * .15,
        w * .86,
        h * .70
    );


    ctx.strokeStyle =
        ship.color;


    ctx.strokeRect(
        w * .07,
        h * .15,
        w * .86,
        h * .70
    );


    /*
       Definition.
    */

    drawWrappedText(
        ship.def,
        w / 2,
        h / 2,
        w * .74,
        17,
        21
    );


    ctx.restore();

}


/* =========================================================
   WRAP TEXT
   ========================================================= */

function drawWrappedText(
    text,
    x,
    y,
    maxWidth,
    fontSize,
    lineHeight
) {

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        `700 ${fontSize}px "Segoe UI", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    const words =
        String(
            text
        )
        .split(
            " "
        );


    const lines =
        [];


    let currentLine =
        "";


    words.forEach(
        word => {

            const test =
                currentLine

                    ? `${currentLine} ${word}`

                    : word;


            if (
                ctx.measureText(
                    test
                ).width >
                maxWidth
                &&
                currentLine
            ) {

                lines.push(
                    currentLine
                );


                currentLine =
                    word;

            }

            else {

                currentLine =
                    test;

            }

        }
    );


    if (
        currentLine
    ) {

        lines.push(
            currentLine
        );

    }


    const visibleLines =
        lines.slice(
            0,
            3
        );


    const startY =
        y -
        (
            (
                visibleLines.length -
                1
            )
            *
            lineHeight
            /
            2
        );


    visibleLines.forEach(
        (
            line,
            index
        ) => {

            ctx.fillText(
                line,
                x,
                startY +
                index *
                lineHeight
            );

        }
    );

}


/* =========================================================
   DRAW BULLETS
   ========================================================= */

function drawBullets() {

    ctx.save();


    ctx.shadowColor =
        "#ff00ff";


    ctx.shadowBlur =
        10;


    bullets.forEach(
        bullet => {

            ctx.fillStyle =
                bullet.color;


            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.width,
                bullet.height
            );

        }
    );


    ctx.restore();

}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#050510";


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    const gradient =
        ctx.createRadialGradient(
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            40,
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            CANVAS_WIDTH * .7
        );


    gradient.addColorStop(
        0,
        "#101030"
    );


    gradient.addColorStop(
        1,
        "#050510"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );

}


/* =========================================================
   MAIN DRAW
   ========================================================= */

function draw() {

    drawBackground();

    drawShips();

    drawBullets();

    drawPlayer();

}


/* =========================================================
   MAIN LOOP
   ========================================================= */

function gameLoop() {

    if (
        isGameOver
    ) {

        draw();

        return;

    }


    updatePlayer();

    updateBullets();

    updateShips();

    handleCollisions();

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   COMPLETE GAME
   ========================================================= */

function completeGame() {

    triggerGameOver(
        "Excellent work! You blasted all 20 vocabulary targets."
    );

}


/* =========================================================
   GAME OVER
   ========================================================= */

function triggerGameOver(
    reason
) {

    if (
        isGameOver
    ) {

        return;

    }


    isGameOver =
        true;


    gameStarted =
        false;


    const accuracy =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                )
                *
                100
            )

            : 100;


    finalScore.textContent =
        score;


    finalAccuracy.textContent =
        `${accuracy}%`;


    finalCorrect.textContent =
        `${correctAnswers}/${MAX_WORDS}`;


    finalCombo.textContent =
        bestStreak;


    gameOverList.textContent =
        listTitle;


    gameOverMessage.textContent =
        reason;


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   RESET GAME
   ========================================================= */

function resetGame() {

    score =
        0;


    ammo =
        MAX_AMMO;


    shields =
        MAX_SHIELDS;


    correctAnswers =
        0;


    totalShots =
        0;


    streak =
        0;


    bestStreak =
        0;


    wave =
        1;


    isGameOver =
        false;


    gameStarted =
        true;


    bullets =
        [];


    ships =
        [];


    targetHistory =
        [];


    currentTarget =
        null;


    currentTargetShip =
        null;


    horizontalDirection =
        1;


    horizontalSpeed =
        1.0;


    downwardSpeed =
        0.04;


    lastDiveTime =
        0;


    player.x =
        CANVAS_WIDTH /
        2;


    gameOverScreen.classList.add(
        "hidden"
    );


    createShips();


    updateHUD();


    gameLoop();

}


/* =========================================================
   START GAME
   ========================================================= */

function startGame() {

    resetGame();

}


/* =========================================================
   RESTART
   ========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =========================================================
   LIBRARY
   ========================================================= */

libraryButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html";

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initializeGame() {

    try {

        loadingText.textContent =
            "Loading vocabulary set from Firebase...";


        loadingDetails.textContent =
            "";


        const data =
            await loadVocabularySet(
                setId
            );


        /*
           Validate before starting.
        */

        validateVocabulary(
            data.items
        );


        vocabList =
            data.items;


        listTitle =
            data.title;


        listNameDisplay.textContent =
            listTitle;


        hideLoading();


        startGame();

    }

    catch (
        error
    ) {

        console.error(
            "BLASTWORD ERROR:",
            error
        );


        showLoadError(
            error.message ||
            "An unexpected error prevented BlastWord from starting."
        );

    }

}


/* =========================================================
   START
   ========================================================= */

initializeGame();


</script>
