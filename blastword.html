/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();

}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i =
            copy.length -
            1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =========================================================
   LOAD FIREBASE SET
   ========================================================= */

async function loadVocabularySet(
    id
) {

    if (!id) {

        throw new Error(
            "No vocabulary set ID was provided. Open BlastWord from the Vocabulary Arcade Library."
        );

    }


    const reference =
        doc(
            db,
            "vocabSets",
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found in Firebase."
        );

    }


    const data =
        snapshot.data();


    let items =
        [];


    /*
       CURRENT FORMAT
       items: [
           {
               word: "...",
               definition: "..."
           }
       ]
    */

    if (
        Array.isArray(
            data.items
        )
    ) {

        items =
            data.items;

    }


    /*
       LEGACY FORMAT
    */

    else if (
        Array.isArray(
            data.terms
        )
    ) {

        items =
            data.terms;

    }


    else if (
        typeof data.terms ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    data.terms
                );

        }

        catch {

            throw new Error(
                "The legacy vocabulary data could not be parsed."
            );

        }

    }


    /*
       Normalize the vocabulary.
    */

    const vocabulary =
        items
            .filter(
                item =>
                    item &&
                    item.word &&
                    (
                        item.definition ||
                        item.meaning
                    )
            )
            .map(
                item => ({

                    word:
                        String(
                            item.word
                        ).trim(),

                    definition:
                        String(
                            item.definition ||
                            item.meaning ||
                            ""
                        ).trim()

                })
            )
            .filter(
                item =>
                    item.word &&
                    item.definition
            );


    return {

        title:
            data.title ||
            "Vocabulary Set",

        language:
            data.language ||
            "",

        items:
            vocabulary

    };

}


/* =========================================================
   VALIDATE VOCABULARY
   ========================================================= */

function validateVocabulary(
    items
) {

    if (
        !Array.isArray(
            items
        )
    ) {

        throw new Error(
            "The vocabulary data is not an array."
        );

    }


    if (
        items.length <
        MAX_WORDS_PER_GAME
    ) {

        throw new Error(
            `BlastWord requires at least ${MAX_WORDS_PER_GAME} vocabulary items. This list contains ${items.length}.`
        );

    }


    /*
       Check for duplicate words.
    */

    const wordCounts =
        new Map();


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.word
                );


            wordCounts.set(
                key,
                (
                    wordCounts.get(
                        key
                    ) ||
                    0
                ) + 1
            );

        }
    );


    const duplicateWords =
        items
            .filter(
                item =>
                    wordCounts.get(
                        normalizeText(
                            item.word
                        )
                    ) > 1
            )
            .map(
                item =>
                    item.word
            );


    if (
        duplicateWords.length > 0
    ) {

        const uniqueDuplicates =
            [
                ...new Set(
                    duplicateWords
                )
            ];


        throw new Error(
            "Duplicate vocabulary words found: " +
            uniqueDuplicates.join(
                ", "
            )
        );

    }


    /*
       Check for duplicate answers.

       In BlastWord, the definition is
       the answer the student shoots.

       Therefore every definition must
       be unique.
    */

    const definitionMap =
        new Map();


    items.forEach(
        item => {

            const key =
                normalizeText(
                    item.definition
                );


            if (
                !definitionMap.has(
                    key
                )
            ) {

                definitionMap.set(
                    key,
                    []
                );

            }


            definitionMap
                .get(key)
                .push(
                    item.word
                );

        }
    );


    const duplicateDefinitions =
        [...definitionMap.entries()]
            .filter(
                ([key, words]) =>
                    words.length > 1
            );


    if (
        duplicateDefinitions.length > 0
    ) {

        const details =
            duplicateDefinitions
                .map(
                    ([key, words]) =>
                        `"${key}" → ${words.join(", ")}`
                )
                .join(
                    " | "
                );


        throw new Error(
            "Duplicate answers were found in this vocabulary set. " +
            "Each definition must belong to only one vocabulary word. " +
            details
        );

    }


    /*
       Unique definitions.
    */

    const uniqueDefinitions =
        definitionMap.size;


    if (
        uniqueDefinitions <
        MIN_UNIQUE_DEFINITIONS
    ) {

        throw new Error(
            `BlastWord requires at least ${MIN_UNIQUE_DEFINITIONS} different answers. This list has only ${uniqueDefinitions}.`
        );

    }


    return true;

}

/* =========================================================
   CREATE SHIPS
   ========================================================= */

function createShips() {

    ships =
        [];


    const playableBottom =
        CANVAS_HEIGHT -
        FOOTER_HEIGHT -
        40;


    const shipWidth =
        220;


    const shipHeight =
        68;


    const horizontalGap =
        18;


    const verticalGap =
        22;


    const totalWidth =
        (
            SHIP_COLS *
            shipWidth
        )
        +
        (
            (
                SHIP_COLS -
                1
            ) *
            horizontalGap
        );


    const startX =
        (
            CANVAS_WIDTH -
            totalWidth
        ) /
        2;


    const startY =
        65;


    /*
       Start by assigning random definitions.
    */

    const shuffledDefinitions =
        shuffle(
            vocabList
                .map(
                    item =>
                        item.definition
                )
        );


    for (
        let row = 0;
        row < SHIP_ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < SHIP_COLS;
            col++
        ) {

            const definition =
                shuffledDefinitions[
                    (
                        row *
                        SHIP_COLS +
                        col
                    )
                    %
                    shuffledDefinitions.length
                ];


            ships.push({

                x:
                    startX +
                    col *
                    (
                        shipWidth +
                        horizontalGap
                    ),

                y:
                    startY +
                    row *
                    (
                        shipHeight +
                        verticalGap
                    ),

                width:
                    shipWidth,

                height:
                    shipHeight,

                def:
                    definition,

                color:
                    SHIP_COLORS[
                        (
                            row *
                            SHIP_COLS +
                            col
                        )
                        %
                        SHIP_COLORS.length
                    ],

                gridCol:
                    col,

                gridRow:
                    row

            });

        }

    }


    /*
       Give the first target a guaranteed
       matching ship.
    */

    setNewTarget();

}


/* =========================================================
   SET NEW TARGET
   ========================================================= */

function setNewTarget() {

    if (
        correctAnswers >=
        MAX_WORDS_PER_GAME
    ) {

        completeGame();

        return;

    }


    /*
       Select a vocabulary item.

       Avoid repeating targets until we
       have used most of the list.
    */

    const available =
        vocabList.filter(
            item =>
                !targetHistory.includes(
                    normalizeText(
                        item.word
                    )
                )
        );


    let pool =
        available.length > 0
            ? available
            : vocabList;


    /*
       Prefer a target whose definition
       can replace a ship without making
       the visible board ambiguous.
    */

    const selected =
        pool[
            Math.floor(
                Math.random() *
                pool.length
            )
        ];


    currentTarget =
        selected;


    targetHistory.push(
        normalizeText(
            selected.word
        )
    );


    targetWordDisplay.textContent =
        selected.word;


    /*
       Guarantee exactly one matching ship.
    */

    ensureTargetShip();

    updateHUD();

}


/* =========================================================
   GUARANTEE TARGET SHIP
   ========================================================= */

function ensureTargetShip() {

    if (
        !currentTarget
    ) {

        return;

    }


    const matchingShips =
        ships.filter(
            ship =>
                normalizeText(
                    ship.def
                ) ===
                normalizeText(
                    currentTarget.definition
                )
        );


    /*
       If there is already exactly one,
       we're finished.
    */

    if (
        matchingShips.length === 1
    ) {

        return;

    }


    /*
       If there are multiple matches,
       change all but one.
    */

    if (
        matchingShips.length > 1
    ) {

        for (
            let i = 1;
            i < matchingShips.length;
            i++
        ) {

            matchingShips[i].def =
                getDistractorDefinition(
                    currentTarget.definition
                );

        }


        return;

    }


    /*
       There is no matching ship.
       Replace one ship with the correct
       definition.
    */

    const replacement =
        ships[
            Math.floor(
                Math.random() *
                ships.length
            )
        ];


    replacement.def =
        currentTarget.definition;

}


/* =========================================================
   DISTRACTOR DEFINITION
   ========================================================= */

function getDistractorDefinition(
    correctDefinition
) {

    const choices =
        vocabList
            .map(
                item =>
                    item.definition
            )
            .filter(
                definition =>
                    normalizeText(
                        definition
                    ) !==
                    normalizeText(
                        correctDefinition
                    )
            );


    if (
        choices.length === 0
    ) {

        return correctDefinition;

    }


    return choices[
        Math.floor(
            Math.random() *
            choices.length
        )
    ];

}


/* =========================================================
   HUD
   ========================================================= */

function updateHUD() {

    scoreDisplay.textContent =
        score;


    ammoDisplay.textContent =
        ammo;


    waveDisplay.textContent =
        wave;


    wordsDisplay.textContent =
        `${correctAnswers}/${MAX_WORDS_PER_GAME}`;


    const percentage =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                ) *
                100
            )

            : 100;


    accuracyDisplay.textContent =
        `${percentage}%`;


    let shieldsText =
        "";


    for (
        let i = 0;
        i < MAX_SHIELDS;
        i++
    ) {

        shieldsText +=
            i < shields
                ? "♥ "
                : "♡ ";

    }


    shieldsDisplay.textContent =
        shieldsText.trim();

}


/* =========================================================
   UPDATE WAVE
   ========================================================= */

function updateWave() {

    const newWave =
        Math.floor(
            correctAnswers / 5
        )
        +
        1;


    if (
        newWave !== wave
    ) {

        wave =
            newWave;


        horizontalSpeed =
            1.0 +
            (
                wave -
                1
            )
            *
            0.45;


        downwardSpeed =
            0.04 +
            (
                wave -
                1
            )
            *
            0.018;


        showWaveMessage(
            `WAVE ${wave}`
        );

    }

}


/* =========================================================
   WAVE MESSAGE
   ========================================================= */

let waveMessageTimer =
    null;


function showWaveMessage(
    message
) {

    waveMessage.textContent =
        message;


    waveMessage.classList.remove(
        "show"
    );


    void waveMessage.offsetWidth;


    waveMessage.classList.add(
        "show"
    );


    clearTimeout(
        waveMessageTimer
    );


    waveMessageTimer =
        setTimeout(
            () => {

                waveMessage.classList.remove(
                    "show"
                );

            },
            900
        );

}


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.code
        ] =
            true;


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();


            if (
                gameStarted &&
                !isGameOver
            ) {

                fireBulletFromPlayer();

            }

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.code
        ] =
            false;

    }
);


/* =========================================================
   FIRE BULLET
   ========================================================= */

function fireBulletFromPlayer() {

    if (
        isGameOver ||
        ammo <= 0
    ) {

        return;

    }


    ammo--;

    totalShots++;


    bullets.push({

        x:
            player.x -
            4,

        y:
            player.y -
            5,

        width:
            8,

        height:
            21,

        speed:
            14,

        color:
            "#ff00ff"

    });


    updateHUD();

}


/* =========================================================
   CANVAS CLICK / TOUCH
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (
            !gameStarted ||
            isGameOver
        ) {

            return;

        }


        /*
           Only fire when the player
           clicks/taps the game field.
        */

        fireBulletFromPlayer();

    }
);


/* =========================================================
   UPDATE PLAYER
   ========================================================= */

function updatePlayer() {

    if (
        keys["ArrowLeft"] ||
        keys["KeyA"]
    ) {

        player.x -=
            player.speed;

    }


    if (
        keys["ArrowRight"] ||
        keys["KeyD"]
    ) {

        player.x +=
            player.speed;

    }


    const halfWidth =
        player.width /
        2;


    player.x =
        Math.max(
            halfWidth,
            Math.min(
                CANVAS_WIDTH -
                halfWidth,
                player.x
            )
        );

}


/* =========================================================
   UPDATE BULLETS
   ========================================================= */

function updateBullets() {

    for (
        let i =
            bullets.length -
            1;

        i >= 0;

        i--
    ) {

        const bullet =
            bullets[i];


        bullet.y -=
            bullet.speed;


        if (
            bullet.y +
            bullet.height <
            0
        ) {

            bullets.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   UPDATE SHIPS
   ========================================================= */

function updateShips() {

    if (
        ships.length === 0
    ) {

        return;

    }


    let left =
        Infinity;


    let right =
        -Infinity;


    ships.forEach(
        ship => {

            left =
                Math.min(
                    left,
                    ship.x
                );


            right =
                Math.max(
                    right,
                    ship.x +
                    ship.width
                );

        }
    );


    /*
       Reverse horizontal direction
       when the formation reaches the edge.
    */

    if (
        right >=
            CANVAS_WIDTH -
            15
        &&
        horizontalDirection > 0
    ) {

        horizontalDirection =
            -1;

    }


    else if (
        left <= 15
        &&
        horizontalDirection < 0
    ) {

        horizontalDirection =
            1;

    }


    ships.forEach(
        ship => {

            ship.x +=
                horizontalDirection *
                horizontalSpeed;


            /*
               Gradually move downward.
            */

            ship.y +=
                downwardSpeed;


            /*
               Game-over boundary.
            */

            const dangerLine =
                player.y -
                10;


            if (
                ship.y +
                ship.height >=
                dangerLine
            ) {

                triggerGameOver(
                    "The alien fleet reached your ship!"
                );

            }

        }
    );

}


/* =========================================================
   COLLISION DETECTION
   ========================================================= */

function rectanglesOverlap(
    a,
    b
) {

    return (

        a.x <
        b.x +
        b.width

        &&

        a.x +
        a.width >
        b.x

        &&

        a.y <
        b.y +
        b.height

        &&

        a.y +
        a.height >
        b.y

    );

}


/* =========================================================
   HANDLE BULLET COLLISIONS
   ========================================================= */

function handleCollisions() {

    for (
        let bIndex =
            bullets.length -
            1;

        bIndex >= 0;

        bIndex--
    ) {

        const bullet =
            bullets[bIndex];


        let collisionHandled =
            false;


        for (
            let sIndex = 0;

            sIndex <
            ships.length;

            sIndex++
        ) {

            const ship =
                ships[sIndex];


            if (
                rectanglesOverlap(
                    bullet,
                    ship
                )
            ) {

                /*
                   Remove bullet.
                */

                bullets.splice(
                    bIndex,
                    1
                );


                collisionHandled =
                    true;


                /*
                   CORRECT SHIP
                */

                if (
                    normalizeText(
                        ship.def
                    ) ===
                    normalizeText(
                        currentTarget.definition
                    )
                ) {

                    handleCorrectHit(
                        ship
                    );

                }


                /*
                   WRONG SHIP
                */

                else {

                    handleWrongHit(
                        ship
                    );

                }


                break;

            }

        }


        if (
            collisionHandled
        ) {

            continue;

        }

    }

}


/* =========================================================
   CORRECT HIT
   ========================================================= */

function handleCorrectHit(
    ship
) {

    correctAnswers++;


    streak++;


    bestStreak =
        Math.max(
            bestStreak,
            streak
        );


    /*
       Base score.
    */

    let points =
        100;


    /*
       Combo bonus.
    */

    points +=
        (
            streak -
            1
        )
        *
        25;


    score +=
        points;


    /*
       Reward accurate play with ammo.
    */

    ammo =
        Math.min(
            MAX_AMMO,
            ammo +
            CORRECT_AMMO_BONUS
        );


    /*
       Remove correct ship.
    */

    const shipIndex =
        ships.indexOf(
            ship
        );


    if (
        shipIndex >= 0
    ) {

        ships.splice(
            shipIndex,
            1
        );

    }


    /*
       Correct answer explosion.
       A visual pulse is handled by
       the ship-removal effect below.
    */

    showFeedback(
        `✓ +${points}`,
        true
    );


    updateWave();


    updateHUD();


    /*
       Game complete?
    */

    if (
        correctAnswers >=
        MAX_WORDS_PER_GAME
    ) {

        completeGame();

        return;

    }


    /*
       Replace the destroyed ship
       above the formation.
    */

    setTimeout(
        () => {

            if (
                isGameOver
            ) {

                return;

            }


            addReplacementShip();


            setNewTarget();

        },
        180
    );

}


/* =========================================================
   WRONG HIT
   ========================================================= */

function handleWrongHit(
    ship
) {

    shields--;

    streak =
        0;


    score =
        Math.max(
            0,
            score -
            50
        );


    showFeedback(
        "✗ Wrong! -50",
        false
    );


    /*
       Move wrong ship back upward
       rather than destroying it.
    */

    ship.y =
        Math.max(
            55,
            ship.y -
            55
        );


    /*
       Change its definition to a
       distractor if needed.
    */

    ship.def =
        getDistractorDefinition(
            currentTarget.definition
        );


    updateHUD();


    if (
        shields <= 0
    ) {

        triggerGameOver(
            "Your shields were depleted!"
        );

    }

}


/* =========================================================
   ADD REPLACEMENT SHIP
   ========================================================= */

function addReplacementShip() {

    const shipWidth =
        220;


    const shipHeight =
        68;


    const horizontalGap =
        18;


    /*
       Find the highest ship.
    */

    let highestY =
        Infinity;


    ships.forEach(
        ship => {

            highestY =
                Math.min(
                    highestY,
                    ship.y
                );

        }
    );


    if (
        highestY ===
        Infinity
    ) {

        highestY =
            70;

    }


    /*
       Pick the definition carefully.
    */

    const definition =
        getDistractorDefinition(
            currentTarget.definition
        );


    const col =
        Math.floor(
            Math.random() *
            SHIP_COLS
        );


    ships.push({

        x:
            45 +
            col *
            (
                shipWidth +
                horizontalGap
            ),

        y:
            highestY -
            90,

        width:
            shipWidth,

        height:
            shipHeight,

        def:
            definition,

        color:
            SHIP_COLORS[
                Math.floor(
                    Math.random() *
                    SHIP_COLORS.length
                )
            ],

        gridCol:
            col,

        gridRow:
            0

    });

}


/* =========================================================
   PLAYER DRAW
   ========================================================= */

function drawPlayer() {

    const x =
        player.x;


    const y =
        player.y;


    const w =
        player.width;


    const h =
        player.height;


    ctx.save();


    ctx.shadowColor =
        "#00ffff";


    ctx.shadowBlur =
        12;


    ctx.fillStyle =
        player.color;


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.lineTo(
        x +
        w / 2,
        y -
        h
    );


    ctx.lineTo(
        x +
        w,
        y
    );


    ctx.lineTo(
        x +
        w * 0.75,
        y -
        7
    );


    ctx.lineTo(
        x +
        w / 2,
        y +
        8
    );


    ctx.lineTo(
        x +
        w * 0.25,
        y -
        7
    );


    ctx.closePath();


    ctx.fill();


    /*
       Cockpit.
    */

    ctx.fillStyle =
        "#050510";


    ctx.beginPath();


    ctx.ellipse(
        x +
        w / 2,
        y -
        h * 0.45,
        w * 0.14,
        h * 0.20,
        0,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   SHIP DRAW
   ========================================================= */

function drawShips() {

    ships.forEach(
        ship => {

            drawAlienShip(
                ship
            );

        }
    );

}


/* =========================================================
   DRAW ALIEN SHIP
   ========================================================= */

function drawAlienShip(
    ship
) {

    const x =
        ship.x;


    const y =
        ship.y;


    const w =
        ship.width;


    const h =
        ship.height;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    /*
       Outer hull.
    */

    ctx.fillStyle =
        ship.color;


    ctx.strokeStyle =
        "#ffffff";


    ctx.lineWidth =
        2;


    ctx.shadowColor =
        ship.color;


    ctx.shadowBlur =
        9;


    ctx.beginPath();


    ctx.moveTo(
        w * 0.18,
        0
    );


    ctx.lineTo(
        w * 0.82,
        0
    );


    ctx.lineTo(
        w,
        h * 0.30
    );


    ctx.lineTo(
        w * 0.92,
        h * 0.76
    );


    ctx.lineTo(
        w * 0.80,
        h
    );


    ctx.lineTo(
        w * 0.20,
        h
    );


    ctx.lineTo(
        w * 0.08,
        h * 0.76
    );


    ctx.lineTo(
        0,
        h * 0.30
    );


    ctx.closePath();


    ctx.fill();


    ctx.stroke();


    /*
       Dark cockpit.
    */

    ctx.shadowBlur =
        0;


    ctx.fillStyle =
        "rgba(5, 5, 16, 0.82)";


    ctx.fillRect(
        w * 0.07,
        h * 0.15,
        w * 0.86,
        h * 0.70
    );


    ctx.strokeStyle =
        ship.color;


    ctx.strokeRect(
        w * 0.07,
        h * 0.15,
        w * 0.86,
        h * 0.70
    );


    /*
       Definition text.
    */

    drawWrappedText(
        ship.def,
        w / 2,
        h / 2,
        w * 0.74,
        17,
        21
    );


    ctx.restore();

}


/* =========================================================
   WRAPPED DEFINITION TEXT
   ========================================================= */

function drawWrappedText(
    text,
    x,
    y,
    maxWidth,
    fontSize,
    lineHeight
) {

    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        `700 ${fontSize}px "Segoe UI", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    const words =
        String(
            text
        ).split(
            " "
        );


    const lines =
        [];


    let currentLine =
        "";


    words.forEach(
        word => {

            const testLine =
                currentLine
                    ? `${currentLine} ${word}`
                    : word;


            const width =
                ctx.measureText(
                    testLine
                ).width;


            if (
                width >
                maxWidth
                &&
                currentLine
            ) {

                lines.push(
                    currentLine
                );


                currentLine =
                    word;

            }

            else {

                currentLine =
                    testLine;

            }

        }
    );


    if (
        currentLine
    ) {

        lines.push(
            currentLine
        );

    }


    /*
       Limit to three lines.
    */

    const visibleLines =
        lines.slice(
            0,
            3
        );


    const startY =
        y -
        (
            (
                visibleLines.length -
                1
            )
            *
            lineHeight
            /
            2
        );


    visibleLines.forEach(
        (
            line,
            index
        ) => {

            ctx.fillText(
                line,
                x,
                startY +
                index *
                lineHeight
            );

        }
    );

}


/* =========================================================
   BULLET DRAW
   ========================================================= */

function drawBullets() {

    ctx.save();


    ctx.shadowColor =
        "#ff00ff";


    ctx.shadowBlur =
        10;


    bullets.forEach(
        bullet => {

            ctx.fillStyle =
                bullet.color;


            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.width,
                bullet.height
            );

        }
    );


    ctx.restore();

}


/* =========================================================
   DRAW BACKGROUND
   ========================================================= */

function drawBackground() {

    /*
       Dark space.
    */

    ctx.fillStyle =
        "#050510";


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    /*
       Subtle radial background.
    */

    const gradient =
        ctx.createRadialGradient(
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            40,
            CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2,
            CANVAS_WIDTH * 0.7
        );


    gradient.addColorStop(
        0,
        "#101030"
    );


    gradient.addColorStop(
        1,
        "#050510"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    /*
       Stars.
    */

    drawStars();

}


/* =========================================================
   STAR FIELD
========================================================= */

const stars = [];


for (
    let i = 0;
    i < 90;
    i++
) {

    stars.push({

        x:
            Math.random() *
            CANVAS_WIDTH,

        y:
            Math.random() *
            (
                CANVAS_HEIGHT -
                FOOTER_HEIGHT -
                20
            ),

        size:
            Math.random() *
            2
            +
            0.5,

        alpha:
            Math.random() *
            0.7
            +
            0.2

    });

}


function drawStars() {

    stars.forEach(
        star => {

            ctx.globalAlpha =
                star.alpha;


            ctx.fillStyle =
                "#ffffff";


            ctx.fillRect(
                star.x,
                star.y,
                star.size,
                star.size
            );

        }
    );


    ctx.globalAlpha =
        1;

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw() {

    drawBackground();

    drawShips();

    drawBullets();

    drawPlayer();

}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (
        isGameOver
    ) {

        draw();

        return;

    }


    updatePlayer();

    updateBullets();

    updateShips();

    handleCollisions();

    draw();


    requestAnimationFrame(
        gameLoop
    );

}


/* =========================================================
   FEEDBACK
========================================================= */

let feedbackTimer =
    null;


function showFeedback(
    message,
    correct
) {

    /*
       Use wave message for quick
       feedback so no extra overlay
       is needed.
    */

    waveMessage.textContent =
        message;


    waveMessage.style.background =
        correct
            ? "rgba(34, 197, 94, 0.95)"
            : "rgba(239, 68, 68, 0.95)";


    waveMessage.style.color =
        "#ffffff";


    waveMessage.classList.remove(
        "show"
    );


    void waveMessage.offsetWidth;


    waveMessage.classList.add(
        "show"
    );


    clearTimeout(
        feedbackTimer
    );


    feedbackTimer =
        setTimeout(
            () => {

                waveMessage.classList.remove(
                    "show"
                );


                waveMessage.style.background =
                    "rgba(0, 255, 255, 0.90)";


                waveMessage.style.color =
                    "#050510";

            },
            500
        );

}


/* =========================================================
   GAME COMPLETE
========================================================= */

function completeGame() {

    triggerGameOver(
        "Excellent work! You blasted all 20 vocabulary targets."
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function triggerGameOver(
    reason
) {

    if (
        isGameOver
    ) {

        return;

    }


    isGameOver =
        true;


    gameStarted =
        false;


    const accuracy =
        totalShots > 0

            ? Math.round(
                (
                    correctAnswers /
                    totalShots
                )
                *
                100
            )

            : 100;


    finalScore.textContent =
        score;


    finalAccuracy.textContent =
        `${accuracy}%`;


    finalCorrect.textContent =
        `${correctAnswers}/${MAX_WORDS_PER_GAME}`;


    finalCombo.textContent =
        bestStreak;


    gameOverList.textContent =
        listTitle;


    gameOverMessage.textContent =
        reason;


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame() {

    score =
        0;


    ammo =
        MAX_AMMO;


    shields =
        MAX_SHIELDS;


    correctAnswers =
        0;


    totalShots =
        0;


    streak =
        0;


    bestStreak =
        0;


    wave =
        1;


    isGameOver =
        false;


    gameStarted =
        true;


    bullets =
        [];


    ships =
        [];


    targetHistory =
        [];


    horizontalDirection =
        1;


    horizontalSpeed =
        1.0;


    downwardSpeed =
        0.04;


    player.x =
        CANVAS_WIDTH /
        2;


    gameOverScreen.classList.add(
        "hidden"
    );


    createShips();


    updateHUD();


    gameLoop();

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    resetGame();

}


/* =========================================================
   RESTART BUTTON
========================================================= */

restartButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =========================================================
   LIBRARY BUTTON
========================================================= */

libraryButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html";

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeGame() {

    try {

        loadingText.textContent =
            "Loading vocabulary set from Firebase...";


        loadingDetails.textContent =
            "";


        const data =
            await loadVocabularySet(
                setId
            );


        /*
           Validate BEFORE starting.
        */

        validateVocabulary(
            data.items
        );


        vocabList =
            data.items;


        listTitle =
            data.title;


        listNameDisplay.textContent =
            listTitle;


        /*
           Start the game.
        */

        hideLoading();


        startGame();

    }

    catch (
        error
    ) {

        console.error(
            "BlastWord initialization error:",
            error
        );


        showLoadError(
            error.message ||
            "An unexpected error prevented BlastWord from starting."
        );

    }

}


/* =========================================================
   START
========================================================= */

initializeGame();


</script>
