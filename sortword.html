<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SortWord | Vocabulary Arcade</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #334155 0%,
                    #111827 55%,
                    #020617 100%
                );
        }


        /* =====================================================
           APP
        ===================================================== */

        #app {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        #header {

            flex-shrink: 0;

            width: 100%;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding:
                12px 18px;

            background:
                rgba(15, 23, 42, 0.97);

            border-bottom:
                2px solid
                rgba(255, 255, 255, 0.10);

            box-shadow:
                0 4px 16px
                rgba(0, 0, 0, 0.35);

            z-index: 50;
        }


        #titleArea {

            min-width: 0;

            display: flex;
            flex-direction: column;
        }


        #gameTitle {

            margin: 0;

            font-size:
                clamp(
                    24px,
                    3vw,
                    34px
                );

            font-weight: 900;

            letter-spacing: 1px;
        }


        #listName {

            margin-top: 3px;

            max-width: 45vw;

            color: #cbd5e1;

            font-size: 14px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =====================================================
           HUD
        ===================================================== */

        #hud {

            display: flex;

            align-items: center;
            justify-content: flex-end;

            gap: 8px;

            flex-wrap: wrap;
        }


        .hudBox {

            min-width: 74px;

            padding:
                7px 10px;

            border-radius: 9px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            text-align: center;
        }


        .hudLabel {

            font-size: 10px;

            color: #94a3b8;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        .hudValue {

            margin-top: 2px;

            font-size: 19px;

            font-weight: 900;
        }


        #timerBox.warning {

            background:
                rgba(245, 158, 11, 0.20);

            border-color:
                rgba(245, 158, 11, 0.55);
        }


        #timerBox.danger {

            background:
                rgba(239, 68, 68, 0.23);

            border-color:
                rgba(239, 68, 68, 0.70);
        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        #gameArea {

            position: relative;

            flex: 1;

            min-height: 0;

            width: 100%;

            overflow: hidden;
        }


        /* =====================================================
           INSTRUCTIONS
        ===================================================== */

        #instructions {

            position: absolute;

            top: 12px;

            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(
                    90%,
                    850px
                );

            padding:
                9px 15px;

            border-radius: 11px;

            background:
                rgba(15, 23, 42, 0.74);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            color: #e2e8f0;

            text-align: center;

            font-size: 14px;

            z-index: 10;
        }


        /* =====================================================
           CATEGORY AREA
        ===================================================== */

        #categoryArea {

            position: absolute;

            top: 61px;

            left: 18px;
            right: 18px;

            bottom: 157px;

            display: grid;

            gap: 13px;

            align-items: stretch;

            z-index: 2;
        }


        /* =====================================================
           CATEGORY COLUMN
        ===================================================== */

        .categoryColumn {

            position: relative;

            min-width: 0;

            overflow-y: auto;

            overflow-x: hidden;

            border-radius: 16px;

            border:
                3px solid
                rgba(255, 255, 255, 0.32);

            box-shadow:
                0 8px 20px
                rgba(0, 0, 0, 0.22),

                inset 0 0 22px
                rgba(0, 0, 0, 0.15);

            transition:
                transform 0.12s ease,
                border-color 0.12s ease,
                filter 0.12s ease;
        }


        /* =====================================================
           CATEGORY COLORS
           Inspired by Library game buttons
           ===================================================== */

        .categoryColor0 {

            background:
                linear-gradient(
                    180deg,
                    rgba(20, 120, 188, 0.92),
                    rgba(13, 76, 120, 0.88)
                );
        }


        .categoryColor1 {

            background:
                linear-gradient(
                    180deg,
                    rgba(26, 154, 95, 0.92),
                    rgba(18, 101, 63, 0.88)
                );
        }


        .categoryColor2 {

            background:
                linear-gradient(
                    180deg,
                    rgba(116, 55, 209, 0.92),
                    rgba(75, 34, 137, 0.88)
                );
        }


        .categoryColor3 {

            background:
                linear-gradient(
                    180deg,
                    rgba(224, 26, 116, 0.92),
                    rgba(145, 15, 73, 0.88)
                );
        }


        .categoryColor4 {

            background:
                linear-gradient(
                    180deg,
                    rgba(229, 155, 32, 0.94),
                    rgba(151, 96, 13, 0.88)
                );
        }


        /* =====================================================
           DROP HIGHLIGHT
        ===================================================== */

        .categoryColumn.dragOver {

            transform:
                scale(1.015);

            border-color:
                #ffffff;

            filter:
                brightness(1.15);

            box-shadow:
                0 0 0 4px
                rgba(255, 255, 255, 0.20),

                0 10px 30px
                rgba(0, 0, 0, 0.35);
        }


        /* =====================================================
           CATEGORY HEADER
        ===================================================== */

        .categoryHeader {

            position: sticky;

            top: 0;

            z-index: 4;

            min-height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                9px 12px;

            background:
                rgba(15, 23, 42, 0.66);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.18);

            border-radius:
                12px 12px 0 0;

            text-align: center;

            font-size:
                clamp(
                    15px,
                    2vw,
                    22px
                );

            font-weight: 900;

            text-shadow:
                0 2px 4px
                rgba(0, 0, 0, 0.35);

            word-break: break-word;
        }


        /* =====================================================
           CATEGORY CONTENT
        ===================================================== */

        .categoryContent {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: flex-start;

            padding:
                12px 8px 45px;
        }


        /* =====================================================
           CATEGORY HINT
        ===================================================== */

        .categoryHint {

            position: absolute;

            left: 10px;
            right: 10px;

            bottom: 13px;

            text-align: center;

            color:
                rgba(255, 255, 255, 0.42);

            font-size: 11px;

            pointer-events: none;

            z-index: 2;
        }


        /* =====================================================
           SORTED OVALS
           
           EXACT SAME BASIC SIZE AS DRAGGABLE OVAL
        ===================================================== */

        .sortedWord {

            width:
                min(
                    220px,
                    calc(
                        100% - 16px
                    )
                );

            min-width: 170px;

            height: 58px;

            min-height: 58px;

            flex:
                0 0 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                6px 0;

            padding:
                8px 15px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #dbeafe
                );

            border:
                3px solid
                rgba(255, 255, 255, 0.98);

            color: #0f172a;

            font-size: 14px;

            font-weight: 900;

            text-align: center;

            box-shadow:
                0 5px 12px
                rgba(0, 0, 0, 0.30);

            word-break: break-word;

            animation:
                sortedPop 0.18s ease-out;
        }


        @keyframes sortedPop {

            from {

                opacity: 0;

                transform:
                    scale(0.90);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }

        }


        /* =====================================================
           WORD DOCK
        ===================================================== */

        #wordDock {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 145px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(2, 6, 23, 0.10),
                    rgba(2, 6, 23, 0.96)
                );

            border-top:
                2px solid
                rgba(255, 255, 255, 0.08);

            z-index: 100;

            pointer-events: none;
        }


        #wordDockLabel {

            position: absolute;

            top: 7px;

            color: #94a3b8;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =====================================================
           DRAGGABLE WORD

           FIXED SIZE.
           NO SCALE TRANSFORM DURING DRAG.
        ===================================================== */

        #wordCard {

            position: fixed;

            left: 50%;

            bottom: 38px;

            width: 220px;

            min-width: 220px;

            max-width: 220px;

            height: 58px;

            min-height: 58px;

            max-height: 58px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                8px 15px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #dbeafe
                );

            border:
                4px solid
                #ffffff;

            color: #0f172a;

            font-size:
                clamp(
                    16px,
                    2.3vw,
                    22px
                );

            font-weight: 900;

            text-align: center;

            cursor: grab;

            user-select: none;

            touch-action: none;

            overflow: hidden;

            word-break: break-word;

            box-shadow:
                0 10px 26px
                rgba(0, 0, 0, 0.45);

            z-index: 1000;

            pointer-events: auto;
        }


        #wordCard.dragging {

            cursor: grabbing;

            /*
               IMPORTANT:
               No scaling here.
               The oval remains exactly
               the same size.
            */

            box-shadow:
                0 16px 38px
                rgba(0, 0, 0, 0.58),

                0 0 0 4px
                rgba(255, 255, 255, 0.18);
        }


        #wordCard.hidden {

            display: none;
        }


        /* =====================================================
           FEEDBACK
        ===================================================== */

        #feedback {

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(0.8);

            padding:
                11px 22px;

            border-radius: 999px;

            font-size: 21px;

            font-weight: 900;

            opacity: 0;

            pointer-events: none;

            z-index: 1500;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
        }


        #feedback.show {

            opacity: 1;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(1);
        }


        #feedback.correct {

            background:
                rgba(22, 163, 74, 0.97);

            color: white;
        }


        #feedback.incorrect {

            background:
                rgba(220, 38, 38, 0.97);

            color: white;
        }


        /* =====================================================
           STATUS SCREEN
        ===================================================== */

        #statusScreen {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(2, 6, 23, 0.96);

            z-index: 3000;
        }


        #statusBox {

            width:
                min(
                    90%,
                    650px
                );

            padding: 32px;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    #1e293b,
                    #0f172a
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.50);

            text-align: center;
        }


        #statusTitle {

            margin:
                0 0 12px;

            font-size: 28px;

            font-weight: 900;
        }


        #statusMessage {

            margin: 0;

            color: #cbd5e1;

            font-size: 16px;

            line-height: 1.6;
        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        #gameOver {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(2, 6, 23, 0.94);

            z-index: 4000;
        }


        #gameOver.show {

            display: flex;
        }


        #gameOverBox {

            width:
                min(
                    92%,
                    720px
                );

            padding: 32px;

            border-radius: 22px;

            background:
                linear-gradient(
                    180deg,
                    #1e293b,
                    #0f172a
                );

            border:
                2px solid
                rgba(255, 255, 255, 0.11);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.55);

            text-align: center;
        }


        #gameOverTitle {

            margin: 0;

            font-size:
                clamp(
                    34px,
                    6vw,
                    54px
                );

            font-weight: 900;
        }


        #gameOverList {

            margin:
                10px 0 24px;

            color: #cbd5e1;

            font-size: 17px;
        }


        #resultsGrid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap: 11px;

            margin-bottom: 23px;
        }


        .resultBox {

            padding: 13px;

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.09);
        }


        .resultLabel {

            color: #94a3b8;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        .resultValue {

            margin-top: 5px;

            font-size: 27px;

            font-weight: 900;
        }


        #gameOverMessage {

            margin-bottom: 24px;

            color: #e2e8f0;

            font-size: 16px;

            line-height: 1.5;
        }


        #buttonRow {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .actionButton {

            min-width: 145px;

            padding:
                13px 22px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }


        .actionButton:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.08);
        }


        #playAgainButton {

            background:
                #2563eb;

            color: white;
        }


        #libraryButton {

            background:
                white;

            color:
                #111827;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            #header {

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

                padding:
                    9px 12px;
            }


            #listName {

                max-width: 85vw;
            }


            #hud {

                width: 100%;

                justify-content:
                    space-between;
            }


            .hudBox {

                flex: 1;

                min-width: 0;
            }


            #instructions {

                top: 8px;

                font-size: 12px;
            }


            #categoryArea {

                top: 53px;

                left: 9px;
                right: 9px;

                bottom: 142px;

                gap: 8px;
            }


            .categoryHeader {

                min-height: 52px;

                font-size: 13px;
            }


            #wordDock {

                height: 132px;
            }


            #wordCard {

                bottom: 34px;
            }


            #resultsGrid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }


        @media (max-width: 520px) {

            #hud {

                gap: 4px;
            }


            .hudBox {

                padding:
                    6px 4px;
            }


            .hudLabel {

                font-size: 8px;
            }


            .hudValue {

                font-size: 16px;
            }


            #categoryArea {

                display: flex;

                overflow-x: auto;
            }


            .categoryColumn {

                flex:
                    1 0 155px;

                min-width: 155px;
            }


            #wordCard {

                width: 210px;

                min-width: 210px;

                max-width: 210px;

                height: 58px;

                min-height: 58px;

                max-height: 58px;
            }


            #gameOverBox {

                padding:
                    24px 16px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header id="header">


        <div id="titleArea">

            <h1 id="gameTitle">
                SortWord
            </h1>


            <div id="listName">
                Loading vocabulary...
            </div>

        </div>


        <div id="hud">


            <div class="hudBox">

                <div class="hudLabel">
                    Score
                </div>

                <div
                    class="hudValue"
                    id="scoreValue"
                >
                    0
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Accuracy
                </div>

                <div
                    class="hudValue"
                    id="accuracyValue"
                >
                    100%
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Streak
                </div>

                <div
                    class="hudValue"
                    id="streakValue"
                >
                    0
                </div>

            </div>


            <div
                class="hudBox"
                id="timerBox"
            >

                <div class="hudLabel">
                    Time
                </div>

                <div
                    class="hudValue"
                    id="timerValue"
                >
                    60
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Words
                </div>

                <div
                    class="hudValue"
                    id="wordsValue"
                >
                    0/0
                </div>

            </div>


        </div>


    </header>


    <!-- =====================================================
         GAME AREA
    ===================================================== -->

    <main id="gameArea">


        <div id="instructions">
            Drag each word into the category where it belongs.
        </div>


        <div id="categoryArea">
        </div>


        <div id="feedback">
        </div>


    </main>


</div>


<!-- =====================================================
     WORD DOCK
===================================================== -->

<div id="wordDock">

    <div id="wordDockLabel">
        Drag this word
    </div>


    <div
        id="wordCard"
        tabindex="0"
    >
        Loading...
    </div>

</div>


<!-- =====================================================
     STATUS SCREEN
===================================================== -->

<div id="statusScreen">

    <div id="statusBox">

        <h2 id="statusTitle">
            Loading SortWord
        </h2>


        <p id="statusMessage">
            Loading your vocabulary set...
        </p>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="gameOver">

    <div id="gameOverBox">


        <h2 id="gameOverTitle">
            Round Complete!
        </h2>


        <div id="gameOverList">
            Vocabulary Set
        </div>


        <div id="resultsGrid">


            <div class="resultBox">

                <div class="resultLabel">
                    Score
                </div>

                <div
                    class="resultValue"
                    id="finalScore"
                >
                    0
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Accuracy
                </div>

                <div
                    class="resultValue"
                    id="finalAccuracy"
                >
                    0%
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Correct
                </div>

                <div
                    class="resultValue"
                    id="finalCorrect"
                >
                    0
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Best Streak
                </div>

                <div
                    class="resultValue"
                    id="finalStreak"
                >
                    0
                </div>

            </div>


        </div>


        <div id="gameOverMessage">
        </div>


        <div id="buttonRow">


            <button
                type="button"
                class="actionButton"
                id="playAgainButton"
            >
                PLAY AGAIN
            </button>


            <button
                type="button"
                class="actionButton"
                id="libraryButton"
            >
                LIBRARY
            </button>


        </div>


    </div>

</div>

     FIREBASE / GAME
===================================================== -->

/* =====================================================
   DOM REFERENCES

const listNameEl =
    document.getElementById(
        "listName"

const scoreValue =
    document.getElementById(

const accuracyValue =
    document.getElementById(
        "accuracyValue"

const streakValue =
    document.getElementById(
        "streakValue"

const timerValue =
    document.getElementById(
        "timerValue"

    document.getElementById(
        "timerBox"
    );

const wordsValue =
    document.getElementById(
        "wordsValue"
    );

const categoryArea =
    document.getElementById(
        "categoryArea"
    );

const wordCard =
    document.getElementById(
        "wordCard"
    );

const feedback =
    document.getElementById(

    document.getElementById(

/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =====================================================
   LOAD VOCABULARY SET
===================================================== */

async function loadVocabularySet(
    id
) {

    const reference =
        doc(
            db,
            COLLECTION_NAME,
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();


    let items =
        [];


    /*
       Current format.
    */

    if (
        Array.isArray(
            data.items
        )
    ) {

        items =
            data.items;

    }


    /*
       Legacy format.
    */

    else if (
        Array.isArray(
            data.terms
        )
    ) {

        items =
            data.terms;

    }


    else if (
        typeof data.terms ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    data.terms
                );

        }

        catch {

            throw new Error(
                "The vocabulary list contains invalid data."
            );

        }

    }


    return {

        title:
            data.title ||
            "Vocabulary Set",

        items

    };

}


/* =====================================================
   VALIDATE VOCABULARY
===================================================== */

function validateVocabulary(
    items
) {

    if (
        !Array.isArray(
            items
        )
    ) {

        throw new Error(
            "The vocabulary data is not usable."
        );

    }


    const cleaned =
        items
            .map(
                item => ({

                    word:
                        String(
                            item?.word ||
                            ""
                        ).trim(),

                    category:
                        String(
                            item?.definition ||
                            item?.meaning ||
                            ""
                        ).trim()

                })
            )
            .filter(
                item =>
                    item.word &&
                    item.category
            );


    if (
        cleaned.length < 2
    ) {

        throw new Error(
            "SortWord needs at least two vocabulary words with category definitions."
        );

    }


    /*
       Create unique categories.
    */

    const categoryMap =
        new Map();


    cleaned.forEach(
        item => {

            const key =
                normalizeText(
                    item.category
                );


            if (
                !categoryMap.has(
                    key
                )
            ) {

                categoryMap.set(
                    key,
                    item.category
                );

            }

        }
    );


    const categoryEntries =
        [...categoryMap.entries()];


    if (
        categoryEntries.length <
        MIN_CATEGORIES
    ) {

        throw new Error(
            "SortWord needs at least two different categories."
        );

    }


    if (
        categoryEntries.length >
        MAX_CATEGORIES
    ) {

        throw new Error(
            `This vocabulary set contains ${categoryEntries.length} different categories. SortWord supports no more than five categories.`
        );

    }


    /*
       Make sure each word appears only once.
    */

    const wordMap =
        new Map();


    for (
        const item of cleaned
    ) {

        const key =
            normalizeText(
                item.word
            );


        if (
            wordMap.has(
                key
            )
        ) {

            throw new Error(
                `The word "${item.word}" appears more than once. Remove the duplicate before using SortWord.`
            );

        }


        wordMap.set(
            key,
            normalizeText(
                item.category
            )
        );

    }


    return {

        items:
            cleaned,

        categories:
            categoryEntries

    };

}

/* =====================================================

===================================================== */

function createCategories(
    categoryEntries
) {

    categories =

            entry =>
                entry[1]
        );


    categoryArea.style.gridTemplateColumns =
        `repeat(
            ${categories.length},

    categories.forEach(
        (
            category,

            const column =
                document.createElement(
                    "div"
                );


            column.className =
                "categoryColumn " +
                `categoryColor${index}`;


            column.dataset.category =
                normalizeText(
                    category
                );


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "categoryHeader";


            header.textContent =
                category;


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "categoryContent";


            const hint =
                document.createElement(
                    "div"
                );


            hint.className =
                "categoryHint";


            hint.textContent =
                "Drop words here";


            column.appendChild(
                header
            );


            column.appendChild(
                content
            );


            column.appendChild(
                hint
            );


            categoryArea.appendChild(
                column
            );

        }
    );

}


/* =====================================================
   BUILD ROUND
===================================================== */

function buildRound() {

    roundVocabulary =
        shuffle(
            sourceVocabulary
        ).slice(
            0,
            MAX_WORDS
        );

}

   UPDATE HUD
===================================================== */

function updateHUD() {

    scoreValue.textContent =
        score;


    streakValue.textContent =
        streak;


    timerValue.textContent =

    wordsValue.textContent =
        `${currentIndex}/${roundVocabulary.length}`;


    const totalAnswered =
        correctCount +
        incorrectCount;


    const accuracy =
        totalAnswered > 0

            ? Math.round(
                (
                    correctCount /

            )

    );

    ) {

        );

    }

    else if (

    ) {

}


/* =====================================================
   RESET WORD CARD
===================================================== */

function resetWordCard() {

    wordCard.classList.remove(
        "dragging"
    );


    /*
       Always return the card to
       exactly the same dimensions.
    */

    wordCard.style.width =
        "220px";

    wordCard.style.minWidth =
        "220px";

    wordCard.style.maxWidth =
        "220px";

    wordCard.style.height =
        "58px";

    wordCard.style.minHeight =
        "58px";

    wordCard.style.maxHeight =

    wordCard.style.left =

/* =====================================================
   SHOW CURRENT WORD
===================================================== */

function showCurrentWord() {

    if (
        currentIndex >=
        roundVocabulary.length
    ) {

        endGame(
            "You sorted every word!"
        );

        return;

    }


    currentWord =
        roundVocabulary[
            currentIndex
        ];


    wordCard.textContent =
        currentWord.word;


    wordCard.classList.remove(
        "hidden"
    );


    resetWordCard();


    updateHUD();

}


/* =====================================================
   GET CATEGORY UNDER POINTER
=====================================================

   IMPORTANT FIX:

   elementsFromPoint() returns ALL elements
   at the pointer location.

   Because the draggable oval is on top,
   elementFromPoint() was finding the oval
   instead of the category.

   We now search through the entire stack
   until we find .categoryColumn.
===================================================== */

function getDropTarget(
    x,
    y
) {

    const elements =
        document.elementsFromPoint(
            x,
            y
        );


    for (
        const element
        of elements
    ) {

        const category =
            element.closest(
                ".categoryColumn"
            );


        if (
            category
        ) {

            return category;

        }

    }


    return null;

}


/* =====================================================
   HIGHLIGHT CATEGORY
===================================================== */

function highlightDropZone(
    x,
    y
) {

    clearDropHighlights();


    const target =
        getDropTarget(
            x,
            y
        );


    if (
        target
    ) {

        target.classList.add(
            "dragOver"
        );

    }

}


/* =====================================================
   CLEAR CATEGORY HIGHLIGHTS
===================================================== */

function clearDropHighlights() {

    document
        .querySelectorAll(
            ".categoryColumn"
        )
        .forEach(
            column => {

                column.classList.remove(
                    "dragOver"
                );

            }
        );

}


/* =====================================================
   POINTER DOWN
===================================================== */

wordCard.addEventListener(
    "pointerdown",
    event => {

        if (
            !gameIsRunning ||
            !currentWord ||
            isDragging
        ) {

            return;

        }


        event.preventDefault();


        isDragging =
            true;


        activePointerId =
            event.pointerId;


        wordCard.setPointerCapture(
            event.pointerId
        );


        const rect =
            wordCard.getBoundingClientRect();


        const centerX =
            rect.left +
            (
                rect.width /
                2
            );


        const centerY =
            rect.top +
            (
                rect.height /
                2
            );


        dragOffsetX =
            event.clientX -
            centerX;


        dragOffsetY =
            event.clientY -
            centerY;


        /*
           Switch to fixed positioning.
        */

        wordCard.style.position =
            "fixed";


        wordCard.style.left =
            `${centerX}px`;


        wordCard.style.top =
            `${centerY}px`;


        wordCard.style.bottom =
            "";


        /*
           Lock dimensions.
        */

        wordCard.style.width =
            "220px";

        wordCard.style.minWidth =
            "220px";

        wordCard.style.maxWidth =
            "220px";

        wordCard.style.height =
            "58px";

        wordCard.style.minHeight =
            "58px";

        wordCard.style.maxHeight =
            "58px";


        wordCard.style.transform =
            "translate(-50%, -50%)";


        /*
           No scaling while dragging.
        */

        wordCard.classList.add(
            "dragging"
        );


        highlightDropZone(
            centerX,
            centerY
        );

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

wordCard.addEventListener(
    "pointermove",
    event => {

        if (
            !isDragging ||
            event.pointerId !==
                activePointerId
        ) {

            return;

        }


        event.preventDefault();


        let centerX =
            event.clientX -
            dragOffsetX;


        let centerY =
            event.clientY -
            dragOffsetY;


        /*
           Fixed dimensions mean we always
           know the half-width and half-height.
        */

        const halfWidth =
            110;


        const halfHeight =
            29;


        const padding =
            8;


        /*
           Keep the entire oval on screen.
        */

        centerX =
            Math.max(
                halfWidth + padding,
                Math.min(
                    window.innerWidth -
                        halfWidth -
                        padding,
                    centerX
                )
            );


        centerY =
            Math.max(
                halfHeight + padding,
                Math.min(
                    window.innerHeight -
                        halfHeight -
                        padding,
                    centerY
                )
            );


        wordCard.style.left =
            `${centerX}px`;


        wordCard.style.top =
            `${centerY}px`;


        wordCard.style.bottom =
            "";


        wordCard.style.width =
            "220px";

        wordCard.style.minWidth =
            "220px";

        wordCard.style.maxWidth =
            "220px";

        wordCard.style.height =
            "58px";

        wordCard.style.minHeight =
            "58px";

        wordCard.style.maxHeight =
            "58px";


        wordCard.style.transform =
            "translate(-50%, -50%)";


        highlightDropZone(
            centerX,
            centerY
        );

    }
);


/* =====================================================
   POINTER UP
===================================================== */

wordCard.addEventListener(
    "pointerup",
    event => {

        if (
            !isDragging ||
            event.pointerId !==
                activePointerId
        ) {

            return;

        }


        event.preventDefault();


        finishDrag();

    }
);


/* =====================================================
   POINTER CANCEL
===================================================== */

wordCard.addEventListener(
    "pointercancel",
    event => {

        if (
            event.pointerId !==
                activePointerId
        ) {

            return;

        }


        finishDrag();

    }
);


/* =====================================================
   FINISH DRAG
===================================================== */

function finishDrag() {

    const rect =
        wordCard.getBoundingClientRect();


    const centerX =
        rect.left +
        (
            rect.width /
            2
        );


    const centerY =
        rect.top +
        (
            rect.height /
            2
        );


    /*
       Find category using ALL elements
       at the pointer location.
    */

    const target =
        getDropTarget(
            centerX,
            centerY
        );


    isDragging =
        false;


    activePointerId =
        null;


    wordCard.classList.remove(
        "dragging"
    );


    clearDropHighlights();


    if (
        target
    ) {

        handleDrop(
            target
        );

    }

    else {

        returnWordToDock();

    }

}


/* =====================================================
   HANDLE DROP
===================================================== */

function handleDrop(
    targetColumn
) {

    if (
        !currentWord
    ) {

        return;

    }


    const selectedCategory =
        normalizeText(
            targetColumn.dataset.category
        );


    const correctCategory =
        normalizeText(
            currentWord.category
        );


    if (
        selectedCategory ===
        correctCategory
    ) {

        handleCorrectDrop(
            targetColumn
        );

    }

    else {

        handleIncorrectDrop();

    }

}


/* =====================================================
   CORRECT DROP
===================================================== */

function handleCorrectDrop(
    targetColumn
) {

    correctCount++;

    streak++;


    bestStreak =
        Math.max(
            bestStreak,
            streak
        );


    const points =
        100 +
        (
            (
                streak -
                1
            ) *
            10
        );


    score +=
        points;


    /*
       Find the content area inside
       the correct category.
    */

    const content =
        targetColumn.querySelector(
            ".categoryContent"
        );


    /*
       Create a permanent copy of
       the word oval.
    */

    const sortedWord =
        document.createElement(
            "div"
        );


    sortedWord.className =
        "sortedWord";


    sortedWord.textContent =
        currentWord.word;


    /*
       Explicitly lock the placed oval
       dimensions to the same size.
    */

    sortedWord.style.width =
        "220px";

    sortedWord.style.minWidth =
        "220px";

    sortedWord.style.maxWidth =
        "220px";

    sortedWord.style.height =
        "58px";

    sortedWord.style.minHeight =
        "58px";

    sortedWord.style.maxHeight =
        "58px";


    content.appendChild(
        sortedWord
    );


    /*
       Update feedback.
    */

    showFeedback(
        `✓ Correct! +${points}`,
        true
    );


    /*
       Hide the draggable word only
       after its permanent copy has
       been successfully placed.
    */

    wordCard.classList.add(
        "hidden"
    );


    currentIndex++;


    updateHUD();


    setTimeout(
        () => {

            if (
                gameIsRunning
            ) {

                showCurrentWord();

            }

        },
        350
    );

}


/* =====================================================
   INCORRECT DROP
===================================================== */

function handleIncorrectDrop() {

    incorrectCount++;

    streak = 0;


    score =
        Math.max(
            0,
            score - 25
        );


    showFeedback(
        "✗ Try again! -25",
        false
    );


    updateHUD();


    returnWordToDock();

}


/* =====================================================
   RETURN WORD TO DOCK
===================================================== */

function returnWordToDock() {

    /*
       Keep fixed dimensions.
    */

    wordCard.style.width =
        "220px";

    wordCard.style.minWidth =
        "220px";

    wordCard.style.maxWidth =
        "220px";

    wordCard.style.height =
        "58px";

    wordCard.style.minHeight =
        "58px";

    wordCard.style.maxHeight =
        "58px";


    wordCard.style.left =
        "50%";


    wordCard.style.top =
        "";


    wordCard.style.bottom =
        "38px";


    wordCard.style.transform =
        "translateX(-50%)";


    wordCard.classList.remove(
        "dragging"
    );

}


/* =====================================================
   FEEDBACK
===================================================== */

let feedbackTimer =
    null;


function showFeedback(
    message,
    correct
) {

    feedback.textContent =
        message;


    feedback.classList.remove(
        "correct",
        "incorrect",
        "show"
    );


    void feedback.offsetWidth;


    feedback.classList.add(
        correct
            ? "correct"
            : "incorrect"
    );


    feedback.classList.add(
        "show"
    );


    clearTimeout(
        feedbackTimer
    );


    feedbackTimer =
        setTimeout(
            () => {

                feedback.classList.remove(
                    "show"
                );

            },
            700
        );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            () => {

                if (
                    !gameIsRunning
                ) {

                    return;

                }


                timeLeft--;


                updateHUD();


                if (
                    timeLeft <= 0
                ) {

                    endGame(
                        "Time's up!"
                    );

                }

            },
            1000
        );

}


/* =====================================================
   END GAME
===================================================== */

function endGame(
    message
) {

    if (
        !gameIsRunning
    ) {

        return;

    }


    gameIsRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearDropHighlights();


    wordCard.classList.add(
        "hidden"
    );


    const totalAnswered =
        correctCount +
        incorrectCount;


    const accuracy =
        totalAnswered > 0

            ? Math.round(
                (
                    correctCount /
                    totalAnswered
                ) *
                100
            )

            : 100;


    let completionBonus =
        0;


    /*
       Finish all words:
       10 points for every second remaining.
    */

    if (
        currentIndex >=
        roundVocabulary.length
    ) {

        completionBonus =
            timeLeft *
            10;


        score +=
            completionBonus;

    }


    finalScore.textContent =
        score;


    finalAccuracy.textContent =
        `${accuracy}%`;


    finalCorrect.textContent =
        correctCount;


    finalStreak.textContent =
        bestStreak;


    gameOverList.textContent =
        listNameEl.textContent;


    if (
        completionBonus > 0
    ) {

        gameOverMessage.textContent =
            `${message} You completed the entire round and earned a ${completionBonus}-point time bonus!`;

    }

    else {

        gameOverMessage.textContent =
            message;

    }


    gameOver.classList.add(
        "show"
    );

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    clearInterval(
        timerInterval
    );


    score = 0;

    correctCount = 0;

    incorrectCount = 0;

    streak = 0;

    bestStreak = 0;

    currentIndex = 0;

    timeLeft =
        ROUND_TIME;

    currentWord =
        null;


    gameIsRunning =
        true;


    gameOver.classList.remove(
        "show"
    );


    /*
       Clear all previously placed words.
    */

    categoryArea
        .querySelectorAll(
            ".sortedWord"
        )
        .forEach(
            element =>
                element.remove()
        );


    buildRound();


    updateHUD();


    hideStatus();


    showCurrentWord();


    startTimer();

}


/* =====================================================
   PLAY AGAIN
===================================================== */

playAgainButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =====================================================
   LIBRARY BUTTON
===================================================== */

libraryButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html";

    }
);


/* =====================================================
   INITIALIZE GAME
===================================================== */

async function initializeGame() {

    if (
        !setId
    ) {

        showStatus(

            "No Vocabulary Set Selected",

            "SortWord must be opened from the Vocabulary Arcade Library with a vocabulary set ID."

        );

        return;

    }


    try {

        showStatus(

            "Loading SortWord",

            "Loading your vocabulary set from Firebase..."

        );


        const data =
            await loadVocabularySet(
                setId
            );


        listNameEl.textContent =
            data.title;


        const validation =
            validateVocabulary(
                data.items
            );


        sourceVocabulary =
            validation.items;


        createCategories(
            validation.categories
        );


        startGame();

    }

    catch (
        error
    ) {

        console.error(
            "SORTWORD ERROR:",
            error
        );


        showStatus(

            "Unable to Start SortWord",

            error.message ||
            "There was a problem loading this vocabulary set."

        );

    }

}


/* =====================================================
   START
===================================================== */

initializeGame();
