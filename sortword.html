<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SortWord | Vocabulary Arcade</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #334155 0%,
                    #111827 52%,
                    #020617 100%
                );
        }


        /* =====================================================
           APPLICATION
        ===================================================== */

        #app {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        #header {

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding: 12px 18px;

            background:
                rgba(15, 23, 42, 0.96);

            border-bottom:
                2px solid
                rgba(255, 255, 255, 0.10);

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.35);

            z-index: 50;
        }


        #titleArea {

            display: flex;
            flex-direction: column;

            min-width: 0;
        }


        #gameTitle {

            margin: 0;

            font-size:
                clamp(
                    24px,
                    3vw,
                    34px
                );

            font-weight: 900;

            letter-spacing: 1px;
        }


        #listName {

            margin-top: 3px;

            max-width: 45vw;

            color: #cbd5e1;

            font-size: 14px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =====================================================
           HUD
        ===================================================== */

        #hud {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 8px;

            flex-wrap: wrap;
        }


        .hudBox {

            min-width: 74px;

            padding: 7px 10px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.11);

            border-radius: 9px;

            text-align: center;
        }


        .hudLabel {

            font-size: 10px;

            color: #94a3b8;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        .hudValue {

            margin-top: 2px;

            font-size: 19px;

            font-weight: 900;
        }


        #timerBox.warning {

            background:
                rgba(245, 158, 11, 0.18);

            border-color:
                rgba(245, 158, 11, 0.5);
        }


        #timerBox.danger {

            background:
                rgba(239, 68, 68, 0.22);

            border-color:
                rgba(239, 68, 68, 0.7);
        }


        /* =====================================================
           GAME AREA
        ===================================================== */

        #gameArea {

            position: relative;

            flex: 1;

            width: 100%;
            height: 100%;

            min-height: 0;

            overflow: hidden;
        }


        /* =====================================================
           INSTRUCTIONS
        ===================================================== */

        #instructions {

            position: absolute;

            top: 14px;
            left: 50%;

            transform:
                translateX(-50%);

            width: min(
                90%,
                850px
            );

            padding: 9px 15px;

            border-radius: 11px;

            background:
                rgba(15, 23, 42, 0.70);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            color: #e2e8f0;

            text-align: center;

            font-size: 14px;

            z-index: 5;
        }


        /* =====================================================
           CATEGORY AREA
        ===================================================== */

        #categoryArea {

            position: absolute;

            top: 67px;
            left: 18px;
            right: 18px;

            bottom: 155px;

            display: grid;

            gap: 13px;

            align-items: stretch;

            z-index: 2;
        }


        .categoryColumn {

            position: relative;

            min-width: 0;

            border:
                3px dashed
                rgba(255, 255, 255, 0.22);

            border-radius: 16px;

            background:
                linear-gradient(
                    180deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.025)
                );

            box-shadow:
                inset
                0 0 20px
                rgba(0, 0, 0, 0.20),

                0 7px 18px
                rgba(0, 0, 0, 0.18);

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }


        .categoryColumn.dragOver {

            border-color: #facc15;

            background:
                linear-gradient(
                    180deg,
                    rgba(250, 204, 21, 0.20),
                    rgba(250, 204, 21, 0.06)
                );

            transform:
                scale(1.012);
        }


        .categoryHeader {

            min-height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 9px;

            background:
                rgba(15, 23, 42, 0.72);

            border-radius:
                12px 12px 0 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.11);

            text-align: center;

            font-size:
                clamp(
                    15px,
                    2vw,
                    22px
                );

            font-weight: 900;

            word-break: break-word;
        }


        .categoryHint {

            position: absolute;

            left: 12px;
            right: 12px;

            bottom: 18px;

            text-align: center;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.26);

            pointer-events: none;
        }


        /* =====================================================
           SORTED WORDS
        ===================================================== */

        .sortedWord {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin: 5px;

            min-height: 38px;

            padding: 7px 13px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #dbeafe
                );

            color: #0f172a;

            font-size: 13px;

            font-weight: 800;

            box-shadow:
                0 4px 9px
                rgba(0, 0, 0, 0.20);

            animation:
                sortedPop 0.18s ease-out;
        }


        @keyframes sortedPop {

            from {

                opacity: 0;

                transform:
                    scale(0.7);
            }

            to {

                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =====================================================
           BOTTOM WORD DOCK
        ===================================================== */

        #wordDock {

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 145px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    180deg,
                    rgba(2, 6, 23, 0.08),
                    rgba(2, 6, 23, 0.95)
                );

            border-top:
                2px solid
                rgba(255, 255, 255, 0.08);

            z-index: 20;

            pointer-events: none;
        }


        #wordDockLabel {

            position: absolute;

            top: 8px;

            font-size: 11px;

            color: #94a3b8;

            text-transform: uppercase;

            letter-spacing: 1px;
        }


        /* =====================================================
           WORD CARD

           IMPORTANT:
           The card is fixed to the viewport.
           This prevents it from disappearing while dragging.
        ===================================================== */

        #wordCard {

            position: fixed;

            left: 50%;
            bottom: 38px;

            transform:
                translateX(-50%);

            min-width: 170px;

            max-width:
                min(
                    70vw,
                    560px
                );

            min-height: 60px;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                12px 28px;

            border-radius: 999px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #dbeafe
                );

            border:
                4px solid
                #ffffff;

            color: #0f172a;

            font-size:
                clamp(
                    18px,
                    2.8vw,
                    27px
                );

            font-weight: 900;

            text-align: center;

            user-select: none;

            touch-action: none;

            cursor: grab;

            box-shadow:
                0 10px 28px
                rgba(0, 0, 0, 0.42);

            z-index: 1000;

            pointer-events: auto;

            white-space: normal;

            transition:
                box-shadow 0.12s ease,
                transform 0.12s ease;
        }


        #wordCard:hover {

            box-shadow:
                0 13px 32px
                rgba(0, 0, 0, 0.50);
        }


        #wordCard.dragging {

            cursor: grabbing;

            box-shadow:
                0 20px 42px
                rgba(0, 0, 0, 0.58);

            transform:
                translate(-50%, -50%)
                scale(1.06);
        }


        #wordCard.hidden {

            display: none;
        }


        /* =====================================================
           FEEDBACK
        ===================================================== */

        #feedback {

            position: fixed;

            left: 50%;
            top: 53%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(0.8);

            padding:
                11px 22px;

            border-radius: 999px;

            font-size: 21px;

            font-weight: 900;

            opacity: 0;

            pointer-events: none;

            z-index: 1100;

            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
        }


        #feedback.show {

            opacity: 1;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(1);
        }


        #feedback.correct {

            background:
                rgba(22, 163, 74, 0.96);

            color: white;
        }


        #feedback.incorrect {

            background:
                rgba(220, 38, 38, 0.96);

            color: white;
        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        #statusScreen {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(2, 6, 23, 0.95);

            z-index: 2000;
        }


        #statusBox {

            width:
                min(
                    90%,
                    650px
                );

            padding: 32px;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    #1e293b,
                    #0f172a
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.48);

            text-align: center;
        }


        #statusTitle {

            margin: 0 0 12px;

            font-size: 28px;

            font-weight: 900;
        }


        #statusMessage {

            margin: 0;

            color: #cbd5e1;

            font-size: 16px;

            line-height: 1.6;
        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        #gameOver {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(2, 6, 23, 0.93);

            z-index: 3000;
        }


        #gameOver.show {

            display: flex;
        }


        #gameOverBox {

            width:
                min(
                    92%,
                    720px
                );

            padding:
                32px;

            border-radius: 22px;

            background:
                linear-gradient(
                    180deg,
                    #1e293b,
                    #0f172a
                );

            border:
                2px solid
                rgba(255, 255, 255, 0.11);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.52);

            text-align: center;
        }


        #gameOverTitle {

            margin: 0;

            font-size:
                clamp(
                    34px,
                    6vw,
                    54px
                );

            font-weight: 900;
        }


        #gameOverList {

            margin:
                10px 0 24px;

            color: #cbd5e1;

            font-size: 17px;
        }


        #resultsGrid {

            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap: 11px;

            margin-bottom: 23px;
        }


        .resultBox {

            padding: 13px;

            border-radius: 11px;

            background:
                rgba(255, 255, 255, 0.07);

            border:
                1px solid
                rgba(255, 255, 255, 0.09);
        }


        .resultLabel {

            color: #94a3b8;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        .resultValue {

            margin-top: 5px;

            font-size: 27px;

            font-weight: 900;
        }


        #gameOverMessage {

            margin-bottom: 24px;

            color: #e2e8f0;

            font-size: 16px;

            line-height: 1.5;
        }


        #buttonRow {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }


        .actionButton {

            min-width: 145px;

            padding:
                13px 22px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }


        .actionButton:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.08);
        }


        #playAgainButton {

            background:
                #2563eb;

            color: white;
        }


        #libraryButton {

            background: white;

            color: #111827;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            #header {

                flex-direction: column;

                align-items: flex-start;

                gap: 9px;

                padding:
                    10px 12px;
            }


            #listName {

                max-width: 85vw;
            }


            #hud {

                width: 100%;

                justify-content:
                    space-between;
            }


            .hudBox {

                flex: 1;

                min-width: 0;
            }


            #gameArea {

                height:
                    calc(
                        100vh - 126px
                    );
            }


            #instructions {

                top: 9px;

                font-size: 12px;
            }


            #categoryArea {

                top: 56px;

                left: 9px;
                right: 9px;

                bottom: 138px;

                gap: 7px;
            }


            .categoryHeader {

                min-height: 51px;

                font-size: 13px;
            }


            #wordDock {

                height: 128px;
            }


            #wordCard {

                bottom: 32px;

                max-width: 84vw;

                min-height: 55px;

                padding:
                    10px 21px;

                font-size: 20px;
            }


            #resultsGrid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }


        @media (max-width: 520px) {

            body {

                overflow: hidden;
            }


            #hud {

                gap: 4px;
            }


            .hudBox {

                padding:
                    6px 4px;
            }


            .hudLabel {

                font-size: 8px;
            }


            .hudValue {

                font-size: 16px;
            }


            #categoryArea {

                display: flex;

                overflow-x: auto;

                padding-bottom: 4px;
            }


            .categoryColumn {

                flex:
                    1 0 145px;

                min-width: 145px;
            }


            #gameOverBox {

                padding:
                    24px 16px;
            }

        }

    </style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header id="header">


        <div id="titleArea">

            <h1 id="gameTitle">
                SortWord
            </h1>


            <div id="listName">
                Loading vocabulary...
            </div>

        </div>


        <div id="hud">


            <div class="hudBox">

                <div class="hudLabel">
                    Score
                </div>

                <div
                    class="hudValue"
                    id="scoreValue"
                >
                    0
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Accuracy
                </div>

                <div
                    class="hudValue"
                    id="accuracyValue"
                >
                    100%
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Streak
                </div>

                <div
                    class="hudValue"
                    id="streakValue"
                >
                    0
                </div>

            </div>


            <div
                class="hudBox"
                id="timerBox"
            >

                <div class="hudLabel">
                    Time
                </div>

                <div
                    class="hudValue"
                    id="timerValue"
                >
                    60
                </div>

            </div>


            <div class="hudBox">

                <div class="hudLabel">
                    Words
                </div>

                <div
                    class="hudValue"
                    id="wordsValue"
                >
                    0/0
                </div>

            </div>


        </div>


    </header>


    <!-- =====================================================
         GAME AREA
    ===================================================== -->

    <main id="gameArea">


        <div id="instructions">

            Drag each word into the category where it belongs.

        </div>


        <!-- =============================================
             CATEGORY COLUMNS
        ============================================== -->

        <div id="categoryArea">
        </div>


        <!-- =============================================
             FEEDBACK
        ============================================== -->

        <div id="feedback">
        </div>


    </main>


</div>


<!-- =====================================================
     WORD DOCK
     Kept outside the game area because the word card
     uses fixed positioning while dragging.
===================================================== -->

<div id="wordDock">

    <div id="wordDockLabel">
        Drag this word
    </div>


    <div
        id="wordCard"
        tabindex="0"
    >
        Loading...
    </div>

</div>


<!-- =====================================================
     LOADING / ERROR SCREEN
===================================================== -->

<div id="statusScreen">

    <div id="statusBox">

        <h2 id="statusTitle">
            Loading SortWord
        </h2>


        <p id="statusMessage">
            Loading your vocabulary set...
        </p>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div id="gameOver">

    <div id="gameOverBox">


        <h2 id="gameOverTitle">
            Round Complete!
        </h2>


        <div id="gameOverList">
            Vocabulary Set
        </div>


        <div id="resultsGrid">


            <div class="resultBox">

                <div class="resultLabel">
                    Score
                </div>

                <div
                    class="resultValue"
                    id="finalScore"
                >
                    0
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Accuracy
                </div>

                <div
                    class="resultValue"
                    id="finalAccuracy"
                >
                    0%
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Correct
                </div>

                <div
                    class="resultValue"
                    id="finalCorrect"
                >
                    0
                </div>

            </div>


            <div class="resultBox">

                <div class="resultLabel">
                    Best Streak
                </div>

                <div
                    class="resultValue"
                    id="finalStreak"
                >
                    0
                </div>

            </div>


        </div>


        <div id="gameOverMessage">
        </div>


        <div id="buttonRow">


            <button
                type="button"
                class="actionButton"
                id="playAgainButton"
            >
                PLAY AGAIN
            </button>


            <button
                type="button"
                class="actionButton"
                id="libraryButton"
            >
                LIBRARY
            </button>


        </div>


    </div>

</div>

/* =====================================================

) {

        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i = copy.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }


    return copy;

}


/* =====================================================
   LOAD FIREBASE SET
===================================================== */

async function loadVocabularySet(
    id
) {

    const reference =
        doc(
            db,
            COLLECTION_NAME,
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found."
        );

    }


    const data =
        snapshot.data();


    let items =
        [];


    /*
       Current format.
    */

    if (
        Array.isArray(
            data.items
        )
    ) {

        items =
            data.items;

    }


    /*
       Legacy format.
    */

    else if (
        Array.isArray(
            data.terms
        )
    ) {

        items =
            data.terms;

    }


    else if (
        typeof data.terms ===
        "string"
    ) {

        try {

            items =
                JSON.parse(
                    data.terms
                );

        }

        catch {

            throw new Error(
                "The vocabulary list contains invalid data."
            );

        }

    }


    return {

        title:
            data.title ||
            "Vocabulary Set",

        items

    };

}


/* =====================================================
   VALIDATE VOCABULARY
===================================================== */

function validateVocabulary(
    items
) {

    if (
        !Array.isArray(
            items
        )
    ) {

        throw new Error(
            "The vocabulary data is not usable."
        );

    }


    const cleaned =
        items
            .map(
                item => ({

                    word:
                        String(
                            item?.word ||
                            ""
                        ).trim(),

                    category:
                        String(
                            item?.definition ||
                            item?.meaning ||
                            ""
                        ).trim()

                })
            )
            .filter(
                item =>
                    item.word &&
                    item.category
            );


    if (
        cleaned.length < 2
    ) {

        throw new Error(
            "SortWord needs at least two vocabulary words with category definitions."
        );

    }


    /*
       Build category list.

       Comparison is case-insensitive,
       while the original display text
       is preserved.
    */

    const categoryMap =
        new Map();


    cleaned.forEach(
        item => {

            const key =
                normalizeText(
                    item.category
                );


            if (
                !categoryMap.has(
                    key
                )
            ) {

                categoryMap.set(
                    key,
                    item.category
                );

            }

        }
    );


    const categoryEntries =
        [...categoryMap.entries()];


    if (
        categoryEntries.length <
        MIN_CATEGORIES
    ) {

        throw new Error(
            "SortWord needs at least two different categories."
        );

    }


    if (
        categoryEntries.length >
        MAX_CATEGORIES
    ) {

        throw new Error(
            `This vocabulary set contains ${categoryEntries.length} different categories. SortWord supports no more than five categories.`
        );

    }


    /*
       Reject duplicate words.

       This keeps every word unambiguous.
    */

    const wordMap =
        new Map();


    for (
        const item of cleaned
    ) {

        const key =
            normalizeText(
                item.word
            );


        if (
            wordMap.has(
                key
            )
        ) {

            throw new Error(
                `The word "${item.word}" appears more than once. Remove the duplicate before using SortWord.`
            );

        }


        wordMap.set(
            key,
            normalizeText(
                item.category
            )
        );

    }


    return {

        items:
            cleaned,

        categories:
            categoryEntries

    };

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    title,
    message
) {

    statusTitle.textContent =
        title;


    statusMessage.textContent =
        message;


    statusScreen.style.display =
        "flex";

}


/* =====================================================
   HIDE STATUS
===================================================== */

function hideStatus() {

    statusScreen.style.display =
        "none";

}


/* =====================================================
   CREATE CATEGORIES
===================================================== */

function createCategories(
    categoryEntries
) {

    categoryArea.innerHTML =
        "";


    categories =
        categoryEntries.map(
            entry =>
                entry[1]
        );


    categoryArea.style.gridTemplateColumns =
        `repeat(
            ${categories.length},
            minmax(0, 1fr)
        )`;


    categories.forEach(
        category => {

            const column =
                document.createElement(
                    "div"
                );


            column.className =
                "categoryColumn";


            column.dataset.category =
                normalizeText(
                    category
                );


            const header =
                document.createElement(
                    "div"
                );


            header.className =
                "categoryHeader";


            header.textContent =
                category;


            const hint =
                document.createElement(
                    "div"
                );


            hint.className =
                "categoryHint";


            hint.textContent =
                "Drop words here";


            column.appendChild(
                header
            );


            column.appendChild(
                hint
            );


            categoryArea.appendChild(
                column
            );

        }
    );

}


/* =====================================================
   BUILD ROUND
===================================================== */

function buildRound() {

    let shuffled =
        shuffle(
            sourceVocabulary
        );


    shuffled =
        shuffled.slice(
            0,
            MAX_WORDS
        );


    /*
       Make sure every category is
       represented whenever possible.
    */

    const required =
        [];

    const used =
        new Set();


    categories.forEach(
        category => {

            const match =
                shuffled.find(
                    item =>
                        normalizeText(
                            item.category
                        ) ===
                        normalizeText(
                            category
                        )
                );


            if (
                match
            ) {

                const key =
                    normalizeText(
                        match.word
                    );


                if (
                    !used.has(
                        key
                    )
                ) {

                    required.push(
                        match
                    );

                    used.add(
                        key
                    );

                }

            }

        }
    );


    for (
        const item of shuffled
    ) {

        if (
            required.length >=
            MAX_WORDS
        ) {

            break;

        }


        const key =
            normalizeText(
                item.word
            );


        if (
            used.has(
                key
            )
        ) {

            continue;

        }


        required.push(
            item
        );


        used.add(
            key
        );

    }


    roundVocabulary =
        shuffle(
            required
        );

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    scoreValue.textContent =
        score;


    streakValue.textContent =
        streak;


    timerValue.textContent =
        timeLeft;


    wordsValue.textContent =
        `${currentIndex}/${roundVocabulary.length}`;


    const totalAnswered =
        correctCount +
        incorrectCount;


    const accuracy =
        totalAnswered > 0

            ? Math.round(
                (
                    correctCount /
                    totalAnswered
                ) *
                100
            )

            : 100;


    accuracyValue.textContent =
        `${accuracy}%`;


    timerBox.classList.remove(
        "warning",
        "danger"
    );


    if (
        timeLeft <= 10
    ) {

        timerBox.classList.add(
            "danger"
        );

    }

    else if (
        timeLeft <= 20
    ) {

        timerBox.classList.add(
            "warning"
        );

    }

}


/* =====================================================
   RESET WORD TO BOTTOM
===================================================== */

function resetWordCard() {

    clearTimeout(
        returnAnimationTimer
    );


    wordCard.classList.remove(
        "dragging"
    );


    wordCard.style.left =
        "50%";


    wordCard.style.top =
        "";


    wordCard.style.bottom =
        "38px";


    wordCard.style.transform =
        "translateX(-50%)";

}


/* =====================================================
   SHOW CURRENT WORD
===================================================== */

function showCurrentWord() {

    if (
        currentIndex >=
        roundVocabulary.length
    ) {

        endGame(
            "You sorted every word!"
        );

        return;

    }


    currentWord =
        roundVocabulary[
            currentIndex
        ];


    wordCard.textContent =
        currentWord.word;


    wordCard.classList.remove(
        "hidden"
    );


    resetWordCard();

    updateHUD();

}


/* =====================================================
   POINTER DOWN
===================================================== */

wordCard.addEventListener(
    "pointerdown",
    event => {

        if (
            !gameIsRunning ||
            !currentWord ||
            isDragging
        ) {

            return;

        }


        event.preventDefault();


        isDragging =
            true;


        pointerId =
            event.pointerId;


        wordCard.setPointerCapture(
            event.pointerId
        );


        const rect =
            wordCard.getBoundingClientRect();


        /*
           Store the difference between the
           pointer and the center of the oval.
        */

        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        dragOffsetX =
            event.clientX -
            centerX;


        dragOffsetY =
            event.clientY -
            centerY;


        /*
           Switch to explicit viewport
           positioning for dragging.
        */

        wordCard.style.bottom =
            "";


        wordCard.style.top =
            `${centerY}px`;


        wordCard.style.left =
            `${centerX}px`;


        wordCard.style.transform =
            "translate(-50%, -50%)";


        wordCard.classList.add(
            "dragging"
        );


        highlightDropZone(
            centerX,
            centerY
        );

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

wordCard.addEventListener(
    "pointermove",
    event => {

        if (
            !isDragging ||
            event.pointerId !== pointerId
        ) {

            return;

        }


        event.preventDefault();


        let centerX =
            event.clientX -
            dragOffsetX;


        let centerY =
            event.clientY -
            dragOffsetY;


        /*
           Keep the oval fully visible.
        */

        const rect =
            wordCard.getBoundingClientRect();


        const halfWidth =
            rect.width / 2;


        const halfHeight =
            rect.height / 2;


        const padding =
            8;


        centerX =
            Math.max(
                halfWidth + padding,
                Math.min(
                    window.innerWidth -
                        halfWidth -
                        padding,
                    centerX
                )
            );


        centerY =
            Math.max(
                halfHeight + padding,
                Math.min(
                    window.innerHeight -
                        halfHeight -
                        padding,
                    centerY
                )
            );


        wordCard.style.left =
            `${centerX}px`;


        wordCard.style.top =
            `${centerY}px`;


        wordCard.style.bottom =
            "";


        wordCard.style.transform =
            "translate(-50%, -50%)";


        highlightDropZone(
            centerX,
            centerY
        );

    }
);


/* =====================================================
   POINTER UP
===================================================== */

wordCard.addEventListener(
    "pointerup",
    event => {

        if (
            !isDragging ||
            event.pointerId !== pointerId
        ) {

            return;

        }


        event.preventDefault();


        finishDrag();

    }
);


/* =====================================================
   POINTER CANCEL
===================================================== */

wordCard.addEventListener(
    "pointercancel",
    event => {

        if (
            event.pointerId !== pointerId
        ) {

            return;

        }


        finishDrag();

    }
);


/* =====================================================
   FINISH DRAG
===================================================== */

function finishDrag() {

    const rect =
        wordCard.getBoundingClientRect();


    const centerX =
        rect.left +
        rect.width / 2;


    const centerY =
        rect.top +
        rect.height / 2;


    const target =
        getDropTarget(
            centerX,
            centerY
        );


    isDragging =
        false;


    pointerId =
        null;


    wordCard.classList.remove(
        "dragging"
    );


    clearDropHighlights();


    if (
        target
    ) {

        handleDrop(
            target
        );

    }

    else {

        returnWordToDock();

    }

}


/* =====================================================
   FIND DROP TARGET
===================================================== */

function getDropTarget(
    x,
    y
) {

    const element =
        document.elementFromPoint(
            x,
            y
        );


    if (
        !element
    ) {

        return null;

    }


    return element.closest(
        ".categoryColumn"
    );

}


/* =====================================================
   HIGHLIGHT DROP ZONE
===================================================== */

function highlightDropZone(
    x,
    y
) {

    clearDropHighlights();


    const target =
        getDropTarget(
            x,
            y
        );


    if (
        target
    ) {

        target.classList.add(
            "dragOver"
        );

    }

}


/* =====================================================
   CLEAR HIGHLIGHTS
===================================================== */

function clearDropHighlights() {

    document
        .querySelectorAll(
            ".categoryColumn"
        )
        .forEach(
            column => {

                column.classList.remove(
                    "dragOver"
                );

            }
        );

}


/* =====================================================
   HANDLE DROP
===================================================== */

function handleDrop(
    targetColumn
) {

    if (
        !currentWord
    ) {

        return;

    }


    const selectedCategory =
        normalizeText(
            targetColumn.dataset.category
        );


    const correctCategory =
        normalizeText(
            currentWord.category
        );


    if (
        selectedCategory ===
        correctCategory
    ) {

        handleCorrectDrop(
            targetColumn
        );

    }

    else {

        handleIncorrectDrop();

    }

}


/* =====================================================
   CORRECT DROP
===================================================== */

function handleCorrectDrop(
    targetColumn
) {

    correctCount++;

    streak++;


    bestStreak =
        Math.max(
            bestStreak,
            streak
        );


    /*
       Base points = 100.
       Each streak level adds 10.
    */

    const points =
        100 +
        (
            (streak - 1) *
            10
        );


    score +=
        points;


    /*
       Add word to the target column.
    */

    const sortedWord =
        document.createElement(
            "div"
        );


    sortedWord.className =
        "sortedWord";


    sortedWord.textContent =
        currentWord.word;


    targetColumn.appendChild(
        sortedWord
    );


    showFeedback(
        `✓ Correct! +${points}`,
        true
    );


    wordCard.classList.add(
        "hidden"
    );


    currentIndex++;

    updateHUD();


    setTimeout(
        () => {

            if (
                gameIsRunning
            ) {

                showCurrentWord();

            }

        },
        300
    );

}


/* =====================================================
   INCORRECT DROP
===================================================== */

function handleIncorrectDrop() {

    incorrectCount++;

    streak = 0;


    score =
        Math.max(
            0,
            score - 25
        );


    showFeedback(
        "✗ Try again! -25",
        false
    );


    updateHUD();


    returnWordToDock();

}


/* =====================================================
   RETURN WORD TO DOCK
===================================================== */

function returnWordToDock() {

    clearTimeout(
        returnAnimationTimer
    );


    wordCard.classList.remove(
        "dragging"
    );


    /*
       Briefly keep it visible,
       then put it back at bottom center.
    */

    wordCard.style.left =
        "50%";


    wordCard.style.top =
        "";


    wordCard.style.bottom =
        "38px";


    wordCard.style.transform =
        "translateX(-50%)";


    returnAnimationTimer =
        setTimeout(
            () => {

                wordCard.style.left =
                    "50%";

                wordCard.style.bottom =
                    "38px";

            },
            20
        );

}


/* =====================================================
   FEEDBACK
===================================================== */

let feedbackTimer =
    null;


function showFeedback(
    message,
    correct
) {

    feedback.textContent =
        message;


    feedback.classList.remove(
        "correct",
        "incorrect",
        "show"
    );


    void feedback.offsetWidth;


    feedback.classList.add(
        correct
            ? "correct"
            : "incorrect"
    );


    feedback.classList.add(
        "show"
    );


    clearTimeout(
        feedbackTimer
    );


    feedbackTimer =
        setTimeout(
            () => {

                feedback.classList.remove(
                    "show"
                );

            },
            700
        );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            () => {

                if (
                    !gameIsRunning
                ) {

                    return;

                }


                timeLeft--;


                updateHUD();


                if (
                    timeLeft <= 0
                ) {

                    endGame(
                        "Time's up!"
                    );

                }

            },
            1000
        );

}


/* =====================================================
   END GAME
===================================================== */

function endGame(
    message
) {

    if (
        !gameIsRunning
    ) {

        return;

    }


    gameIsRunning =
        false;


    clearInterval(
        timerInterval
    );


    clearDropHighlights();


    wordCard.classList.add(
        "hidden"
    );


    const totalAnswered =
        correctCount +
        incorrectCount;


    const accuracy =
        totalAnswered > 0

            ? Math.round(
                (
                    correctCount /
                    totalAnswered
                ) *
                100
            )

            : 100;


    let completionBonus =
        0;


    /*
       Finish all words:
       10 points per remaining second.
    */

    if (
        currentIndex >=
        roundVocabulary.length
    ) {

        completionBonus =
            timeLeft * 10;


        score +=
            completionBonus;

    }


    finalScore.textContent =
        score;


    finalAccuracy.textContent =
        `${accuracy}%`;


    finalCorrect.textContent =
        correctCount;


    finalStreak.textContent =
        bestStreak;


    gameOverList.textContent =
        listNameEl.textContent;


    if (
        completionBonus > 0
    ) {

        gameOverMessage.textContent =
            `${message} You completed the entire round and earned a ${completionBonus}-point time bonus!`;

    }

    else {

        gameOverMessage.textContent =
            message;

    }


    gameOver.classList.add(
        "show"
    );

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    clearInterval(
        timerInterval
    );


    score = 0;

    correctCount = 0;

    incorrectCount = 0;

    streak = 0;

    bestStreak = 0;

    currentIndex = 0;

    timeLeft =
        ROUND_TIME;

    currentWord =
        null;


    gameIsRunning =
        true;


    gameOver.classList.remove(
        "show"
    );


    categoryArea
        .querySelectorAll(
            ".sortedWord"
        )
        .forEach(
            element =>
                element.remove()
        );


    buildRound();


    updateHUD();


    hideStatus();


    showCurrentWord();


    startTimer();

}


/* =====================================================
   PLAY AGAIN
===================================================== */

playAgainButton.addEventListener(
    "click",
    () => {

        startGame();

    }
);


/* =====================================================
   LIBRARY
===================================================== */

libraryButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html";

    }
);


/* =====================================================
   INITIALIZE
===================================================== */

async function initializeGame() {

    if (
        !setId
    ) {

        showStatus(

            "No Vocabulary Set Selected",

            "SortWord must be opened from the Vocabulary Arcade Library with a vocabulary set ID."

        );

        return;

    }


    try {

        showStatus(

            "Loading SortWord",

            "Loading your vocabulary set from Firebase..."

        );


        const data =
            await loadVocabularySet(
                setId
            );


        listNameEl.textContent =
            data.title;


        const validation =
            validateVocabulary(
                data.items
            );


        sourceVocabulary =
            validation.items;


        createCategories(
            validation.categories
        );


        startGame();

    }

    catch (
        error
    ) {

        console.error(
            "SORTWORD ERROR:",
            error
        );


        showStatus(

            "Unable to Start SortWord",

            error.message ||
            "There was a problem loading this vocabulary set."

        );

    }

}


/* =====================================================
   START
===================================================== */

initializeGame();


</script>
