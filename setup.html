<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Game - Teacher Setup</title>

<style>

html,
body{
    height:100%;
    margin:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
    overflow-y:auto;
    box-sizing:border-box;
}

.inputArea{
    max-width:800px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-top:0;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
    font-size:16px;
}

textarea{
    resize:vertical;
    min-height:250px;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:12px 18px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

button:hover{
    background:#005ea8;
}

    .libraryButton {
    background: white;
    color: black;
    border: 1px solid #ccc;
    margin-left: 8px;
}

.libraryButton:hover {
    background: #f0f0f0;
    color: black;
}
button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.counter{
    margin-bottom:15px;
    color:#666;
}

#status{
    margin-top:15px;
    font-weight:bold;
    line-height:1.5;
}

.successLink{
    display:inline-block;
    margin-top:10px;
    color:#0078d4;
    text-decoration:none;
}

.successLink:hover{
    text-decoration:underline;
}

/* =========================
   DARK MODE
========================= */

body.dark-mode{
    background:#121212;
    color:#e0e0e0;
}

body.dark-mode .inputArea{
    background:#1e1e1e;
    color:#e0e0e0;
}

body.dark-mode input,
body.dark-mode select,
body.dark-mode textarea{
    background:#2c2c2c;
    color:white;
    border:1px solid #555;
}

body.dark-mode textarea::placeholder,
body.dark-mode input::placeholder{
    color:#bbbbbb;
}

body.dark-mode .counter{
    color:#bbbbbb;
}

body.dark-mode a{
    color:#66b3ff;
}

</style>
</head>

<body>

<div class="inputArea">

<h2>CREATE A NEW VOCABULARY ARCADE SET</h2>

<p>Enter vocabulary as:</p>

<p>
<strong>WORD,DEFINITION</strong> or
<strong>WORD[TAB]DEFINITION</strong><br>
(one vocabulary item per line)
</p>

<input
id="listTitle"
type="text"
placeholder="Vocabulary List Title"
>

<select id="language">
<option value="">Select Language</option>
<option>Latin</option>
<option>Spanish</option>
<option>French</option>
<option>German</option>
<option>Italian</option>
<option>Greek</option>
<option>Portuguese</option>
<option>Chinese</option>
<option>Japanese</option>
<option>Other</option>
</select>

<select id="visibility">
<option value="public">Public</option>
<option value="private">Private</option>
</select>

<textarea
id="vocabInput"
rows="12"
placeholder="Comma-separated:

amicus,friend
bellum,war
hostis,enemy

OR paste directly from Excel / Google Sheets:

amicus	friend
bellum	war
hostis	enemy">
</textarea>

<div class="counter">
Vocabulary Entries:
<span id="entryCount">0</span> / 50
</div>

<button id="saveBtn" onclick="saveVocabularyList()">
    Save To Library
</button>

<button
    type="button"
    class="libraryButton"
    onclick="window.location.href='https://alexjeffersonmarsh.github.io/VocabularyArcade/library.html'"
>
    LIBRARY
</button>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyD-goTprU8NMVqmsAlve6BAfXrPZN-sQdQ",
    authDomain: "bubbleword-30367.firebaseapp.com",
    projectId: "bubbleword-30367",
    storageBucket: "bubbleword-30367.firebasestorage.app",
    messagingSenderId: "1058393039019",
    appId: "1:1058393039019:web:72ffaf6dab677b9a3657ee"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const vocabInput =
    document.getElementById("vocabInput");

const entryCount =
    document.getElementById("entryCount");

const saveBtn =
    document.getElementById("saveBtn");

function updateCount() {

    const count =
        vocabInput.value
            .split("\n")
            .filter(line => line.trim() !== "")
            .length;

    entryCount.textContent = count;
}

vocabInput.addEventListener("input", updateCount);

window.saveVocabularyList = async function() {

    const title =
        document.getElementById("listTitle")
            .value
            .trim();

    const language =
        document.getElementById("language")
            .value;

    const visibility =
        document.getElementById("visibility")
            .value;

    const text =
        document.getElementById("vocabInput")
            .value
            .trim();

    const status =
        document.getElementById("status");

    status.innerHTML = "";

    if (!title) {
        alert("Please enter a vocabulary list title.");
        return;
    }

    if (!language) {
        alert("Please select a language.");
        return;
    }

    if (!text) {
        alert("Please enter vocabulary items.");
        return;
    }

    const lines =
        text
            .split("\n")
            .filter(line => line.trim() !== "");

    if (lines.length < 5 || lines.length > 50) {
        alert("Vocabulary lists must contain between 5 and 50 entries.");
        return;
    }

    const items = [];

    for (const line of lines) {

        const separator =
            line.includes("\t")
                ? "\t"
                : ",";

        const parts =
            separator === "\t"
                ? line.split("\t")
                : line.split(/,(.+)/);

        if (parts.length < 2) {
            alert(
                `Invalid format:\n\n${line}\n\nUse either:\nWORD,DEFINITION\nor\nWORD[TAB]DEFINITION`
            );
            return;
        }

        const word =
            parts[0].trim();

        const definition =
            parts.slice(1).join("").trim();

        if (!word || !definition) {
            alert(`Invalid entry:\n\n${line}`);
            return;
        }

        items.push({
            word,
            definition
        });
    }

    try {

        saveBtn.disabled = true;

        status.textContent =
            "Saving vocabulary list...";

        const docRef =
            await addDoc(
                collection(db, "vocabSets"),
                {
                    title,
                    language,
                    visibility,
                    itemCount: items.length,
                    createdAt: serverTimestamp(),
                    items
                }
            );

        status.innerHTML = `
            ✅ Vocabulary list saved successfully.<br><br>
            Document ID:
            <strong>${docRef.id}</strong>
        `;

        document.getElementById("listTitle").value = "";
        document.getElementById("language").selectedIndex = 0;
        document.getElementById("visibility").value = "public";
        document.getElementById("vocabInput").value = "";

        updateCount();

    } catch(error) {

        console.error(error);

        status.innerHTML =
            `❌ Error saving list:<br>${error.message}`;

    } finally {

        saveBtn.disabled = false;

    }

};

updateCount();

</script>

</body>
</html>
