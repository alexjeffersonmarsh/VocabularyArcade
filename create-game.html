<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlastWord - Vocabulary Arcade</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            background: #050510;
            color: white;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =====================================================
           GAME CONTAINER
        ===================================================== */

        #game-container {

            position: relative;

            width: min(
                1300px,
                100vw
            );

            height: min(
                800px,
                100vh
            );

            background:
                radial-gradient(
                    circle at center,
                    #101030 0%,
                    #050510 100%
                );

            border:
                3px solid #00ffff;

            box-shadow:
                0 0 30px
                rgba(
                    0,
                    255,
                    255,
                    0.4
                );

            overflow: hidden;
        }


        /* =====================================================
           CANVAS
        ===================================================== */

        #gameCanvas {

            display: block;

            width: 100%;
            height: 100%;

            touch-action: none;
        }


        /* =====================================================
           LIST NAME
        ===================================================== */

        #list-name-display {

            position: absolute;

            top: 12px;
            left: 50%;

            transform:
                translateX(-50%);

            max-width: 60%;

            padding:
                7px 16px;

            border-radius:
                999px;

            background:
                rgba(
                    5,
                    5,
                    16,
                    0.72
                );

            border:
                1px solid
                rgba(
                    0,
                    255,
                    255,
                    0.25
                );

            color:
                #c7d2fe;

            font-size:
                14px;

            font-weight:
                700;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            z-index:
                8;

            pointer-events:
                none;
        }


        /* =====================================================
           SOUND BUTTON
        ===================================================== */

        #sound-button {

            position: absolute;

            top: 12px;
            right: 14px;

            width: 42px;
            height: 42px;

            border: 1px solid
                rgba(
                    0,
                    255,
                    255,
                    0.35
                );

            border-radius: 8px;

            background:
                rgba(
                    5,
                    5,
                    16,
                    0.82
                );

            color: white;

            font-size: 20px;

            cursor: pointer;

            z-index: 40;

            transition:
                transform .12s ease,
                background .12s ease;
        }


        #sound-button:hover {

            transform:
                scale(1.06);

            background:
                rgba(
                    0,
                    255,
                    255,
                    0.16
                );
        }


        /* =====================================================
           TARGET / HUD BAR
        ===================================================== */

        #target-bar {

            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            height: 88px;

            background:
                rgba(
                    10,
                    15,
                    30,
                    0.97
                );

            border-top:
                2px solid #00ffff;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                20px;

            padding:
                8px 25px;

            z-index:
                10;

            pointer-events:
                none;
        }


        #target-area {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            min-width:
                0;
        }


        .prompt-label {

            font-size:
                14px;

            color:
                #8888aa;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

            white-space:
                nowrap;
        }


        .target-word {

            font-size:
                clamp(
                    23px,
                    3vw,
                    36px
                );

            font-weight:
                900;

            color:
                #00ffff;

            text-shadow:
                0 0 14px
                rgba(
                    0,
                    255,
                    255,
                    0.8
                );

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats-container {

            display:
                flex;

            align-items:
                center;

            justify-content:
                flex-end;

            gap:
                10px;

            flex-wrap:
                wrap;
        }


        .stat {

            min-width:
                72px;

            text-align:
                center;
        }


        .stat-label {

            display:
                block;

            font-size:
                9px;

            color:
                #777799;

            text-transform:
                uppercase;

            letter-spacing:
                .7px;
        }


        .stat-value {

            display:
                block;

            margin-top:
                2px;

            font-size:
                19px;

            font-weight:
                900;
        }


        #score-display {
            color:
                #ff00ff;
        }


        #ammo-display {
            color:
                #00ffcc;
        }


        #shields-display {
            color:
                #ff6688;
        }


        #wave-display {
            color:
                #ffd166;
        }


        #accuracy-display {
            color:
                #8be9fd;
        }


        #words-display {
            color:
                #a7f3d0;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message-display {

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(.8);

            padding:
                13px 28px;

            border-radius:
                999px;

            background:
                rgba(
                    0,
                    255,
                    255,
                    .92
                );

            color:
                #050510;

            font-size:
                25px;

            font-weight:
                900;

            opacity:
                0;

            pointer-events:
                none;

            z-index:
                30;

            transition:
                opacity .18s ease,
                transform .18s ease;
        }


        #message-display.show {

            opacity:
                1;

            transform:
                translate(
                    -50%,
                    -50%
                )
                scale(1);
        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        #loading-screen {

            position:
                absolute;

            inset:
                0;

            background:
                rgba(
                    5,
                    5,
                    16,
                    .97
                );

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            text-align:
                center;

            padding:
                30px;

            gap:
                15px;

            z-index:
                100;
        }


        #loading-screen.hidden {
            display:
                none;
        }


        #loading-title {

            font-size:
                36px;

            font-weight:
                900;

            color:
                #00ffff;
        }


        #loading-text {

            font-size:
                18px;

            color:
                #cbd5e1;

            line-height:
                1.5;
        }


        #loading-details {

            max-width:
                750px;

            font-size:
                15px;

            color:
                #ff8899;

            line-height:
                1.5;
        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        #game-over-screen {

            position:
                absolute;

            inset:
                0;

            background:
                rgba(
                    5,
                    5,
                    16,
                    .94
                );

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                center;

            align-items:
                center;

            text-align:
                center;

            padding:
                25px;

            z-index:
                90;
        }


        #game-over-screen.hidden {
            display:
                none;
        }


        #game-over-screen h1 {

            font-size:
                clamp(
                    42px,
                    7vw,
                    68px
                );

            color:
                #ff3366;

            margin-bottom:
                6px;

            text-shadow:
                0 0 15px
                rgba(
                    255,
                    51,
                    102,
                    .8
                );
        }


        #game-over-list {

            color:
                #cbd5e1;

            font-size:
                18px;

            margin-bottom:
                25px;

            max-width:
                80%;
        }


        /* =====================================================
           RESULTS
        ===================================================== */

        #results-grid {

            width:
                min(
                    700px,
                    90%
                );

            display:
                grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap:
                12px;

            margin-bottom:
                25px;
        }


        .result-box {

            padding:
                15px 10px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .06
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            border-radius:
                10px;
        }


        .result-label {

            display:
                block;

            font-size:
                10px;

            text-transform:
                uppercase;

            color:
                #7d8494;

            letter-spacing:
                .7px;
        }


        .result-value {

            display:
                block;

            margin-top:
                4px;

            font-size:
                27px;

            font-weight:
                900;
        }


        #game-over-message {

            max-width:
                700px;

            margin-bottom:
                24px;

            color:
                #e2e8f0;

            font-size:
                16px;

            line-height:
                1.5;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        #button-row {

            display:
                flex;

            justify-content:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;
        }


        .action-button {

            min-width:
                150px;

            padding:
                13px 25px;

            border:
                none;

            border-radius:
                7px;

            font-size:
                17px;

            font-weight:
                800;

            cursor:
                pointer;

            transition:
                transform .12s ease,
                filter .12s ease;
        }


        .action-button:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.08);
        }


        #restart-btn {

            background:
                #00ffff;

            color:
                #050510;

            box-shadow:
                0 0 15px
                rgba(
                    0,
                    255,
                    255,
                    .5
                );
        }


        #library-btn {

            background:
                #ffffff;

            color:
                #111827;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            #target-bar {

                height:
                    105px;

                padding:
                    7px 12px;

                flex-direction:
                    column;

                justify-content:
                    center;

                gap:
                    4px;
            }


            #target-area {
                max-width:
                    90%;
            }


            .stats-container {

                width:
                    100%;

                justify-content:
                    space-around;
            }


            .stat {
                min-width:
                    54px;
            }


            .stat-value {
                font-size:
                    16px;
            }


            .stat-label {
                font-size:
                    8px;
            }


            #list-name-display {

                max-width:
                    65%;

                font-size:
                    12px;
            }


            #results-grid {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

        }


        @media (max-width: 600px) {

            #game-container {
                border-width:
                    2px;
            }


            #target-bar {
                height:
                    115px;
            }


            .prompt-label {
                font-size:
                    11px;
            }


            .target-word {
                font-size:
                    22px;
            }


            #sound-button {

                top:
                    9px;

                right:
                    9px;

                width:
                    36px;

                height:
                    36px;

                font-size:
                    17px;
            }

        }

    </style>

</head>

<div id="game-container">

/* =========================================================

const firebaseConfig = {

const db =

/* =========================================================
   CONSTANTS
========================================================= */

const CANVAS_WIDTH =
    1300;

const CANVAS_HEIGHT =

const FOOTER_HEIGHT =

const setId =

/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(
    value
) {

    return String(
        value || ""
    )
        .trim()
        .replace(
            /\s+/g,
            " "
        )
        .toLowerCase();
}


/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(
    array
) {

    const copy =
        [...array];


    for (
        let i =
            copy.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];
    }


    return copy;
}


/* =========================================================
   ACCURACY UTILS
========================================================= */

function getAccuracyPercentage() {
    if (targetShots === 0) return 100;
    return Math.round((correctAnswers / targetShots) * 100);
}


function updateAccuracyUI() {
    const acc = getAccuracyPercentage();
    accuracyDisplay.textContent = `${acc}%`;
}


/* =========================================================
   LOAD FIREBASE SET
========================================================= */

async function loadVocabularySet(
    id
) {

    if (!id) {

        throw new Error(
            "No vocabulary set ID was provided. Open BlastWord from the Vocabulary Arcade Library."
        );
    }


    const reference =
        doc(
            db,
            "vocabSets",
            id
        );


    const snapshot =
        await getDoc(
            reference
        );


    if (
        !snapshot.exists()
    ) {

        throw new Error(
            "Vocabulary set not found in Firebase."
        );
    }


    const data =
        snapshot.data();


    let items =
        [];


    if (Array.isArray(data.items)) {
        items = data.items;
    } else if (Array.isArray(data.words)) {
        items = data.words;
    }


    if (!items || items.length === 0) {
        throw new Error("Vocabulary set contains no items.");
    }


    vocabList = items.map((item) => ({
        term: item.term || item.word || "",
        definition: item.definition || item.def || ""
    })).filter((item) => item.term && item.definition);


    if (vocabList.length === 0) {
        throw new Error("Vocabulary set has invalid items.");
    }


    listTitle = data.title || data.name || "Vocabulary Set";
    listLanguage = data.language || "";

    listNameDisplay.textContent = listTitle;
    loadingScreen.classList.add("hidden");

    initGame();
}


/* =========================================================
   INIT & SPAWN
========================================================= */

function initGame() {
    score = 0;
    ammo = MAX_AMMO;
    shields = MAX_SHIELDS;
    correctAnswers = 0;

    targetShots = 0;
    hazardShots = 0;

    streak = 0;
    bestStreak = 0;
    wave = 1;
    isGameOver = false;
    gameStarted = true;
    levelTransitioning = false;

    bullets = [];
    ships = [];

    scoreDisplay.textContent = "0";
    ammoDisplay.textContent = String(MAX_AMMO);
    shieldsDisplay.textContent = "♥ ".repeat(MAX_SHIELDS).trim();
    waveDisplay.textContent = "1";
    wordsDisplay.textContent = "0";
    updateAccuracyUI();

    gameOverScreen.classList.add("hidden");

    spawnFormation();
    pickNextTarget();
}


function spawnFormation() {
    ships = [];

    const startX = 150;
    const startY = 90;
    const spacingX = 220;
    const spacingY = 75;

    let availableVocab = shuffle([...vocabList]);

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            if (availableVocab.length === 0) {
                availableVocab = shuffle([...vocabList]);
            }

            const vocabItem = availableVocab.pop();

            ships.push({
                x: startX + c * spacingX,
                y: startY + r * spacingY,
                originX: startX + c * spacingX,
                originY: startY + r * spacingY,
                width: 140,
                height: 48,
                term: vocabItem.term,
                definition: vocabItem.definition,
                color: SHIP_COLORS[(r + c) % SHIP_COLORS.length],
                isDiving: false,
                diveAngle: 0,
                diveSpeedX: 0,
                diveSpeedY: 0
            });
        }
    }

    horizontalDirection = 1;
    horizontalSpeed = BASE_HORIZONTAL_SPEED + (wave - 1) * 0.2;
    downwardSpeed = BASE_DOWNWARD_SPEED + (wave - 1) * 0.01;
}


function pickNextTarget() {
    if (ships.length === 0) {
        advanceWave();
        return;
    }

    const randomIndex = Math.floor(Math.random() * ships.length);
    currentTargetShip = ships[randomIndex];
    currentTarget = {
        term: currentTargetShip.term,
        definition: currentTargetShip.definition
    };

    targetWordDisplay.textContent = currentTarget.definition;
}


function advanceWave() {
    levelTransitioning = true;
    wave++;
    waveDisplay.textContent = String(wave);

    showMessage(`LEVEL ${wave}!`, 1800);

    setTimeout(() => {
        spawnFormation();
        pickNextTarget();
        levelTransitioning = false;
    }, 1800);
}


/* =========================================================
   SHOOTING & BULLETS
========================================================= */

function fireBullet() {
    if (ammo <= 0 || isGameOver || levelTransitioning) return;

    ammo--;
    ammoDisplay.textContent = String(ammo);

    bullets.push({
        x: player.x,
        y: player.y - player.height / 2,
        radius: 5,
        speed: 12,
        color: "#00ffff",
        targetShotCounted: false
    });

    if (window.soundSystem && typeof window.soundSystem.playLaser === "function") {
        window.soundSystem.playLaser();
    }
}


function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y -= b.speed;

        let hitSomething = false;

        for (let j = ships.length - 1; j >= 0; j--) {
            const s = ships[j];

            if (
                b.x >= s.x - s.width / 2 &&
                b.x <= s.x + s.width / 2 &&
                b.y >= s.y - s.height / 2 &&
                b.y <= s.y + s.height / 2
            ) {
                hitSomething = true;

                if (s.isDiving) {
                    // Defensive shot against charging ship: does NOT affect main target accuracy
                    hazardShots++;
                    score += 50;
                    scoreDisplay.textContent = String(score);

                    showMessage("HAZARD DESTROYED!", 700);

                    if (window.soundSystem && typeof window.soundSystem.playExplosion === "function") {
                        window.soundSystem.playExplosion();
                    }

                    ships.splice(j, 1);

                    if (s === currentTargetShip) {
                        pickNextTarget();
                    }
                } else if (normalizeText(s.term) === normalizeText(currentTarget.term)) {
                    // Direct hit on the active vocabulary target
                    targetShots++;
                    correctAnswers++;
                    wordsDisplay.textContent = String(correctAnswers);

                    streak++;
                    if (streak > bestStreak) bestStreak = streak;

                    ammo = Math.min(MAX_AMMO, ammo + CORRECT_AMMO_BONUS);
                    ammoDisplay.textContent = String(ammo);

                    score += 100 + streak * 10;
                    scoreDisplay.textContent = String(score);

                    if (window.soundSystem && typeof window.soundSystem.playCorrect === "function") {
                        window.soundSystem.playCorrect();
                    }

                    ships.splice(j, 1);
                    pickNextTarget();
                } else {
                    // Hit incorrect non-charging ship
                    targetShots++;
                    streak = 0;

                    score = Math.max(0, score - 30);
                    scoreDisplay.textContent = String(score);

                    if (window.soundSystem && typeof window.soundSystem.playWrong === "function") {
                        window.soundSystem.playWrong();
                    }
                }

                updateAccuracyUI();
                bullets.splice(i, 1);
                break;
            }
        }

        if (!hitSomething && b.y < 0) {
            // Off-screen bullet counts against target accuracy
            targetShots++;
            updateAccuracyUI();
            bullets.splice(i, 1);
        }
    }
}


/* =========================================================
   DIVING / ATTACKS
========================================================= */

function updateShips() {
    let touchedEdge = false;

    const diveChance = BASE_DIVE_CHANCE + (wave - 1) * DIVE_CHANCE_INCREMENT;
    const now = Date.now();

    for (let i = 0; i < ships.length; i++) {
        const s = ships[i];

        if (s.isDiving) {
            s.x += s.diveSpeedX;
            s.y += s.diveSpeedY;

            // Collision with player
            if (
                Math.abs(s.x - player.x) < (s.width / 2 + player.width / 2) &&
                Math.abs(s.y - player.y) < (s.height / 2 + player.height / 2)
            ) {
                ships.splice(i, 1);
                takeDamage("SHIP COLLISION!");

                if (s === currentTargetShip) {
                    pickNextTarget();
                }
                continue;
            }

            // Reached bottom
            if (s.y > CANVAS_HEIGHT - FOOTER_HEIGHT) {
                s.isDiving = false;
                s.x = s.originX;
                s.y = s.originY;
            }
        } else {
            s.x += horizontalSpeed * horizontalDirection;
            s.y += downwardSpeed;

            if (s.x - s.width / 2 < 20 || s.x + s.width / 2 > CANVAS_WIDTH - 20) {
                touchedEdge = true;
            }

            // Random dive trigger
            if (
                now - lastDiveTime > Math.max(MIN_DIVE_COOLDOWN, BASE_DIVE_COOLDOWN - wave * 250) &&
                Math.random() < diveChance
            ) {
                s.isDiving = true;
                lastDiveTime = now;

                const angle = Math.atan2(player.y - s.y, player.x - s.x);
                s.diveSpeedX = Math.cos(angle) * (DIVE_SPEED + wave * 0.3);
                s.diveSpeedY = Math.sin(angle) * (DIVE_SPEED + wave * 0.3);
            }

            // Touched defense line
            if (s.y + s.height / 2 >= player.y - 10) {
                triggerGameOver("Formation penetrated defenses!");
                return;
            }
        }
    }

    if (touchedEdge) {
        horizontalDirection *= -1;
    }
}


/* =========================================================
   HEALTH / GAME OVER / MESSAGES
========================================================= */

function takeDamage(reason) {
    shields--;
    shieldsDisplay.textContent = "♥ ".repeat(Math.max(0, shields)).trim();

    showMessage(reason || "SHIELD HIT!", 1200);

    if (window.soundSystem && typeof window.soundSystem.playExplosion === "function") {
        window.soundSystem.playExplosion();
    }

    if (shields <= 0) {
        triggerGameOver("Shields Destroyed!");
    }
}


function triggerGameOver(reason) {
    isGameOver = true;
    gameStarted = false;

    gameOverList.textContent = listTitle;
    finalScore.textContent = String(score);
    finalAccuracy.textContent = `${getAccuracyPercentage()}%`;
    finalCorrect.textContent = String(correctAnswers);
    finalCombo.textContent = String(bestStreak);

    gameOverMessage.textContent = reason || "Game Over";
    gameOverScreen.classList.remove("hidden");
}


function showMessage(text, duration = 1200) {
    if (messageTimer) clearTimeout(messageTimer);

    messageDisplay.textContent = text;
    messageDisplay.classList.add("show");

    messageTimer = setTimeout(() => {
        messageDisplay.classList.remove("show");
    }, duration);
}


/* =========================================================
   DRAW LOOP
========================================================= */

function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // Draw Player
    ctx.save();
    ctx.fillStyle = player.color;
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.height / 2);
    ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
    ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Draw Bullets
    ctx.save();
    ctx.fillStyle = "#00ffff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 8;
    for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Draw Ships
    for (const s of ships) {
        ctx.save();

        if (s.isDiving) {
            ctx.fillStyle = "#ff3366";
            ctx.shadowColor = "#ff3366";
            ctx.shadowBlur = 15;
        } else {
            ctx.fillStyle = s.color;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 6;
        }

        ctx.fillRect(
            s.x - s.width / 2,
            s.y - s.height / 2,
            s.width,
            s.height
        );

        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.strokeRect(
            s.x - s.width / 2,
            s.y - s.height / 2,
            s.width,
            s.height
        );

        // Term label
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px 'Segoe UI', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        let label = s.term;
        if (label.length > 15) {
            label = label.substring(0, 13) + "..";
        }

        ctx.fillText(label, s.x, s.y);
        ctx.restore();
    }
}


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {
    if (gameStarted && !isGameOver) {
        // Player Controls
        if (keys["ArrowLeft"] || keys["a"] || keys["A"]) {
            player.x = Math.max(player.width / 2 + 10, player.x - player.speed);
        }
        if (keys["ArrowRight"] || keys["d"] || keys["D"]) {
            player.x = Math.min(CANVAS_WIDTH - player.width / 2 - 10, player.x + player.speed);
        }

        updateBullets();
        updateShips();
        draw();
    }

    requestAnimationFrame(gameLoop);
}


/* =========================================================
   LISTENERS
========================================================= */

window.addEventListener("keydown", (e) => {
    keys[e.key] = true;

    if (e.key === " " || e.key === "Spacebar") {
        e.preventDefault();
        fireBullet();
    }
});


window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});


restartButton.addEventListener("click", () => {
    initGame();
});


libraryButton.addEventListener("click", () => {
    window.location.href = "index.html";
});


soundButton.addEventListener("click", () => {
    if (window.soundSystem && typeof window.soundSystem.toggleMute === "function") {
        const muted = window.soundSystem.toggleMute();
        soundButton.textContent = muted ? "🔇" : "🔊";
    }
});


/* =========================================================
   STARTUP
========================================================= */

loadVocabularySet(setId).catch((err) => {
    loadingText.textContent = "Error Loading Set";
    loadingDetails.textContent = err.message;
});


requestAnimationFrame(gameLoop);


</script>
